<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK App</title>
<style>
:root{--bg:#0b1220;--card:#131c31;--line:#22304f;--tx:#e8eefc;--mut:#8fa0c4;--pri:#2f80ff;--acc:#ffb300;--ok:#2ecc71;--bad:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:16px;text-align:center;font-size:20px;font-weight:700;background:linear-gradient(135deg,#0d47a1,#2f80ff);position:sticky;top:0;z-index:5}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
input,select,textarea{width:100%;background:#0e1730;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
textarea.code{height:180px;direction:ltr;text-align:left;font-family:monospace;font-size:12px;margin-top:8px}
textarea.req{height:70px;margin-top:8px}
input.name{font-weight:700;font-size:16px}
iframe{width:100%;height:300px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}
button,.btn{flex:1;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;text-align:center;text-decoration:none;display:block}
button.sec{background:#243557}
button.acc{background:var(--acc);color:#222}
button.ghost{background:transparent;border:1px solid var(--line);margin-top:10px;width:100%}
button:disabled{opacity:.5}
.link{margin:4px 0 12px;display:flex;gap:8px}
.desc[hidden]{display:none}
.desc{margin-top:8px;border:1px dashed var(--acc);border-radius:12px;padding:8px}
.note{color:var(--mut);font-size:12px;line-height:1.7}
.errbox{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap}
.edit[hidden]{display:none}
.edit{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
details{margin-top:10px;color:var(--mut);font-size:13px}
.ver{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ver button{flex:none;padding:6px 12px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1730;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--acc)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;align-items:flex-end}
#sheet.on{display:flex}
.sheetbox{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.step small{display:block;color:var(--mut);margin-top:2px;white-space:pre-wrap}
.step.ok span{color:var(--ok)}.step.bad span{color:var(--bad)}.step.run span{color:var(--acc)}
.explain{background:#0e1730;border-radius:10px;padding:10px;margin-top:10px;font-size:14px;line-height:1.8;white-space:pre-wrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#243557;padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>👷 APK App</header>
<main id="main"></main>
<div id="sheet"></div>
<div id="toast"></div>
<nav>
  <button id="n-keys" onclick="go('keys')">🔑<br>المفاتيح</button>
  <button id="n-code" onclick="go('code')">💻<br>الكود</button>
  <button id="n-build" onclick="go('build')">🏗️<br>البناء</button>
</nav>

<script>
const MODELS={gemini:'gemini-3.8-flash',claude:'claude-sonnet-5-5'};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newApp=n=>({name:n,code:'',versions:[],err:'',apk:'',icon:''});
function slugOf(n){let s=String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(/^[0-9]/.test(s))s='a'+s;return s}
function load(){try{const x=JSON.parse(localStorage.getItem('apkapp')||'null');if(x&&x.apps)return x}catch(e){}
  return {keys:{provider:'gemini',repo:'apk-app'},apps:[newApp('first'),newApp('second')]}}
let S=load(),tab='keys';
let _sv;
function saveNow(){clearTimeout(_sv);try{localStorage.setItem('apkapp',JSON.stringify(S))}catch(e){toast('تعذّر الحفظ: المساحة ممتلئة. قلّل حجم الأكواد أو النسخ السابقة.')}}
const save=()=>{clearTimeout(_sv);_sv=setTimeout(saveNow,600)};
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function arErr(e){const m=String((e&&e.message)||e);
  if(/Failed to fetch|NetworkError|network|timeout/i.test(m))return 'تعذّر الاتصال. تأكد من الإنترنت.';
  if(/workflow/i.test(m)&&/scope|permission|allow/i.test(m))return 'مفتاح GitHub ينقصه صلاحية workflow. أنشئ مفتاحاً جديداً وفعّل repo و workflow.';
  if(/bad credentials|unauthorized|invalid.*(key|token)|API key|401/i.test(m))return 'المفتاح غير صحيح أو انتهت صلاحيته. راجع قائمة المفاتيح.\n('+m+')';
  return m}

/* ---------- الواجهات ---------- */
const FIELDS=[['ghToken','مفتاح GitHub (Token)','password','صلاحيات: repo + workflow'],['repo','اسم المستودع','text','apk-app'],['sbToken','مفتاح Supabase (Access Token)','password','يبدأ بـ sbp_'],['sbRef','Supabase project ref','text',''],['fbUrl','رابط Firebase (Realtime Database URL)','text','https://xxxx-default-rtdb.firebaseio.com'],['fbKey','مفتاح Firebase (Web API Key) - اختياري','password','يبدأ بـ AIza'],['gemini','مفتاح Gemini API','password',''],['gemini2','مفتاح Gemini إضافي 2 (من مشروع آخر) - اختياري','password',''],['gemini3','مفتاح Gemini إضافي 3 (من مشروع آخر) - اختياري','password',''],['claude','مفتاح Claude API','password',''],['orKey','مفتاح OpenRouter','password','يبدأ بـ sk-or-'],['orModel','اسم نموذج OpenRouter (انسخه من openrouter.ai/models)','text','مثال: openai/gpt-oss-120b:free'],['gqKey','مفتاح Groq','password','يبدأ بـ gsk_'],['gqModel','اسم نموذج Groq (اختياري)','text','openai/gpt-oss-120b']];
function vKeys(){return `<div class="card"><h2>🔑 قائمة المفاتيح</h2>
${FIELDS.map(f=>`<label>${f[1]}</label><input type="${f[2]}" value="${esc(S.keys[f[0]]||'')}" placeholder="${f[3]}" autocomplete="off" oninput="S.keys['${f[0]}']=this.value.trim();save()">`).join('')}
<label>الذكاء الاصطناعي المستخدم في التعديل</label>
<select onchange="S.keys.provider=this.value;save()">${[['gemini','Gemini'],['claude','Claude'],['openrouter','OpenRouter'],['groq','Groq']].map(p=>`<option value="${p[0]}" ${(S.keys.provider||'gemini')===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
<p class="note">تُحفظ المفاتيح تلقائياً داخل التطبيق على جهازك.</p></div>`}

function vCode(){const card=i=>{const a=S.apps[i];return `<section class="card">
<input class="name" value="${esc(a.name)}" placeholder="اسم التطبيق بالإنجليزية (مثل awad)" oninput="S.apps[${i}].name=this.value;save()">
<p class="note">اسم التطبيق يصير اسم المجلد: حروف إنجليزية وأرقام فقط</p>
<div class="row" style="align-items:center"><img id="ic${i}" src="${a.icon||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" style="width:56px;height:56px;border-radius:14px;background:#0e1730;border:1px solid var(--line);object-fit:cover;flex:none"><button class="sec" onclick="document.getElementById('icf${i}').click()">🖼 ${a.icon?'تغيير الأيقونة':'اختر أيقونة'}</button><input type="file" accept="image/*" id="icf${i}" hidden onchange="pickIcon(${i},this)"></div>
<button class="acc" style="width:100%;margin-top:8px" onclick="toggleDesc(${i})">✨ اكتب وصف التطبيق</button>
<div class="desc" id="desc${i}" hidden>
<textarea class="req" id="dsc${i}" placeholder="اكتب وصف التطبيق بكلمات بسيطة، مثال: تطبيق لتسجيل مصاريف البيت اليومية مع المجموع الشهري"></textarea>
<button class="acc" style="width:100%;margin-top:8px" onclick="aiCreate(${i},this)">🚀 أنشئ التطبيق وعاين</button>
<p class="note">لو في كود قديم، يتحفظ في "النسخ السابقة" وتقدر ترجع له.</p>
</div>
<textarea class="code" id="code${i}" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="الصق كود التطبيق هنا" oninput="S.apps[${i}].code=this.value;save()">${esc(a.code)}</textarea>
<iframe id="pv${i}" sandbox="allow-scripts allow-forms allow-modals"></iframe>
<div class="row"><button onclick="preview(${i})">▶ المعاينة الفعلية</button><button class="sec" onclick="toggleEdit(${i})">✏️ تعديل الكود</button></div>
<div class="edit" id="edit${i}" hidden>
<textarea class="req" id="req${i}" placeholder="اكتب التعديل المطلوب، مثال: غيّر لون الخلفية للأحمر"></textarea>
<div class="row"><button class="acc" onclick="aiEdit(${i},this)">نفّذ التعديل</button><button class="sec" onclick="aiFix(${i},this)">🛠 صلّح الخطأ</button></div>
<div class="errbox" id="err${i}">${esc(a.err)}</div>
<details><summary>النسخ السابقة (${a.versions.length})</summary>${a.versions.map((v,j)=>`<div class="ver"><span>${esc(v.t)}</span><button class="sec" onclick="restore(${i},${j})">رجوع</button></div>`).join('')||'<p>لا توجد نسخ بعد</p>'}</details>
</div></section>`};
return card(0)+`<div class="link"><button class="acc" onclick="linkApps(this)">🔗 ربط عبر Supabase</button><button class="acc" onclick="linkFirebase(this)">🔥 ربط عبر Firebase</button></div>`+card(1)}

function vBuild(){return `<div class="card"><h2>🏗️ قائمة البناء</h2><p class="note">اضغط بناء وسيتم رفع الكود إلى مجلد باسم التطبيق وبناء ملف APK تلقائياً، وتتابع المراحل هنا.</p></div>`+
S.apps.map((a,i)=>`<div class="card"><h2>${esc(a.name)}</h2><p class="note">المجلد: apps/${esc(slugOf(a.name)||'← اكتب اسماً إنجليزياً في قائمة الكود')}</p><button onclick="build(${i})">بناء ${esc(a.name)}</button>${a.apk?`<a class="btn acc" style="margin-top:8px" href="${esc(a.apk)}" target="_blank">⬇ تحميل آخر APK</a>`:''}</div>`).join('')}

function go(t){tab=t;render()}
function render(){
  $('#main').innerHTML=tab==='keys'?vKeys():tab==='code'?vCode():vBuild();
  ['keys','code','build'].forEach(k=>$('#n-'+k).classList.toggle('on',k===tab));
  if(tab==='code')S.apps.forEach((a,i)=>{if(a.code.trim()&&a.code.length<80000)preview(i)});
  window.scrollTo(0,0)}
function toggleEdit(i){const e=$('#edit'+i);e.hidden=!e.hidden}

/* ---------- المعاينة وتجميع الأخطاء ---------- */
const CATCH='<scr'+'ipt>window.addEventListener("error",function(e){parent.postMessage({apkErr:e.message+" (سطر "+e.lineno+")"},"*")});window.addEventListener("unhandledrejection",function(e){parent.postMessage({apkErr:String(e.reason)},"*")});<\/scr'+'ipt>';
function pushVersion(i){const a=S.apps[i];if(a.code.trim()&&(!a.versions[0]||a.versions[0].code!==a.code)){a.versions.unshift({t:new Date().toLocaleString('ar'),code:a.code});a.versions=a.versions.slice(0,8)}save()}
function preview(i){const a=S.apps[i];pushVersion(i);a.err='';save();
  const el=$('#err'+i);if(el)el.textContent='';
  const f=$('#pv'+i);if(!f)return;
  let c=a.code;c=/<head[^>]*>/i.test(c)?c.replace(/<head[^>]*>/i,m=>m+CATCH):CATCH+c;f.srcdoc=c}
window.addEventListener('message',e=>{if(!e.data||!e.data.apkErr)return;
  S.apps.forEach((a,i)=>{const f=$('#pv'+i);if(f&&e.source===f.contentWindow){a.err+=(a.err?'\n':'')+e.data.apkErr;save();const el=$('#err'+i);if(el)el.textContent='⚠ '+a.err}})});
function restore(i,j){pushVersion(i);S.apps[i].code=S.apps[i].versions[j].code;save();render();toast('تم الرجوع للنسخة')}

/* ---------- الذكاء الاصطناعي ---------- */
const OAI={openrouter:{url:'https://openrouter.ai/api/v1/chat/completions',key:'orKey',model:'orModel',def:'',name:'OpenRouter'},groq:{url:'https://api.groq.com/openai/v1/chat/completions',key:'gqKey',model:'gqModel',def:'openai/gpt-oss-120b',name:'Groq'}};
async function ai(prompt){const k=S.keys;
  if(OAI[k.provider]){const c=OAI[k.provider];const key=k[c.key],model=k[c.model]||c.def;
    if(!key)throw new Error('أدخل مفتاح '+c.name+' في قائمة المفاتيح');
    if(!model)throw new Error('اكتب اسم النموذج في قائمة المفاتيح (انسخه من openrouter.ai/models واختر نموذجاً مجانياً ينتهي بـ :free)');
    const r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:model,messages:[{role:'user',content:prompt}],max_tokens:8000})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('فشل الاتصال بـ '+c.name+' (خطأ '+r.status+')'));
    const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!t)throw new Error('رد فارغ من '+c.name+'. جرّب نموذجاً آخر.');
    return t}
  if(k.provider==='claude'){
    if(!k.claude)throw new Error('أدخل مفتاح Claude في قائمة المفاتيح');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k.claude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODELS.claude,max_tokens:16000,messages:[{role:'user',content:prompt}]})});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'فشل الاتصال بـ Claude');
    return j.content.map(c=>c.text||'').join('')}
  const gk=[k.gemini,k.gemini2,k.gemini3].filter(Boolean);
  if(!gk.length)throw new Error('أدخل مفتاح Gemini في قائمة المفاتيح');
  let last;
  for(let n=0;n<gk.length;n++){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODELS.gemini+':generateContent?key='+encodeURIComponent(gk[n]),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){if(!j.candidates||!j.candidates[0]||!j.candidates[0].content)throw new Error('رد فارغ من Gemini، حاول مرة أخرى.');return (j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')}
    const msg=(j.error&&j.error.message)||'فشل الاتصال بـ Gemini';
    last=new Error(msg);
    if(!(r.status===429||/quota|exhaust/i.test(msg)))throw last;
    if(n<gk.length-1)toast('حصة المفتاح '+(n+1)+' خلصت، التحويل للمفتاح '+(n+2))}
  throw last}
function clean(t){const m=t.match(/```(?:\w+)?\n([\s\S]*?)```/);return (m?m[1]:t).trim()}
const SYS='أنت مبرمج محترف. التطبيق مكتوب بـ HTML وCSS وJavaScript في ملف واحد index.html ويعمل داخل تطبيق أندرويد. أعد الكود الكامل فقط داخل كتلة ```html بدون أي شرح.\n\n';
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='⏳ جاري العمل...';try{await fn()}catch(e){toast(arErr(e))}finally{btn.disabled=false;btn.textContent=t}}
function setCode(i,c){pushVersion(i);S.apps[i].code=c;save();const t=$('#code'+i);if(t)t.value=c;preview(i)}
function aiEdit(i,btn){busy(btn,async()=>{const req=$('#req'+i).value.trim();if(!req)throw new Error('اكتب التعديل المطلوب');
  const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\nالتعديل المطلوب: '+req);
  setCode(i,clean(out));$('#req'+i).value='';toast('تم التعديل ✔')})}
function aiFix(i,btn){busy(btn,async()=>{preview(i);await sleep(1500);const err=S.apps[i].err;
  const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\n'+(err?'الأخطاء الظاهرة عند التشغيل:\n'+err:'لم تظهر أخطاء صريحة، افحص الكود وأصلح أي مشكلة تمنع عمله.')+'\n\nأصلح الخطأ.');
  setCode(i,clean(out));toast('تم إصلاح الكود ✔')})}

/* ---------- نافذة المراحل ---------- */
function closeSheet(){$('#sheet').classList.remove('on')}
function progress(title,labels){const sh=$('#sheet');const st=labels.map(()=>({s:'wait',m:''}));let extra='';
  const icon={wait:'○',run:'◔',ok:'✔',bad:'✖'};
  function draw(){sh.innerHTML=`<div class="sheetbox"><h3>${esc(title)}</h3>${labels.map((l,i)=>`<div class="step ${st[i].s}"><span>${icon[st[i].s]}</span><div>${esc(l)}<small>${esc(st[i].m)}</small></div></div>`).join('')}<div>${extra}</div><button class="ghost" onclick="closeSheet()">إغلاق</button></div>`;sh.classList.add('on')}
  draw();return {set(i,s,m){st[i]={s:s,m:m===undefined?st[i].m:m};draw()},extra(h){extra=h;draw()}}}

/* ---------- Supabase ---------- */
async function sb(path,opt){opt=opt||{};const r=await fetch('https://api.supabase.com'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+S.keys.sbToken,'Content-Type':'application/json'}}));
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}
  if(!r.ok){if(r.status===401||r.status===403)throw new Error('مفتاح Supabase غير صحيح. استخدم Access Token من حسابك (يبدأ بـ sbp_).');throw new Error((j&&j.message)||('خطأ Supabase '+r.status))}
  return j}
function parseSections(t){const m=t.match(/===SQL===([\s\S]*?)===APP1===([\s\S]*?)===APP2===([\s\S]*)$/);if(!m)throw new Error('رد الذكاء الاصطناعي غير مكتمل، حاول مرة أخرى.');return {sql:clean(m[1]),a1:clean(m[2]),a2:clean(m[3])}}
function linkApps(btn){busy(btn,async()=>{const k=S.keys;
  if(!k.sbToken||!k.sbRef)throw new Error('أدخل مفتاح Supabase والـ project ref في قائمة المفاتيح');
  if(!S.apps[0].code.trim()||!S.apps[1].code.trim())throw new Error('اكتب كود التطبيقين أولاً');
  const P=progress('ربط التطبيقين عبر Supabase',['قراءة بيانات المشروع','الذكاء الاصطناعي يصمم الجداول والصلاحيات','تنفيذ الجداول في قاعدة البيانات','تعديل كود التطبيقين للاتصال']);
  try{
    P.set(0,'run');
    const keys=await sb('/v1/projects/'+k.sbRef+'/api-keys');
    const anon=(keys.find(x=>x.name==='anon')||{}).api_key;if(!anon)throw new Error('ما قدرت أجيب مفتاح المشروع. تأكد من الـ project ref.');
    const url='https://'+k.sbRef+'.supabase.co';P.set(0,'ok');

/* ---------- GitHub والبناء ---------- */
async function gh(path,opt){opt=opt||{};const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+S.keys.ghToken,Accept:'application/vnd.github+json','Content-Type':'application/json'}}));
  if(r.status===204)return {};const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j={message:t}}
  if(!r.ok){const er=new Error(j.message||('خطأ GitHub '+r.status));er.status=r.status;throw er}return j}
async function ghText(path){const r=await fetch('https://api.github.com'+path,{headers:{Authorization:'Bearer '+S.keys.ghToken,Accept:'application/vnd.github+json'}});return r.text()}
async function repoFull(){let r=(S.keys.repo||'apk-app').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'');
  if(!r.includes('/')){const u=await gh('/user');r=u.login+'/'+r}return r}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(repo,branch,path,content){let sha;
  try{sha=(await gh('/repos/'+repo+'/contents/'+path+'?ref='+branch)).sha}catch(e){if(e.status!==404)throw e}
  await gh('/repos/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify({message:'build: '+path,content:b64(content),branch:branch,sha:sha})})}
async function putB64(repo,branch,path,data){let sha;
  try{sha=(await gh('/repos/'+repo+'/contents/'+path+'?ref='+branch)).sha}catch(e){if(e.status!==404)throw e}
  await gh('/repos/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify({message:'icon: '+path,content:data,branch:branch,sha:sha})})}
function pickIcon(i,inp){const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
      const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
      x.drawImage(im,sx,sy,m,m,0,0,512,512);
      try{S.apps[i].icon=c.toDataURL('image/png');save();$('#ic'+i).src=S.apps[i].icon;toast('تم اختيار الأيقونة ✔ تظهر بعد البناء')}
      catch(e){S.apps[i].icon='';toast('الصورة كبيرة أو غير مدعومة، جرّب صورة ثانية')}};
    im.onerror=()=>toast('تعذّر قراءة الصورة');
    im.src=rd.result};
  rd.readAsDataURL(f);inp.value=''}
const pkg=n=>JSON.stringify({name:n,version:'1.0.0',private:true,dependencies:{'@capacitor/android':'^7.0.0','@capacitor/core':'^7.0.0'},devDependencies:{'@capacitor/cli':'^7.0.0'}},null,2);
const cfg=(n,name)=>JSON.stringify({appId:'com.myapps.'+n,appName:name||n,webDir:'www'},null,2);
const LOGS={};

async function build(i){const a=S.apps[i],key=slugOf(a.name);
  if(!key)return toast('اكتب اسم التطبيق بالإنجليزية (حروف وأرقام فقط)');
  if(S.apps.some((x,j)=>j!==i&&slugOf(x.name)===key))return toast('هذا الاسم مستخدم للتطبيق الآخر، غيّره');
  if(!a.code.trim())return toast('اكتب الكود أولاً');
  if(!S.keys.ghToken)return toast('أدخل مفتاح GitHub في قائمة المفاتيح');
  const P=progress('بناء: '+a.name,['التحقق من الحساب والمستودع','رفع الكود إلى apps/'+key,'تشغيل البناء','جاري بناء ملف APK','تجهيز ملف التحميل']);
  let step=0;
  try{
    P.set(0,'run');const repo=await repoFull();let info;
    try{info=await gh('/repos/'+repo)}catch(e){if(e.status===404){info=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:repo.split('/')[1],auto_init:true,private:false})});await sleep(3000)}else throw e}
    const branch=info.default_branch||'main';P.set(0,'ok','المستودع: '+repo);
    step=1;P.set(1,'run');const dir='apps/'+key;
    try{await gh('/repos/'+repo+'/contents/.github/workflows/build-app.yml?ref='+branch)}catch(e){if(e.status===404)throw new Error('ملف build-app.yml غير موجود في المستودع');throw e}
    await put(repo,branch,dir+'/www/index.html',a.code);
    await put(repo,branch,dir+'/package.json',pkg(key));
    await put(repo,branch,dir+'/capacitor.config.json',cfg(key,a.name));
    if(a.icon)await putB64(repo,branch,dir+'/icon.png',a.icon.split(',')[1]);
    P.set(1,'ok');
    step=2;P.set(2,'run');const t0=Date.now();
    for(let n=0;n<8;n++){try{await gh('/repos/'+repo+'/actions/workflows/build-app.yml/dispatches',{method:'POST',body:JSON.stringify({ref:branch,inputs:{app:key}})});break}
      catch(e){if((e.status===404||e.status===422)&&n<7){P.set(2,'run','بانتظار تجهيز خطوات البناء...');await sleep(4000)}else throw e}}
    P.set(2,'ok');step=3;P.set(3,'run','بانتظار الخادم...');
    let run=null;const lim=Date.now()+30*60000;
    while(Date.now()<lim){await sleep(6000);
      const rs=await gh('/repos/'+repo+'/actions/workflows/build-app.yml/runs?event=workflow_dispatch&per_page=5');
      run=rs.workflow_runs.find(x=>new Date(x.created_at).getTime()>=t0-30000)||null;
      if(run){P.set(3,'run',run.status==='completed'?'انتهى':run.status==='queued'?'في الانتظار...':'جاري البناء... (قد يستغرق 3-6 دقائق)');if(run.status==='completed')break}}
    if(!run||run.status!=='completed')throw new Error('انتهى وقت الانتظار. حاول مرة أخرى.');
    if(run.conclusion!=='success'){
      const jobs=await gh('/repos/'+repo+'/actions/runs/'+run.id+'/jobs');
      const job=jobs.jobs.find(j=>j.conclusion==='failure')||jobs.jobs[0];
      const fs=(job.steps||[]).find(s=>s.conclusion==='failure');
      let log='';try{log=(await ghText('/repos/'+repo+'/actions/jobs/'+job.id+'/logs')).slice(-5000)}catch(e){}
      LOGS[i]=log;P.set(3,'bad','فشل البناء'+(fs?' في خطوة: '+fs.name:''));
      let ex='';
      try{ex=await ai('اشرح بالعربي البسيط وبأقصى وضوح، في 3 أسطر كحد أقصى، سبب فشل بناء تطبيق الأندرويد هذا وما الحل. السجل:\n'+log)}catch(e){ex='السجل:\n'+log.slice(-800)}
      P.extra('<div class="explain">'+esc(ex)+'</div><button class="acc" style="margin-top:10px" onclick="fixBuild('+i+')">🛠 صلّح تلقائياً وأعد البناء</button>');return}
    P.set(3,'ok');step=4;P.set(4,'run');
    const tag=key+'-build-'+run.run_number;let asset=null;
    for(let n=0;n<8&&!asset;n++){try{const rel=await gh('/repos/'+repo+'/releases/tags/'+tag);asset=(rel.assets||[]).find(x=>/\.apk$/.test(x.name))}catch(e){}if(!asset)await sleep(3000)}
    if(!asset)throw new Error('تم البناء لكن لم أجد ملف APK.');
    a.apk=asset.browser_download_url;save();P.set(4,'ok');
    P.extra('<a class="btn acc" style="margin-top:10px" href="'+esc(a.apk)+'" target="_blank">⬇ تحميل APK</a>');
  }catch(e){P.set(step,'bad',arErr(e))}}

async function fixBuild(i){closeSheet();toast('جاري إصلاح الكود...');
  try{const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\nفشل بناء التطبيق بهذا الخطأ:\n'+(LOGS[i]||'')+'\n\nأصلح الكود ليعمل ويُبنى بنجاح.');

    P.set(3,'ok');step=4;P.set(4,'run');

    for(let n=0;n<8&&!asset;n++){try{const rel=await gh('/repos/'+repo+'/releases/tags/'+tag);asset=(rel.assets||[]).find(x=>/\.apk$/.test(x.name))}catch(e){}if(!asset)await sleep(3000)}

  }catch(e){P.set(step,'bad',arErr(e))}}

function sysFor(i){
  if(langOf(i)==='flutter')return 'أنت مبرمج Flutter محترف. اكتب ملف main.dart واحداً كاملاً يعمل مباشرة، بدون أي حزم خارجية غير flutter/material.dart، وبواجهة عربية من اليمين لليسار. أعد الكود الكامل فقط داخل كتلة '+BT+'dart بدون أي شرح.\n\n';

/* تغيير اللغة */

  if(a.code.trim()&&!confirm('الكود الحالي يبقى كما هو وتتغير اللغة فقط. تكمل؟')){render();return}

function aiPreview(i,btn){busy(btn,async()=>{

        a.code=clean(out);a.pv=h}
      save();P.set(n,'ok','')}
    P.extra('<p style="color:var(--ok)">تم ✔ افتح تبويب الكود وعاين.</p>'+(lang==='html'?'':'<p class="note">معاينة Flutter وPython هنا هي تصميم القالب الأصلي. بعد أي تعديل اضغط «معاينة بالذكاء الاصطناعي».</p>')+'<button class="acc" style="margin-top:10px;width:100%" onclick="closeSheet();go(\'code\')">💻 اذهب للكود</button>');

/* ملفات البناء (تُنشأ تلقائياً في GitHub لو ناقصة) */
const WF_FLUTTER=`name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: create project
        run: |
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: build
        working-directory: flutter_out
        run: flutter build apk --release
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-\${{ inputs.app }}-build-\${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk
`;

const WF_PYTHON=`name: build-python
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: write spec
        working-directory: apps/\${{ inputs.app }}
        run: |
          cat > buildozer.spec <<EOF
          [app]
          title = $APP
          package.name = app$APP
          package.domain = com.myapps
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = 1.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2

          EOF
          sed -i 's/^ *//' buildozer.spec
          if [ -f icon.png ]; then sed -i '/^\\[app\\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec; fi
      - name: cache
        uses: actions/cache@v4
        with:
          path: apps/\${{ inputs.app }}/.buildozer
          key: buildozer-\${{ inputs.app }}-\${{ github.run_number }}
          restore-keys: buildozer-\${{ inputs.app }}-
      - name: build
        working-directory: apps/\${{ inputs.app }}

      - name: release

function buildAny(i){
  const l=langOf(i);
  if(l==='html')return _build0(i);
  return buildNative(i,l)}

async function buildNative(i,l){const a=S.apps[i],key=slugOf(a.name),W=WF[l];
  if(!key)return toast('اكتب اسم التطبيق بالإنجليزية (حروف وأرقام فقط)');
  if(S.apps.some((x,j)=>j!==i&&slugOf(x.name)===key))return toast('هذا الاسم مستخدم للتطبيق الآخر، غيّره');
  if(!a.code.trim())return toast('اكتب الكود أولاً');
  if(!S.keys.ghToken)return toast('أدخل مفتاح GitHub في قائمة المفاتيح');
  const P=progress(W.name+': '+a.name,['التحقق من المستودع وملف البناء','رفع الكود إلى apps/'+key,'تشغيل البناء','جاري بناء ملف APK','تجهيز ملف التحميل']);
  let step=0;
  try{
    P.set(0,'run');const repo=await repoFull();const info=await gh('/repos/'+repo);const branch=info.default_branch||'main';
    let has=true;
    try{await gh('/repos/'+repo+'/contents/.github/workflows/'+W.file+'?ref='+branch)}catch(e){if(e.status===404)has=false;else throw e}
    if(!has){P.set(0,'run','إنشاء ملف البناء '+W.file+' تلقائياً...');await put(repo,branch,'.github/workflows/'+W.file,W.yaml);await sleep(5000)}
    P.set(0,'ok','المستودع: '+repo);
    step=1;P.set(1,'run');const d='apps/'+key;
    await put(repo,branch,d+'/'+W.main,a.code);
    if(a.icon)await putB64(repo,branch,d+'/icon.png',a.icon.split(',')[1]);
    P.set(1,'ok');
    step=2;P.set(2,'run');const t0=Date.now();
    for(let n=0;n<8;n++){try{await gh('/repos/'+repo+'/actions/workflows/'+W.file+'/dispatches',{method:'POST',body:JSON.stringify({ref:branch,inputs:{app:key}})});break}
      catch(e){if((e.status===404||e.status===422)&&n<7){P.set(2,'run','بانتظار تجهيز خطوات البناء...');await sleep(4000)}else throw e}}
    P.set(2,'ok');step=3;P.set(3,'run','بانتظار الخادم...');
    let run=null;const lim=Date.now()+W.maxMin*60000;
    while(Date.now()<lim){await sleep(8000);
      const rs=await gh('/repos/'+repo+'/actions/workflows/'+W.file+'/runs?event=workflow_dispatch&per_page=5');
      run=rs.workflow_runs.find(x=>new Date(x.created_at).getTime()>=t0-30000)||null;
      if(run){P.set(3,'run',run.status==='completed'?'انتهى':run.status==='queued'?'في الانتظار...':'جاري البناء... (قد يستغرق '+W.min+' دقيقة)');if(run.status==='completed')break}}
    if(!run||run.status!=='completed')throw new Error('انتهى وقت الانتظار. تابع البناء من تبويب Actions في GitHub.');
    if(run.conclusion!=='success'){
      const jobs=await gh('/repos/'+repo+'/actions/runs/'+run.id+'/jobs');
      const job=jobs.jobs.find(j=>j.conclusion==='failure')||jobs.jobs[0];
      const fst=(job.steps||[]).find(s=>s.conclusion==='failure');
      let log='';try{log=(await ghText('/repos/'+repo+'/actions/jobs/'+job.id+'/logs')).slice(-5000)}catch(e){}
      LOGS[i]=log;P.set(3,'bad','فشل البناء'+(fst?' في خطوة: '+fst.name:''));
      let ex='';
      try{ex=await ai('اشرح بالعربي البسيط وبأقصى وضوح، في 3 أسطر كحد أقصى، سبب فشل بناء تطبيق الأندرويد هذا وما الحل. السجل:\n'+log)}catch(e){ex='السجل:\n'+log.slice(-800)}
      P.extra('<div class="explain">'+esc(ex)+'</div><button class="acc" style="margin-top:10px" onclick="fixNative('+i+')">🛠 صلّح تلقائياً وأعد البناء</button>');return}
    P.set(3,'ok');step=4;P.set(4,'run');
    const tag=W.tag+'-'+key+'-build-'+run.run_number;let asset=null;
    for(let n=0;n<8&&!asset;n++){try{const rel=await gh('/repos/'+repo+'/releases/tags/'+tag);asset=(rel.assets||[]).find(x=>/\.apk$/.test(x.name))}catch(e){}if(!asset)await sleep(3000)}
    if(!asset)throw new Error('تم البناء لكن لم أجد ملف APK.');
    a.apk=asset.browser_download_url;save();P.set(4,'ok');
    P.extra('<a class="btn acc" style="margin-top:10px" href="'+esc(a.apk)+'" target="_blank">⬇ تحميل APK</a>');
  }catch(e){P.set(step,'bad',arErr(e))}}

async function fixNative(i){closeSheet();toast('جاري إصلاح الكود...');
  try{const l=langOf(i);
    const out=await ai(sysFor(i)+'الكود الحالي:\n'+BT+FENCE[l]+'\n'+S.apps[i].code+'\n'+BT+'\n\nفشل بناء التطبيق بهذا الخطأ:\n'+(LOGS[i]||'')+'\n\nأصلح الكود ليُبنى بنجاح.');
    setCode(i,clean(out));buildNative(i,l)}catch(e){toast(arErr(e))}}

const GEM_DEF=MODELS.gemini;
const _ai1=ai;
ai=function(p){MODELS.gemini=S.keys.geminiModel||GEM_DEF;return _ai1(p)};

function loadGemModels(btn){busy(btn,async()=>{
  const k=S.keys.gemini||S.keys.gemini2||S.keys.gemini3;
  if(!k)throw new Error('أدخل مفتاح Gemini أولاً');
  let out=[],tok='';
  for(let n=0;n<5;n++){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100&key='+encodeURIComponent(k)+(tok?'&pageToken='+encodeURIComponent(tok):''));
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&j.error.message)||'تعذّر جلب النماذج');
    (j.models||[]).forEach(m=>{if((m.supportedGenerationMethods||[]).indexOf('generateContent')>-1)out.push(m.name.replace(/^models\//,''))});
    tok=j.nextPageToken||'';if(!tok)break}
  if(!out.length)throw new Error('لم أجد نماذج متاحة لهذا المفتاح');
  window._gm=out;fillGem();toast('وجدت '+out.length+' نموذج ✔ اختر من القائمة')})}

function pickGem(v){if(!v)return;S.keys.geminiModel=v;$('#gmodel').value=v;save();toast('تم اختيار '+v)}

  $('#main').appendChild(c);fillGem()}

function pkgOk(p){return /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(p)&&!p.split('.').some(s=>JKW.indexOf(s)>-1)}

const _put1=put;
put=async function(repo,branch,path,content){
  let m=path.match(/^apps\/([^/]+)\/capacitor\.config\.json$/);
  if(m){const pk=pkgForKey(m[1]);if(pk){try{const o=JSON.parse(content);o.appId=pk;content=JSON.stringify(o,null,2)}catch(e){}}}
  await _put1(repo,branch,path,content);
  m=path.match(/^apps\/([^/]+)\/main\.(dart|py)$/);
  if(m)await _put1(repo,branch,'apps/'+m[1]+'/pkg.txt',(pkgForKey(m[1])||'')+'\n')};

const WF_FLUTTER3=`# v3
# v2 compatible
name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: create project
        run: |
          PKG=$(cat apps/$APP/pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app_$APP; fi
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' flutter_out/android/app/src/main/AndroidManifest.xml
          sed -i "/applicationId/s|com.myapps.app_$APP|$PKG|" flutter_out/android/app/build.gradle*
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: build
        working-directory: flutter_out
        run: flutter build apk --release
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-\${{ inputs.app }}-build-\${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk
`;

    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: write spec
        working-directory: apps/\${{ inputs.app }}
        run: |
          PKG=$(cat pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app$APP; fi
          NAM=$(echo "$PKG" | awk -F. '{print $NF}')
          DOM=$(echo "$PKG" | sed 's/\\.[^.]*$//')
          cat > buildozer.spec <<EOF
          [app]
          title = $APP
          package.name = $NAM
          package.domain = $DOM
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = 1.0
          requirements = python3,kivy==2.3.0,certifi
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          sed -i 's/^ *//' buildozer.spec
          if [ -f icon.png ]; then sed -i '/^\\[app\\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec; fi
      - name: cache
        uses: actions/cache@v4
        with:
          path: apps/\${{ inputs.app }}/.buildozer
          key: buildozer-\${{ inputs.app }}-\${{ github.run_number }}
          restore-keys: buildozer-\${{ inputs.app }}-
      - name: build
        working-directory: apps/\${{ inputs.app }}
        run: buildozer -v android debug
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-\${{ inputs.app }}-build-\${{ github.run_number }}
          files: apps/\${{ inputs.app }}/bin/*.apk
`;

/* ===== إضافة: قراءة التطبيق الآخر وفهمه قبل الإنشاء أو المطابقة ===== */
const CS_MARK='كود التطبيق الآخر:\n';
const CS_ASK='اقرأ كود التطبيق التالي بعناية وافهمه جيداً، ثم اكتب ملخصاً دقيقاً ومنظماً بنقاط يشمل:\n1) فكرة التطبيق ودوره (زبون أم إدارة أم غيره).\n2) مكان تخزين البيانات: في Supabase اذكر الرابط والمفتاح وأسماء الجداول والأعمدة وأنواعها، وفي Firebase اذكر الرابط والمسارات، أو مفاتيح localStorage.\n3) شكل كل عنصر بيانات وحقوله والقيم الثابتة مثل حالات الطلب.\n4) ما يكتبه هذا التطبيق وما يقرأه، وطريقة التحديث.\n5) الألوان والخطوط ونمط التصميم.\nاكتب الملخص نصاً فقط بدون إعادة كتابة الكود.\n\n';

/* عند إنشاء تطبيق بالوصف: يقرأ كود التطبيق الآخر ويفهمه أولاً ثم يكتب */
const _ai5=ai;
ai=async function(p){
  const k=p.indexOf(CS_MARK);
  if(k>-1&&p.indexOf('فهم مسبق للتطبيق الآخر')<0){
    try{
      toast('أقرأ التطبيق الآخر وأفهمه أولاً...');
      const sum=(await _ai5(CS_ASK+p.slice(k+CS_MARK.length))).trim();
      p+='\n\nفهم مسبق للتطبيق الآخر (استخلصته من قراءة كوده، التزم به حرفياً في أسماء الجداول والحقول والقيم والمسارات ومفاتيح التخزين):\n'+sum;
    }catch(e){}
  }
  return _ai5(p)};

/* عند لصق كود: زر يقرأ التطبيق الآخر ويطابق هذا الكود عليه */
function aiMatch(i,btn){return busy(btn,async()=>{
  const a=S.apps[i],o=S.apps[1-i];
  if(!a.code.trim())throw new Error('الصق كود هذا التطبيق أولاً');
  if(!o.code.trim())throw new Error('اكتب كود التطبيق الآخر أولاً ليقرأه');
  toast('أقرأ التطبيق الآخر وأفهمه أولاً...');
  const sum=(await _ai5(CS_ASK+BT+FENCE[langOf(1-i)]+'\n'+o.code+'\n'+BT)).trim();
  const l=langOf(i);
  const out=await ai((l==='html'?SYS:sysFor(i))+'عدّل هذا التطبيق ليتكامل مع التطبيق الآخر ويتشاركان نفس البيانات.\n\nملخص فهمي للتطبيق الآخر:\n'+sum+'\n\nالتزم حرفياً بنفس أسماء الجداول والحقول والقيم ومفاتيح التخزين وطريقة الاتصال، وأبقِ بقية وظائف هذا التطبيق وتصميمه كما هي. أعد الكود الكامل فقط.\n\nالتطبيق المطلوب تعديله:\n'+BT+FENCE[l]+'\n'+a.code+'\n'+BT);
  setCode(i,clean(out));toast('تمت المطابقة ✔')})}

window.cxTest=async function(k,btn){
  const t=btn.textContent;
  btn.disabled=true;btn.textContent='⏳ جاري الاختبار...';
  const e=$('#cxr-'+k);if(e){e.style.color='var(--mut)';e.textContent=''}
  try{
    const K=S.keys;
    if(k==='gh'){
      if(!K.ghToken)throw new Error('أدخل مفتاح GitHub أولاً');
      const H={Authorization:'Bearer '+K.ghToken,Accept:'application/vnd.github+json'};
      const r=await fetch('https://api.github.com/user',{headers:H});
      const j=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(r.status===401?'المفتاح غير صحيح أو انتهت صلاحيته':(j.message||('خطأ '+r.status)));
      let msg='الحساب: '+j.login,warn='';
      const sc=r.headers.get('x-oauth-scopes');
      if(sc!==null){
        const s=sc.split(',').map(x=>x.trim());
        if(s.indexOf('repo')<0)warn+='\nينقصه صلاحية repo';
        if(s.indexOf('workflow')<0)warn+='\nينقصه صلاحية workflow';
      }
      try{
        const full=await repoFull();
        const rr=await fetch('https://api.github.com/repos/'+full,{headers:H});
        msg+='\n'+(rr.ok?'المستودع: '+full+' موجود':'المستودع '+full+' غير موجود (سيُنشأ عند أول بناء)');
      }catch(x){}
      res('gh',warn?'w':true,msg+warn);
    }else if(k==='sb'){
      if(!K.sbToken||!K.sbRef)throw new Error('أدخل مفتاح Supabase والـ project ref');
      const keys=await sb('/v1/projects/'+K.sbRef+'/api-keys');
      const anon=(keys.find(x=>x.name==='anon')||{}).api_key;
      if(!anon)throw new Error('المفتاح شغّال لكن ما لقيت مفتاح المشروع. تأكد من الـ project ref.');
      res('sb',true,'الاتصال سليم والمشروع موجود');
    }else if(k==='fb'){
      const url=(K.fbUrl||'').trim().replace(/\/+$/,'');
      if(!url)throw new Error('أدخل رابط Firebase أولاً');
      if(!/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(url))throw new Error('رابط Firebase غير صحيح. شكله: https://اسم-مشروعك-default-rtdb.firebaseio.com');
      let r;
      try{r=await fetch(url+'/apk_test.json',{method:'PUT',body:JSON.stringify({ok:Date.now()})})}
      catch(x){throw new Error('تعذّر الاتصال بـ Firebase. تأكد من الرابط ومن الإنترنت.')}
      if(r.status===401||r.status===403)throw new Error('Firebase يرفض الكتابة. اضبط Rules على: {"rules":{".read":true,".write":true}} واضغط Publish.');
      if(!r.ok)throw new Error('الرابط غير صحيح أو قاعدة البيانات غير موجودة (خطأ '+r.status+').');
      try{await fetch(url+'/apk_test.json',{method:'DELETE'})}catch(x){}
      res('fb',true,'الاتصال والكتابة شغّالين');
    }else if(k==='ai'){
      const out=await ai('أجب بكلمة واحدة فقط: تم');
      res('ai',true,'رد '+(K.provider||'gemini')+': '+String(out).trim().slice(0,60));
    }
  }catch(er){
    res(k,false,arErr(er));
  }
  btn.disabled=false;btn.textContent=t;
};

function cs(a){
  const s=a.set||{};
  const label=String(s.label||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,30);
  return {
    label:label,

  };
}
function nextVer(a){const n=(a.vc||0)+1;return {name:(a.vbase||'1.0')+'.'+n,code:n}}
function settingsJSON(a){
  const s=cs(a),v=nextVer(a);
  return JSON.stringify({label:s.label,brand:s.brand,ori:s.ori,splash:s.splash,versionName:v.name,versionCode:v.code},null,2);
}
function isLight(h){
  const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>150;
}

async function ensureWf4(l){

/* ---------- رفع الإعدادات مع كل بناء ---------- */
const _put2=put;
put=async function(repo,branch,path,content){
  const m=String(path).match(/^apps\/([^/]+)\/(.+)$/);
  const idx=m?S.apps.findIndex(x=>slugOf(x.name)===m[1]):-1;
  if(idx<0)return _put2(repo,branch,path,content);
  const a=S.apps[idx],rest=m[2],dir='apps/'+m[1];
  if(rest==='capacitor.config.json'){
    try{
      const o=JSON.parse(content),s=cs(a);
      if(s.label)o.appName=s.label;
      if(s.splash)o.backgroundColor=s.brand;
      content=JSON.stringify(o,null,2);
    }catch(e){}
  }else if(rest==='package.json'){
    try{
      const o=JSON.parse(content);
      o.scripts=o.scripts||{};
      o.scripts['capacitor:update:after']='node apk-settings.js';
      o.scripts['capacitor:sync:after']='node apk-settings.js';
      content=JSON.stringify(o,null,2);
    }catch(e){}
  }else if(rest==='www/index.html'){
    content=addSplash(content,a);
  }
  await _put2(repo,branch,path,content);
  if(rest==='www/index.html'){
    if(cs(a).splash&&a.icon)await putB64(repo,branch,dir+'/www/splash.png',a.icon.split(',')[1]);
    await _put2(repo,branch,dir+'/settings.json',settingsJSON(a));
    await _put2(repo,branch,dir+'/apk-settings.js',HOOK);
  }else if(rest==='main.dart'||rest==='main.py'){
    await _put2(repo,branch,dir+'/settings.json',settingsJSON(a));
  }
};

class DsFade extends StatelessWidget {

  final Widget child;

  @override
  Widget build(BuildContext context) {

    return TweenAnimationBuilder<double>(
      tween: Tween<double>(begin: 0.0, end: 1.0),
      duration: Duration(milliseconds: 380 + n * 60),
      curve: Curves.easeOutCubic,
      builder: (context, v, w) => Opacity(
        opacity: v,
        child: Transform.translate(offset: Offset(0, (1 - v) * 18), child: w),
      ),
      child: child,
    );
  }

void dsToast(BuildContext context, String msg) {

  ScaffoldMessenger.of(context)
    ..hideCurrentSnackBar()
    ..showSnackBar(
      SnackBar(
        content: Text(
          msg,
          textAlign: TextAlign.center,
          style: TextStyle(color: c.dark ? const Color(0xFF0B1020) : Colors.white, fontWeight: FontWeight.w700),

        duration: const Duration(milliseconds: 2200),
      ),
    );
}

void dsUndo(BuildContext context, String msg, VoidCallback onUndo) {
  final c = DsPal.of(context);
  ScaffoldMessenger.of(context)
    ..hideCurrentSnackBar()
    ..showSnackBar(
      SnackBar(
        content: Text(
          msg,
          style: TextStyle(color: c.dark ? const Color(0xFF0B1020) : Colors.white, fontWeight: FontWeight.w700),

    );
}

function raster(sn,w,h){
  return new Promise(function(res,rej){
    const X='http://www.w3.org/1999/xhtml';
    const inner='<div xmlns="'+X+'" style="width:'+w+'px;height:'+h+'px;overflow:hidden;position:relative">'+sn.st+sn.body+'</div>';
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"'+(sn.theme?' data-theme="'+sn.theme+'"':'')+'><foreignObject x="0" y="0" width="'+w+'" height="'+h+'">'+inner+'</foreignObject></svg>';
    const img=new Image();
    img.onload=function(){
      try{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');
        x.fillStyle='#ffffff';x.fillRect(0,0,w,h);
        x.drawImage(img,0,0);
        res(c.toDataURL('image/jpeg',0.72).split(',')[1]);
      }catch(e){rej(e)}
    };
    img.onerror=function(){rej(new Error('تعذّر رسم الصفحة'))};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

    if(!t)throw new Error('رد فارغ');

  }
  const gk=[k.gemini,k.gemini2,k.gemini3].filter(Boolean);

  const model=k.geminiModel||MODELS.gemini;

    const j=await r.json().catch(function(){return {}});
    if(r.ok){
      const c=j.candidates&&j.candidates[0]&&j.candidates[0].content;

function audLines(a){

  if(a.errors&&a.errors.length)L.push('أخطاء جافاسكربت: '+a.errors.join(' | '));
  if(a.small&&a.small.length)L.push('عناصر لمس أصغر من 36px: '+a.small.join('، '));
  if(a.tiny&&a.tiny.length)L.push('نصوص أصغر من 12px: '+a.tiny.join('، '));

async function evaluate(html){

    try{

      v.score=+v.score||0;

function fixText(res){

(function(){

/* يستبدل محتوى النصوص والتعليقات بمسافات (يحافظ على الأطوال) */
function maskDart(s){
  const n=s.length,out=[];
  let i=0;
  while(i<n){
    const c=s[i],d=s[i+1];
    if(c==='/'&&d==='/'){
      let j=i;while(j<n&&s[j]!=='\n')j++;
      out.push(' '.repeat(j-i));i=j;continue;
    }
    if(c==='/'&&d==='*'){
      let j=s.indexOf('*/',i+2);j=j<0?n:j+2;
      out.push(s.slice(i,j).replace(/[^\n]/g,' '));i=j;continue;
    }
    if(c==="'"||c==='"'){
      const raw=i>0&&s[i-1]==='r'&&(i<2||!/[A-Za-z0-9_$]/.test(s[i-2]));
      const tri=s.substr(i,3)===c+c+c;
      let j=i+(tri?3:1);
      while(j<n){
        if(!raw&&s[j]==='\\'){j+=2;continue}
        if(tri){if(s.substr(j,3)===c+c+c){j+=3;break}}
        else{
          if(s[j]===c){j++;break}
          if(s[j]==='\n')break;
        }
        j++;
      }
      if(j>n)j=n;
      out.push(s.slice(i,j).replace(/[^\n]/g,' '));i=j;continue;
    }
    out.push(c);i++;
  }
  return out.join('');
}

/* حذف const من أماكن الاستدعاء (مع إبقائها في التعريفات) */
function stripConst(s){
  const m=maskDart(s),cuts=[];
  const re=/\bconst\b/g;
  let x;
  while((x=re.exec(m))!==null){
    const st=x.index;
    let p=st+5;
    while(p<m.length&&/\s/.test(m[p]))p++;
    let b=-1;
    if(m[p]==='['||m[p]==='{'){
      b=p;
    }else if(m[p]==='<'){
      let d=0,q=p;
      for(;q<m.length;q++){
        if(m[q]==='<')d++;
        else if(m[q]==='>'){d--;if(d===0){q++;break}}
      }
      while(q<m.length&&/\s/.test(m[q]))q++;
      if(m[q]==='['||m[q]==='{')b=q;
    }else{
      const idm=/^[A-Za-z_$][\w$]*(?:\s*\.\s*[A-Za-z_$][\w$]*)*/.exec(m.slice(p,p+160));
      if(idm){
        let q=p+idm[0].length;
        while(q<m.length&&/\s/.test(m[q]))q++;
        if(m[q]==='<'){
          let d=0;
          for(;q<m.length;q++){
            if(m[q]==='<')d++;
            else if(m[q]==='>'){d--;if(d===0){q++;break}}
          }
          while(q<m.length&&/\s/.test(m[q]))q++;
        }
        if(m[q]==='(')b=q;
      }
    }
    if(b<0)continue;
    let k=st-1;
    while(k>=0&&/\s/.test(m[k]))k--;
    const pc=k>=0?m[k]:'';
    if(pc===''||pc===';'||pc==='{'||pc==='}')continue;
    if(/\bcase\s*$/.test(m.slice(Math.max(0,st-12),st)))continue;
    let depth=0,e=-1;
    for(let q=b;q<m.length;q++){
      const c=m[q];
      if(c==='('||c==='['||c==='{')depth++;
      else if(c===')'||c===']'||c==='}'){depth--;if(depth===0){e=q;break}}
    }
    if(e<0)continue;
    if(/\b(this|super)\s*\./.test(m.slice(b,e)))continue;
    let r=st+5;
    while(r<m.length&&/\s/.test(m[r]))r++;
    cuts.push([st,r]);
  }
  for(let i=cuts.length-1;i>=0;i--)s=s.slice(0,cuts[i][0])+s.slice(cuts[i][1]);
  return s;
}

/* إضافة الاستيرادات الناقصة */
const IMPS=[
  [['jsonDecode','jsonEncode','utf8','base64Encode','base64Decode','LineSplitter'],"import 'dart:convert';",'dart:convert'],
  [['Timer','Completer','StreamController','StreamSubscription'],"import 'dart:async';",'dart:async'],
  [['HttpClient','File','Directory','Platform','InternetAddress','SocketException'],"import 'dart:io';",'dart:io'],
  [['HapticFeedback','SystemChrome','SystemNavigator','Clipboard','ClipboardData','FilteringTextInputFormatter','LengthLimitingTextInputFormatter','TextInputFormatter','SystemUiOverlayStyle','DeviceOrientation'],"import 'package:flutter/services.dart';",'flutter/services.dart'],
  [['ImageFilter'],"import 'dart:ui' show ImageFilter;",'dart:ui'],
  [['Random'],"import 'dart:math';",'dart:math']
];
function addImports(s){
  const m=maskDart(s);
  const add=[];
  IMPS.forEach(function(r){
    if(s.indexOf(r[2])>-1)return;
    const used=r[0].some(function(nm){
      if(new RegExp('\\b(class|enum|mixin|typedef)\\s+'+nm+'\\b').test(m))return false;
      return new RegExp('(^|[^.\\w$])'+nm+'\\b').test(m);
    });
    if(used)add.push(r[1]);
  });
  if(s.indexOf('package:flutter/material.dart')<0&&/\b(StatelessWidget|StatefulWidget|MaterialApp|Scaffold|DsApp)\b/.test(m))add.push("import 'package:flutter/material.dart';");
  if(!add.length)return s;
  const re=/^import\s+[^;]+;[ \t]*$/gm;
  let last=-1,x;
  while((x=re.exec(s))!==null)last=x.index+x[0].length;
  if(last<0)return add.join('\n')+'\n'+s;
  return s.slice(0,last)+'\n'+add.join('\n')+s.slice(last);
}

function cnt(s){return (String(s).match(/[(){}\[\]]/g)||[]).length}
function fixDart(code){
  const orig=String(code);
  let s=orig;
  try{
    s=s.replace(/\b(cardTheme|dialogTheme|tabBarTheme)\s*:\s*(CardTheme|DialogTheme|TabBarTheme)\s*\(/g,function(m,a,b){return a+': '+b+'Data('});
    s=stripConst(s);
    s=addImports(s);
    if(cnt(s)!==cnt(orig))return orig;
    return s;
  }catch(e){return orig}
}

function scriptText(){
  let t='';
  document.querySelectorAll('script').forEach(function(s){if(!s.src)t+=s.textContent+'\n'});
  return t;
}
function blocks(){
  const t=scriptText(),re=/\/\*\s*=====\s*إضافة:\s*([^=]+?)\s*=====\s*\*\//g,out=[];
  let m;
  while((m=re.exec(t))!==null)out.push(m[1].trim());
  return out;
}
async function ghFile(repo,br,p){
  try{
    const f=await gh('/repos/'+repo+'/contents/'+p+'?ref='+br);
    return decodeURIComponent(escape(atob(String(f.content||'').replace(/\s/g,''))));
  }catch(e){if(e.status===404)return null;throw e}
}
function dt(t){try{return new Date(t).toLocaleString('ar-u-nu-latn')}catch(e){return ''}}

async function diagnose(){
  const R=[],K=S.keys;

  /* 1) الكتل */
  const bl=blocks(),A=[];
  item(A,'info','عدد الكتل المركّبة: '+bl.length);
  const cnt={};
  bl.forEach(function(b){cnt[b]=(cnt[b]||0)+1});
  Object.keys(cnt).forEach(function(b){
    if(cnt[b]>1)item(A,'bad','مكررة '+cnt[b]+' مرات: «'+b+'» (خلّي نسخة واحدة فقط، الأحدث)');
  });
  const pos=function(k){let p=-1;bl.forEach(function(b,i){if(b.indexOf(k)>-1)p=i});return p};
  ORDER.forEach(function(r){
    const a=pos(r[0]),b=pos(r[1]);
    if(a>-1&&b>-1&&a<b)item(A,'bad','ترتيب غلط: «'+bl[a]+'» لازم تكون بعد «'+bl[b]+'»');
  });
  if(pos('حماية ملفات بناء')>-1)item(A,'warn','كتلة «حماية ملفات بناء Flutter و Python» تمنع الأداة من تحديث ملفات البناء تلقائياً، فلازم تحدّثها يدوياً');
  if(pos('فصل المستودعات')>-1&&!String(K.pubRepo||'').trim())item(A,'info','كتلة «فصل المستودعات» مركّبة لكنها غير مفعّلة (ما بتأثر)');
  if(pos('حتى 100 محاولة')>-1){
    ['فحص Flutter و Python قبل البناء','فحص قبل البناء المتقدم'].forEach(function(k){
      const p=pos(k);
      if(p>-1)item(A,'info','«'+bl[p]+'» قديمة ومعطّلة تلقائياً، تقدر تمسحها لتخفيف الملف');
    });
  }
  const fns=['ai','put','gh','buildAny','build','buildNative','render','clean','progress','setCode','preview'];
  const miss=fns.filter(function(f){return typeof window[f]!=='function'});
  item(A,miss.length?'bad':'ok',miss.length?'دوال أساسية مفقودة: '+miss.join('، '):'الدوال الأساسية موجودة');
  item(A,'info','حجم كود الأداة: '+Math.round(scriptText().length/1024)+' كيلوبايت');
  R.push({sec:'🧩 الكتل المركّبة',items:A,list:bl});

  /* 2) المفاتيح */
  const B=[],prov=K.provider||'gemini';
  const aiK={gemini:!!(K.gemini||K.gemini2||K.gemini3),claude:!!K.claude,openrouter:!!(K.orKey&&K.orModel),groq:!!K.gqKey}[prov];
  item(B,aiK?'ok':'bad','الذكاء الاصطناعي ('+prov+'): '+(aiK?'المفتاح موجود':'المفتاح ناقص'));
  if(prov==='groq')item(B,'info','Groq ما بيشوف الصور، فالفحص البصري بيشتغل جزئياً');
  item(B,K.ghToken?'ok':'bad','GitHub: '+(K.ghToken?'المفتاح موجود':'المفتاح ناقص'));
  item(B,K.fbUrl?'ok':'info','Firebase: '+(K.fbUrl?'الرابط موجود':'غير مضبوط')+(K.fbUrl&&!K.fbKey?' (Web API Key ناقص، مطلوب لتسجيل الدخول)':''));
  item(B,(K.sbToken&&K.sbRef)?'ok':'info','Supabase: '+((K.sbToken&&K.sbRef)?'مضبوط':'غير مضبوط'));
  R.push({sec:'🔑 المفاتيح',items:B});

  /* 3) التطبيقان */
  const C=[];
  const pk=function(i){
    try{if(typeof pkgOf==='function'){const p=pkgOf(i);if(p)return p}}catch(e){}
    const s=slugOf(S.apps[i].name),l=langOf(i);
    return l==='flutter'?'com.myapps.app_'+s:l==='python'?'com.myapps.app'+s:'com.myapps.'+s;
  };
  const GEN=['first','second','shop','admin','app','test','my','demo','new','main'];
  S.apps.forEach(function(a,i){
    const code=a.code||'',has=!!code.trim(),l=langOf(i);
    item(C,has?'ok':'info','التطبيق '+(i+1)+': '+(a.name||'—')+' — '+LANGN[l]+' — '+(has?Math.round(code.length/1024)+' كيلوبايت — الحزمة: '+pk(i):'فارغ')+(a.vc?' — الإصدار '+(a.vbase||'1.0')+'.'+a.vc:'')+((a.set&&a.set.upd)?' — 🔔 التحديث مفعّل':''));
    if(has&&GEN.indexOf(slugOf(a.name))>-1)item(C,'warn','اسم التطبيق '+(i+1)+' «'+slugOf(a.name)+'» عام جداً، ممكن يتثبت فوق تطبيق تاني بنفس الاسم');
  });
  if((S.apps[0].code||'').trim()&&(S.apps[1].code||'').trim()&&pk(0)===pk(1))item(C,'bad','التطبيقان لهما نفس الحزمة '+pk(0)+'، فواحد بيتثبت فوق التاني');
  R.push({sec:'📱 التطبيقان',items:C});

  /* 4) التخزين */
  const D=[];
  let tot=0,sz=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);tot+=k.length+(localStorage.getItem(k)||'').length}}catch(e){}
  try{sz=JSON.stringify(S).length}catch(e){}
  const mb=function(n){return (n/1048576).toFixed(2)+' ميجا'};
  item(D,tot>4200000?'bad':tot>3000000?'warn':'ok','التخزين المستخدم: '+mb(tot)+' من حوالي 5 ميجا (بيانات الأداة '+mb(sz)+')');
  item(D,'info','المشاريع المحفوظة: '+((S.projects||[]).length)+' — القوالب المحفوظة: '+((S.tpls||[]).length));
  let vs=0;S.apps.forEach(function(a){vs+=(a.versions||[]).length});
  item(D,'info','النسخ السابقة في خانتي العمل: '+vs);
  R.push({sec:'💾 التخزين',items:D});

  /* 5) GitHub */
  const E=[];
  if(!K.ghToken){
    item(E,'info','تخطّيت فحص GitHub (المفتاح ناقص)');
  }else{
    try{
      const repo=await repoFull();
      const info=await gh('/repos/'+repo),br=info.default_branch||'main';
      item(E,'ok','المستودع: '+repo+' ('+(info.private?'خاص':'عام')+')');
      if(!info.private)item(E,'warn','المستودع عام: مفاتيح التوقيع وكلمات سرها ظاهرة لأي زول');
      const app=await ghFile(repo,br,'.github/workflows/build-app.yml');
      if(app===null)item(E,'bad','build-app.yml غير موجود');
      else if(app.indexOf('App signing key')>-1)item(E,'ok','build-app.yml: مفتاح توقيع لكل تطبيق');
      else if(app.indexOf('shared.keystore')>-1)item(E,'warn','build-app.yml: مفتاح توقيع مشترك (تطبيقات HTML ممكن تتثبت فوق بعض)');
      else item(E,'warn','build-app.yml: طريقة توقيع غير معروفة');
      for(const w of [['build-flutter.yml','Flutter'],['build-python.yml','Python']]){
        const t=await ghFile(repo,br,'.github/workflows/'+w[0]);
        if(t===null){item(E,'info',w[0]+': غير موجود (بيتنشأ عند أول بناء '+w[1]+')');continue}
        const v=(/^#\s*v(\d+)/m.exec(t)||[])[1];
        const own=t.indexOf('app signing key')>-1;
        item(E,own?'ok':'warn',w[0]+': '+(v?'v'+v:'إصدار غير معروف')+' — '+(own?'مفتاح لكل تطبيق':'مفتاح عشوائي أو مشترك'));
      }
      const cf=await ghFile(repo,br,'.github/workflows/check-flutter.yml');
      item(E,(cf!==null&&cf.indexOf('# ck3')>-1)?'ok':'info','check-flutter.yml: '+(cf===null?'غير موجود (بيتنشأ عند أول فحص)':(cf.indexOf('# ck3')>-1?'الأحدث (ck3)':'قديم، بيتحدث تلقائياً عند أول فحص')));
      try{
        const ks=await gh('/repos/'+repo+'/contents/keys?ref='+br);
        const n=(Array.isArray(ks)?ks:[]).filter(function(f){return /\.keystore$/.test(f.name)});
        item(E,'info','مفاتيح التوقيع في مجلد keys: '+n.length+(n.some(function(f){return f.name==='shared.keystore'})?' (منها shared.keystore)':''));
        if(n.length)item(E,'info','تذكير: انسخ مجلد keys واحفظه خارج GitHub');
      }catch(e){item(E,e.status===404?'info':'warn','مجلد keys: '+(e.status===404?'غير موجود بعد':arErr(e)))}
      try{
        const cu=await gh('/repos/'+repo+'/actions/cache/usage');
        const b=+cu.active_caches_size_in_bytes||0;
        item(E,b>8.5e9?'warn':'ok','الكاش في GitHub: '+(b/1073741824).toFixed(2)+' من 10 جيجا ('+(cu.active_caches_count||0)+' ملف)');
      }catch(e){}
      try{
        const rs=await gh('/repos/'+repo+'/actions/runs?per_page=10');
        const runs=rs.workflow_runs||[];
        const f=runs.filter(function(r){return r.conclusion==='failure'}).length;
        item(E,f>5?'warn':'info','آخر '+runs.length+' تشغيلات في Actions: '+f+' منها فشلت');
        runs.slice(0,6).forEach(function(r){
          item(E,r.conclusion==='success'?'ok':r.conclusion==='failure'?'bad':'info',r.name+' — '+(r.conclusion||r.status)+' — '+dt(r.created_at));
        });
      }catch(e){}
    }catch(e){item(E,'bad','تعذّر فحص GitHub: '+arErr(e))}
  }
  R.push({sec:'🐙 GitHub',items:E});

  /* 6) سجل الأخطاء */
  const L=logGet().slice(-15).reverse(),F=[];
  if(!L.length)item(F,'ok','ما في أخطاء مسجّلة بعد');
  L.forEach(function(x){item(F,x.k==='خطأ'?'bad':'warn',dt(x.t)+' — '+x.m)});
  R.push({sec:'🐞 آخر الأخطاء والرسائل',items:F});
  return R;
}

/* ---------- العرض والنسخ ---------- */
function toText(R){
  const lines=['تقرير تشخيص APK App','التاريخ: '+dt(Date.now()),'الجهاز: '+navigator.userAgent.slice(0,120),''];
  R.forEach(function(s){
    lines.push('== '+s.sec+' ==');
    s.items.forEach(function(x){lines.push(IC[x.s]+' '+x.t)});
    if(s.list)lines.push('الترتيب: '+s.list.map(function(b,i){return (i+1)+') '+b}).join(' | '));
    lines.push('');
  });
  return lines.join('\n');
}
window.cxDiag=async function(){
  const sh=$('#sheet');
  sh.innerHTML='<div class="sheetbox"><h3 style="margin:0 0 8px">🩺 فحص الأداة</h3><p class="note">⏳ جاري الفحص...</p></div>';
  sh.classList.add('on');
  let R;
  try{R=await diagnose()}catch(e){R=[{sec:'خطأ في الفحص',items:[{s:'bad',t:arErr(e)}]}]}
  window._diagTxt=toText(R);
  let bad=0,warn=0;
  R.forEach(function(s){s.items.forEach(function(x){if(x.s==='bad')bad++;if(x.s==='warn')warn++})});
  const col={ok:'var(--ok)',warn:'var(--acc)',bad:'var(--bad)',info:'var(--mut)'};
  let h='<div class="sheetbox"><h3 style="margin:0 0 4px">🩺 فحص الأداة</h3>'
   +'<p class="note" style="font-size:14px">'+(bad?'✖ '+bad+' مشكلة':'✔ ما في مشاكل خطيرة')+(warn?' — ⚠ '+warn+' تنبيه':'')+'</p>';
  R.forEach(function(s){
    h+='<div class="card" style="margin-top:10px"><b>'+s.sec+'</b>'
      +s.items.map(function(x){return '<div style="font-size:13px;line-height:1.8;color:'+col[x.s]+'">'+IC[x.s]+' '+esc(x.t)+'</div>'}).join('')
      +(s.list&&s.list.length?'<details><summary class="note">عرض ترتيب الكتل</summary><div class="note" style="line-height:1.9">'+s.list.map(function(b,i){return (i+1)+') '+esc(b)}).join('<br>')+'</div></details>':'')
      +'</div>';
  });
  h+='<button class="acc" style="width:100%;margin-top:10px" onclick="cxDiagCopy()">📋 انسخ التقرير وابعته لي</button>'
   +'<div class="row" style="margin-top:8px"><button class="sec" onclick="cxDiag()">🔄 أعد الفحص</button><button class="sec" onclick="cxDiagClr()">🗑 امسح سجل الأخطاء</button></div>'
   +'<p class="note">التقرير ما فيه أي مفتاح أو كلمة سر.</p>'
   +'<button class="ghost" onclick="closeSheet()">إغلاق</button></div>';
  sh.innerHTML=h;
};
window.cxDiagCopy=function(){
  const t=String(window._diagTxt||'');
  if(!t)return toast('شغّل الفحص أولاً');
  const ok=function(){_toast0('تم نسخ التقرير ✔ الصقه في المحادثة')};
  function fb(){
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok()}catch(e){_toast0('تعذّر النسخ')}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
};
window.cxDiagClr=function(){
  try{localStorage.removeItem(LOGK)}catch(e){}
  _toast0('تم مسح سجل الأخطاء');
  cxDiag();
};

const CK_FL=`# ck3
# ck2
# ck1
name: check-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: analyze
        run: |
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          rm -rf flutter_out/test
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          cd flutter_out
          if grep -q "package:url_launcher" lib/main.dart; then flutter pub add url_launcher; fi
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../analyze.txt 2>&1 || true
          cd ..
          F=flutter_out/lib/main.dart
          DSL=$(grep -n "^// ===== نظام التصميم الجاهز" $F | head -n 1 | cut -d: -f1)
          UPL=$(grep -n "^// ===== تحديث التطبيق" $F | head -n 1 | cut -d: -f1)
          : > errs.txt
          grep -E "^[[:space:]]*error" analyze.txt | while IFS= read -r line; do
            L=$(echo "$line" | grep -o "main.dart:[0-9]*" | head -n 1 | cut -d: -f2)
            T=APP
            if [ -n "$L" ]; then
              if [ -n "$UPL" ] && [ "$L" -ge "$UPL" ]; then T=UPD
              elif [ -n "$DSL" ] && [ "$L" -ge "$DSL" ]; then T=DS
              elif sed -n "$L"p $F | grep -q " as apk"; then T=UPD
              fi
            fi
            echo "[$T] $line" >> errs.txt
          done
          if [ -s errs.txt ]; then
            echo APKERR_START
            cat errs.txt
            echo APKERR_END
            exit 1
          fi
`;

const CK_PY=`# ck1
name: check-python
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: analyze
        run: |
          pip install pyflakes
          : > errs.txt
          python -m py_compile apps/$APP/main.py 2> comp.txt || cat comp.txt >> errs.txt
          python -m pyflakes apps/$APP/main.py 2>&1 | grep -v -E "imported but unused|unable to detect undefined names|may be undefined, or defined from star|redefinition of unused|assigned to but never used|f-string is missing placeholders" >> errs.txt || true
          if [ -s errs.txt ]; then
            echo APKERR_START
            cat errs.txt
            echo APKERR_END
            exit 1
          fi
`;

'أخطاء شائعة تجنّبها: لا تستخدم const أمام ويدجت فيه دالة أو قيمة ديناميكية؛ DsChips.onChanged تأخذ int؛ DsStats.items قائمة من DsStat؛ لا تعرّف صنفاً أو دالة اسمها يبدأ بـ Ds أو ds؛ لا تستخدم MaterialApp مباشرة بل DsApp.'
].join('\n');

const HINTS='\n\nتلميحات لأخطاء Flutter الشائعة: Undefined name أو class أو method → أضف الاستيراد المناسب (dart:convert لـ jsonDecode وjsonEncode وutf8، وdart:io لـ HttpClient، وdart:async لـ Timer وFuture) أو صحّح الاسم؛ Not a constant expression → احذف const؛ The named parameter isn\'t defined → راجع أسماء البارامترات؛ A value of type X can\'t be assigned to Y → أضف تحويلاً أو as أو ??؛ تأكد من توازن الأقواس ومن الفواصل المنقوطة، ومن أن كل متغير معرّف قبل استخدامه.';

function extractErr(log){
  const lines=String(log).replace(/\r/g,'').split('\n').map(x=>x.replace(/^\S+Z\s?/,''));
  const txt=lines.join('\n');
  const s=txt.lastIndexOf('APKERR_START');
  if(s<0)return null;
  const e=txt.indexOf('APKERR_END',s);
  if(e<0)return null;
  return txt.slice(s+12,e).trim().slice(0,6000);
}
function tailOf(log){
  return String(log).replace(/\r/g,'').split('\n').map(x=>x.replace(/^\S+Z\s?/,'')).filter(x=>x.trim()).slice(-12).join('\n').slice(0,1200);
}
function bal(t){return (String(t).match(/\{/g)||[]).length===(String(t).match(/\}/g)||[]).length}
function norm(e){
  return String(e).split('\n').map(x=>x.replace(/main\.(dart|py):[0-9]+(:[0-9]+)?/g,'').replace(/[0-9]+/g,'#').trim()).filter(Boolean).sort().join('|');
}
function splitErr(errs){
  const o={app:[],upd:[],ds:[]};
  String(errs).split('\n').forEach(function(x){
    const t=x.trim();
    if(!t)return;
    const m=/^\[(APP|UPD|DS)\]\s?(.*)$/.exec(t);
    if(!m){o.app.push(t);return}
    if(m[1]==='UPD')o.upd.push(m[2]);
    else if(m[1]==='DS')o.ds.push(m[2]);
    else o.app.push(m[2]);
  });
  return o;
}

async function nativeCheck(i,l,P){
  const C=CK[l],key=slugOf(S.apps[i].name);
  const repo=await repoFull(),info=await gh('/repos/'+repo),br=info.default_branch||'main';
  let cur='';
  try{const f=await gh('/repos/'+repo+'/contents/.github/workflows/'+C.file+'?ref='+br);cur=atob(String(f.content||'').replace(/\s/g,''))}catch(e){if(e.status!==404)throw e}
  if(cur.indexOf(C.mk)<0){P.set(0,'run','تحديث ملف الفحص '+C.file+'...');await put(repo,br,'.github/workflows/'+C.file,C.yaml);await sleep(6000)}
  await put(repo,br,'apps/'+key+'/'+C.main,S.apps[i].code);
  const t0=Date.now();
  for(let n=0;n<8;n++){
    try{await gh('/repos/'+repo+'/actions/workflows/'+C.file+'/dispatches',{method:'POST',body:JSON.stringify({ref:br,inputs:{app:key}})});break}
    catch(e){if((e.status===404||e.status===422)&&n<7){P.set(0,'run','بانتظار تجهيز الفحص...');await sleep(4000)}else throw e}
  }
  P.set(0,'run','جاري الفحص... (قد يستغرق '+C.min+' دقيقة)');
  let run=null;const lim=Date.now()+15*60000;
  while(Date.now()<lim){
    await sleep(5000);
    const rs=await gh('/repos/'+repo+'/actions/workflows/'+C.file+'/runs?event=workflow_dispatch&per_page=5');
    run=rs.workflow_runs.find(x=>new Date(x.created_at).getTime()>=t0-30000)||null;
    if(run&&run.status==='completed')break;
  }
  if(!run||run.status!=='completed')throw new Error('انتهى وقت انتظار الفحص. تابعه من تبويب Actions في GitHub.');
  if(run.conclusion==='success')return {ok:true};
  if(run.conclusion!=='failure')throw new Error('توقف الفحص ('+run.conclusion+').');
  const jobs=await gh('/repos/'+repo+'/actions/runs/'+run.id+'/jobs');
  const job=jobs.jobs.find(j=>j.conclusion==='failure')||jobs.jobs[0];
  let log='';try{log=await ghText('/repos/'+repo+'/actions/jobs/'+job.id+'/logs')}catch(e){}
  const err=extractErr(log);
  if(!err)throw new Error('تعذّر الفحص بسبب مشكلة في الإعداد أو الخادم (وليس في كودك):\n'+tailOf(log));
  return {ok:false,err:err};
}

function fixPrompt(i,l,old,errs,hist,stag,why){
  let p=sysFor(i)+'الكود الحالي:\n'+BT+FENCE[l]+'\n'+old+'\n'+BT+'\n\nنتيجة الفحص الآلي (أخطاء حقيقية يجب إصلاحها):\n'+errs;
  p+='\n\nملاحظة: أرقام الأسطر في الأخطاء قد تزيد بحوالي 5 أسطر عن الكود الظاهر أعلاه.';
  if(hist.length)p+='\n\nأخطاء ظهرت في محاولات سابقة (لا تكرر الأسلوب الذي لم ينجح):\n'+hist.join('\n---\n');
  if(stag>=2)p+='\n\nتنبيه: آخر محاولتين لم تغيّرا الأخطاء. غيّر طريقتك تماماً: أعد كتابة الدوال أو الشاشات المسببة للأخطاء من الصفر بكود أبسط وأكثر أماناً، وتجنب أي أسلوب أو واجهة قد لا تكون موجودة.';
  if(why)p+='\n\n'+why;
  if(l==='flutter')p+=HINTS;
  if(l==='flutter'&&/\bDs[A-Z][A-Za-z]*\s*\(|\bds(Sheet|Toast|Undo|Confirm)\s*\(/.test(old))p+=DS_SIG;
  p+='\n\nأصلح هذه الأخطاء وأبقِ كل شي آخر كما هو (الوظائف والتصميم والأسماء). أعد الكود الكامل.';
  return p;
}
async function fixOnce(i,l,old,errs,hist,stag){
  let why='';
  for(let t=0;t<3;t++){
    const out=await ai(fixPrompt(i,l,old,errs,hist,stag,why));
    const nw=clean(out);
    if(nw===old.trim()){why='الرد السابق لم يغيّر الكود. يجب أن تعدّل الكود فعلاً لإصلاح الأخطاء.';continue}
    if(nw.length<old.length*0.4||(l==='flutter'&&bal(old)&&!bal(nw))){why='الرد السابق كان ناقصاً (انقطع). أعد الكود كاملاً حتى آخره.';continue}
    return nw;
  }
  throw new Error('الذكاء الاصطناعي لم يعطِ كوداً صالحاً بعد 3 محاولات متتالية.');
}

buildAny=async function(i){
  const a=S.apps[i],l=langOf(i);
  if(l==='html'||S.keys.noChk3||!CK[l]||!a.code.trim()||!slugOf(a.name)||!S.keys.ghToken)return runBuild(i);
  const pk=(a.pkg||'').trim().toLowerCase();
  if(pk&&typeof pkgOk==='function'&&!pkgOk(pk))return runBuild(i);
  if(S.apps.some((x,j)=>j!==i&&slugOf(x.name)===slugOf(a.name)))return runBuild(i);
  if(window._preN3)return toast('الفحص شغّال، انتظر...');
  window._preN3=true;window._chkStop=false;
  const MAX=maxFix(),STALL=stallN(),C=CK[l];
  const P=progress(C.name+' — فحص قبل البناء: '+a.name,['فحص الكود على GitHub','إصلاح الأخطاء بالذكاء الاصطناعي']);
  const force='<button class="acc" style="margin-top:10px;width:100%" onclick="cxForceNative3('+i+')">🏗 ابنِ رغم ذلك</button>';
  const copyB='<button class="sec" style="margin-top:8px;width:100%" onclick="cxCopyErr()">📋 انسخ الأخطاء</button>';
  const STOP='<button class="sec" style="margin-top:10px;width:100%" onclick="window._chkStop=true;toast(\'سيتوقف بعد انتهاء الخطوة الحالية\')">⏹ أوقف الفحص</button>';
  let wl=null,proceed=false;
  try{
    try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}
    let best={code:a.code,n:1e9,errs:''},bestAt=0,prev='',stag=0,hist=[],errs='',why='',ok=false,offUpd=false;
    for(let n=0;n<=MAX;n++){
      if(window._chkStop){why='stop';break}
      P.set(0,'run',n?'إعادة الفحص بعد الإصلاح '+n+'...':'تجهيز الفحص...');
      P.extra(STOP);
      const r=await nativeCheck(i,l,P);
      if(r.ok){
        ok=true;
        P.set(0,'ok','لا توجد أخطاء ✔');
        P.set(1,'ok',n?'تم الإصلاح ✔ (بعد '+n+' محاولة)':'لا حاجة للإصلاح');
        break;
      }
      const sp=splitErr(r.err);
      /* أخطاء في إضافة إشعار التحديث: عطّلها وأعد الفحص بدون استهلاك محاولة */
      if(sp.upd.length&&!offUpd&&S.apps[i].set&&S.apps[i].set.upd){
        offUpd=true;
        S.apps[i].set=Object.assign({},S.apps[i].set,{upd:false});
        save();
        toast('إشعار التحديث سبب أخطاء، عطّلته لهذا التطبيق');
        P.set(0,'run','تم تعطيل إشعار التحديث، إعادة الفحص...');
        n--;
        continue;
      }
      /* الأخطاء كلها في كود مُضاف تلقائياً */
      if(!sp.app.length){
        why='auto';
        errs=sp.ds.concat(sp.upd).join('\n')||r.err;
        P.set(0,'bad',errs);
        break;
      }
      errs=sp.app.join('\n');
      window._shownErr=errs+(sp.ds.length||sp.upd.length?'\n\n(أخطاء في الكود المُضاف تلقائياً)\n'+sp.ds.concat(sp.upd).join('\n'):'');
      const cnt=sp.app.length;
      if(cnt<best.n){best={code:S.apps[i].code,n:cnt,errs:errs};bestAt=n}
      P.set(0,'bad',errs+(sp.ds.length?'\n(+ '+sp.ds.length+' خطأ في نظام التصميم الجاهز)':''));
      if(n===MAX)break;
      if(n-bestAt>=STALL){why='stall';break}
      const nm=norm(errs);
      stag=(nm===prev)?stag+1:0;
      prev=nm;
      P.set(1,'run','محاولة إصلاح '+(n+1)+' من '+MAX+' (أقل عدد أخطاء حتى الآن: '+best.n+')...');
      const old=S.apps[i].code;
      const nw=await fixOnce(i,l,old,errs,hist,stag);
      hist.push(errs.slice(0,300));
      if(hist.length>3)hist.shift();
      setCode(i,nw);
    }
    if(ok){
      proceed=true;
    }else{
      if(why!=='auto'&&best.n<1e9&&best.code!==S.apps[i].code){setCode(i,best.code);errs=best.errs}
      if(why==='auto')window._shownErr=errs;
      const msg=why==='stop'?'تم الإيقاف':why==='auto'?'الأخطاء كلها في الكود المُضاف تلقائياً':why==='stall'?'توقفت لأن النتيجة ما تحسنت في آخر '+STALL+' محاولات':'ما قدرت أصلحها بعد '+MAX+' محاولات';
      P.set(1,'bad',msg);
      P.extra('<div class="errbox">'+esc(errs)+'</div>'
        +(why==='auto'?'<p class="note">هذه الأخطاء في كود تضيفه الأداة تلقائياً (نظام التصميم أو التحديث) وليست في كودك. انسخها وابعتها لي.</p>':'')
        +(why!=='auto'&&best.n<1e9?'<p class="note">رجّعت أفضل نسخة (أقل عدد أخطاء: '+best.n+').</p>':'')
        +copyB+force);
    }
  }catch(e){
    P.set(1,'bad',arErr(e));
    P.extra('<div class="errbox">'+esc(arErr(e))+'</div>'+force);
  }finally{
    window._preN3=false;window._chkStop=false;
    try{if(wl)await wl.release()}catch(e){}
  }
  if(proceed)return runBuild(i);
};

(function(){
const GB=1073741824;
function gb(n){return (n/GB).toFixed(2)}
window.cxCacheClean=function(btn){
  busy(btn,async()=>{
    if(!S.keys.ghToken)throw new Error('أدخل مفتاح GitHub أولاً');
    const repo=await repoFull();
    let all=[];
    for(let p=1;p<=10;p++){
      const r=await gh('/repos/'+repo+'/actions/caches?per_page=100&page='+p+'&sort=last_accessed_at&direction=asc');
      const a=r.actions_caches||[];
      all=all.concat(a);
      if(a.length<100)break;
    }
    if(!all.length){toast('الكاش فاضي');return}
    const total=all.reduce(function(s,c){return s+(+c.size_in_bytes||0)},0);
    const now=Date.now(),old=3*86400000,del=[];
    let left=total;
    all.forEach(function(c){
      if(now-new Date(c.last_accessed_at).getTime()>old){del.push(c);left-=(+c.size_in_bytes||0)}
    });
    all.forEach(function(c){
      if(left<=6*GB||del.indexOf(c)>-1)return;
      del.push(c);left-=(+c.size_in_bytes||0);
    });
    if(!del.length){toast('الكاش '+gb(total)+' جيجا، وما في كاش قديم يحتاج حذف');return}
    if(!confirm('الكاش الحالي '+gb(total)+' جيجا ('+all.length+' ملف).\nحذف '+del.length+' ملف قديم (حوالي '+gb(total-left)+' جيجا)؟\nالبناء الجاي ممكن يكون أبطأ شوية.'))return;
    let n=0;
    for(const c of del){
      try{await gh('/repos/'+repo+'/actions/caches/'+c.id,{method:'DELETE'});n++}catch(e){}
    }
    toast('تم حذف '+n+' ملف كاش ✔ المتبقي حوالي '+gb(left)+' جيجا');
  });
};

/* ===== إضافة: مدقق أقواس ورموز Dart + إصلاح فوري بدون ذكاء اصطناعي ===== */
(function(){
const PAIR={')':'(',']':'[','}':'{'},CLOSE={'(':')','[':']','{':'}'};

/* يمسح كود Dart ويرجع: الأخطاء، الأقواس المفتوحة، ومواضع الرموز العربية خارج النصوص */
function scan(s){
  const n=s.length,st=[],errs=[],fixes=[];
  const ctx=[{t:'c'}];
  let i=0;
  while(i<n){
    const top=ctx[ctx.length-1],ch=s[i];
    if(top.t==='s'){
      if(!top.raw&&ch==='\\'){i+=2;continue}
      if(s.startsWith(top.q,i)){ctx.pop();i+=top.q.length;continue}
      if(!top.raw&&ch==='$'&&s[i+1]==='{'){ctx.push({t:'c',interp:true});st.push({c:'{',p:i+1,I:true});i+=2;continue}
      if(top.q.length===1&&ch==='\n'){ctx.pop();i++;continue}
      i++;continue;
    }
    if(ch==='/'&&s[i+1]==='/'){const j=s.indexOf('\n',i);i=j<0?n:j;continue}
    if(ch==='/'&&s[i+1]==='*'){const j=s.indexOf('*/',i+2);i=j<0?n:j+2;continue}
    let raw=false,k=i;
    if(ch==='r'&&(s[i+1]==="'"||s[i+1]==='"')&&!/[A-Za-z0-9_$]/.test(s[i-1]||'')){raw=true;k=i+1}
    const c2=s[k];
    if(c2==="'"||c2==='"'){
      const q=s.substr(k,3)===c2+c2+c2?c2+c2+c2:c2;
      ctx.push({t:'s',q:q,raw:raw});i=k+q.length;continue;
    }
    if(ch==='؛'){fixes.push({p:i,to:';'})}
    else if(ch==='،'){fixes.push({p:i,to:','})}
    else if(ch==='“'||ch==='”'){fixes.push({p:i,to:'"'})}
    else if(ch==='‘'||ch==='’'){fixes.push({p:i,to:"'"})}
    else if(ch===' '){fixes.push({p:i,to:' '})}
    if(ch==='('||ch==='['||ch==='{'){st.push({c:ch,p:i})}
    else if(ch===')'||ch===']'||ch==='}'){
      const t=st[st.length-1];
      if(ch==='}'&&t&&t.I){st.pop();ctx.pop();i++;continue}
      if(!t||t.c!==PAIR[ch]){errs.push({p:i,got:ch,want:t?CLOSE[t.c]:null,open:t?t.p:-1})}
      if(t&&!t.I)st.pop();
    }
    i++;
  }
  return {errs:errs,open:st,fixes:fixes,unclosedStr:ctx.length>1};
}
function bad(r){return r.errs.length+r.open.length+(r.unclosedStr?1:0)}
function lineOf(s,p){return s.slice(0,p).split('\n').length}

/* إصلاح: رموز عربية خارج النصوص + أقواس غلط/زايدة/ناقصة */
function repair(code){
  let s=String(code);const log=[];
  let r=scan(s);
  if(r.fixes.length){
    for(let j=r.fixes.length-1;j>=0;j--){const f=r.fixes[j];s=s.slice(0,f.p)+f.to+s.slice(f.p+1)}

    const e=r.errs[0],cur=bad(r),cands=[];
    if(e.want)cands.push({k:'بدّل '+e.got+' بـ '+e.want,s:s.slice(0,e.p)+e.want+s.slice(e.p+1)});
    if(e.want)cands.push({k:'أضف '+e.want+' قبل '+e.got,s:s.slice(0,e.p)+e.want+s.slice(e.p)});
    cands.push({k:'احذف '+e.got+' الزايد',s:s.slice(0,e.p)+s.slice(e.p+1)});
    let best=null,bs=cur;
    cands.forEach(function(c){const rr=scan(c.s),b=bad(rr);if(b<bs){bs=b;best={c:c,r:rr}}});
    if(!best)break;
    log.push(best.c.k+' (سطر '+lineOf(s,e.p)+')');
    s=best.c.s;r=best.r;
  }

function hlCode(src,lang){

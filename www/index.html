<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APK App</title>
<style>
:root{--bg:#0b1220;--card:#131c31;--line:#22304f;--tx:#e8eefc;--mut:#8fa0c4;--pri:#2f80ff;--acc:#ffb300;--ok:#2ecc71;--bad:#ff5c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{padding:16px;text-align:center;font-size:20px;font-weight:700;background:linear-gradient(135deg,#0d47a1,#2f80ff);position:sticky;top:0;z-index:5}
main{padding:12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
input,select,textarea{width:100%;background:#0e1730;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
textarea.code{height:180px;direction:ltr;text-align:left;font-family:monospace;font-size:12px;margin-top:8px}
textarea.req{height:70px;margin-top:8px}
input.name{font-weight:700;font-size:16px}
iframe{width:100%;height:300px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}
.row{display:flex;gap:8px;margin-top:8px}
button,.btn{flex:1;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600;font-family:inherit;text-align:center;text-decoration:none;display:block}
button.sec{background:#243557}
button.acc{background:var(--acc);color:#222}
button.ghost{background:transparent;border:1px solid var(--line);margin-top:10px;width:100%}
button:disabled{opacity:.5}
.link{margin:4px 0 12px;display:flex;gap:8px}
.desc[hidden]{display:none}
.desc{margin-top:8px;border:1px dashed var(--acc);border-radius:12px;padding:8px}
.note{color:var(--mut);font-size:12px;line-height:1.7}
.errbox{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap}
.edit[hidden]{display:none}
.edit{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
details{margin-top:10px;color:var(--mut);font-size:13px}
.ver{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ver button{flex:none;padding:6px 12px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1730;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;color:var(--mut);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--acc)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;align-items:flex-end}
#sheet.on{display:flex}
.sheetbox{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.step small{display:block;color:var(--mut);margin-top:2px;white-space:pre-wrap}
.step.ok span{color:var(--ok)}.step.bad span{color:var(--bad)}.step.run span{color:var(--acc)}
.explain{background:#0e1730;border-radius:10px;padding:10px;margin-top:10px;font-size:14px;line-height:1.8;white-space:pre-wrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#243557;padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>👷 APK App</header>
<main id="main"></main>
<div id="sheet"></div>
<div id="toast"></div>
<nav>
  <button id="n-keys" onclick="go('keys')">🔑<br>المفاتيح</button>
  <button id="n-code" onclick="go('code')">💻<br>الكود</button>
  <button id="n-build" onclick="go('build')">🏗️<br>البناء</button>
</nav>

<script>
const MODELS={gemini:'gemini-3.8-flash',claude:'claude-sonnet-5-5'};
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const newApp=n=>({name:n,code:'',versions:[],err:'',apk:'',icon:''});
function slugOf(n){let s=String(n||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(/^[0-9]/.test(s))s='a'+s;return s}
function load(){try{const x=JSON.parse(localStorage.getItem('apkapp')||'null');if(x&&x.apps)return x}catch(e){}
  return {keys:{provider:'gemini',repo:'apk-app'},apps:[newApp('first'),newApp('second')]}}
let S=load(),tab='keys';
let _sv;
function saveNow(){clearTimeout(_sv);try{localStorage.setItem('apkapp',JSON.stringify(S))}catch(e){toast('تعذّر الحفظ: المساحة ممتلئة. قلّل حجم الأكواد أو النسخ السابقة.')}}
const save=()=>{clearTimeout(_sv);_sv=setTimeout(saveNow,600)};
window.addEventListener('pagehide',saveNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function arErr(e){const m=String((e&&e.message)||e);
  if(/Failed to fetch|NetworkError|network|timeout/i.test(m))return 'تعذّر الاتصال. تأكد من الإنترنت.';
  if(/workflow/i.test(m)&&/scope|permission|allow/i.test(m))return 'مفتاح GitHub ينقصه صلاحية workflow. أنشئ مفتاحاً جديداً وفعّل repo و workflow.';
  if(/bad credentials|unauthorized|invalid.*(key|token)|API key|401/i.test(m))return 'المفتاح غير صحيح أو انتهت صلاحيته. راجع قائمة المفاتيح.\n('+m+')';
  return m}

/* ---------- الواجهات ---------- */
const FIELDS=[['ghToken','مفتاح GitHub (Token)','password','صلاحيات: repo + workflow'],['repo','اسم المستودع','text','apk-app'],['sbToken','مفتاح Supabase (Access Token)','password','يبدأ بـ sbp_'],['sbRef','Supabase project ref','text',''],['fbUrl','رابط Firebase (Realtime Database URL)','text','https://xxxx-default-rtdb.firebaseio.com'],['fbKey','مفتاح Firebase (Web API Key) - اختياري','password','يبدأ بـ AIza'],['gemini','مفتاح Gemini API','password',''],['gemini2','مفتاح Gemini إضافي 2 (من مشروع آخر) - اختياري','password',''],['gemini3','مفتاح Gemini إضافي 3 (من مشروع آخر) - اختياري','password',''],['claude','مفتاح Claude API','password',''],['orKey','مفتاح OpenRouter','password','يبدأ بـ sk-or-'],['orModel','اسم نموذج OpenRouter (انسخه من openrouter.ai/models)','text','مثال: openai/gpt-oss-120b:free'],['gqKey','مفتاح Groq','password','يبدأ بـ gsk_'],['gqModel','اسم نموذج Groq (اختياري)','text','openai/gpt-oss-120b']];
function vKeys(){return `<div class="card"><h2>🔑 قائمة المفاتيح</h2>
${FIELDS.map(f=>`<label>${f[1]}</label><input type="${f[2]}" value="${esc(S.keys[f[0]]||'')}" placeholder="${f[3]}" autocomplete="off" oninput="S.keys['${f[0]}']=this.value.trim();save()">`).join('')}
<label>الذكاء الاصطناعي المستخدم في التعديل</label>
<select onchange="S.keys.provider=this.value;save()">${[['gemini','Gemini'],['claude','Claude'],['openrouter','OpenRouter'],['groq','Groq']].map(p=>`<option value="${p[0]}" ${(S.keys.provider||'gemini')===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>
<p class="note">تُحفظ المفاتيح تلقائياً داخل التطبيق على جهازك.</p></div>`}

function vCode(){const card=i=>{const a=S.apps[i];return `<section class="card">
<input class="name" value="${esc(a.name)}" placeholder="اسم التطبيق بالإنجليزية (مثل awad)" oninput="S.apps[${i}].name=this.value;save()">
<p class="note">اسم التطبيق يصير اسم المجلد: حروف إنجليزية وأرقام فقط</p>
<div class="row" style="align-items:center"><img id="ic${i}" src="${a.icon||'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" style="width:56px;height:56px;border-radius:14px;background:#0e1730;border:1px solid var(--line);object-fit:cover;flex:none"><button class="sec" onclick="document.getElementById('icf${i}').click()">🖼 ${a.icon?'تغيير الأيقونة':'اختر أيقونة'}</button><input type="file" accept="image/*" id="icf${i}" hidden onchange="pickIcon(${i},this)"></div>
<button class="acc" style="width:100%;margin-top:8px" onclick="toggleDesc(${i})">✨ اكتب وصف التطبيق</button>
<div class="desc" id="desc${i}" hidden>
<textarea class="req" id="dsc${i}" placeholder="اكتب وصف التطبيق بكلمات بسيطة، مثال: تطبيق لتسجيل مصاريف البيت اليومية مع المجموع الشهري"></textarea>
<button class="acc" style="width:100%;margin-top:8px" onclick="aiCreate(${i},this)">🚀 أنشئ التطبيق وعاين</button>
<p class="note">لو في كود قديم، يتحفظ في "النسخ السابقة" وتقدر ترجع له.</p>
</div>
<textarea class="code" id="code${i}" wrap="off" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="الصق كود التطبيق هنا" oninput="S.apps[${i}].code=this.value;save()">${esc(a.code)}</textarea>
<iframe id="pv${i}" sandbox="allow-scripts allow-forms allow-modals"></iframe>
<div class="row"><button onclick="preview(${i})">▶ المعاينة الفعلية</button><button class="sec" onclick="toggleEdit(${i})">✏️ تعديل الكود</button></div>
<div class="edit" id="edit${i}" hidden>
<textarea class="req" id="req${i}" placeholder="اكتب التعديل المطلوب، مثال: غيّر لون الخلفية للأحمر"></textarea>
<div class="row"><button class="acc" onclick="aiEdit(${i},this)">نفّذ التعديل</button><button class="sec" onclick="aiFix(${i},this)">🛠 صلّح الخطأ</button></div>
<div class="errbox" id="err${i}">${esc(a.err)}</div>
<details><summary>النسخ السابقة (${a.versions.length})</summary>${a.versions.map((v,j)=>`<div class="ver"><span>${esc(v.t)}</span><button class="sec" onclick="restore(${i},${j})">رجوع</button></div>`).join('')||'<p>لا توجد نسخ بعد</p>'}</details>
</div></section>`};
return card(0)+`<div class="link"><button class="acc" onclick="linkApps(this)">🔗 ربط عبر Supabase</button><button class="acc" onclick="linkFirebase(this)">🔥 ربط عبر Firebase</button></div>`+card(1)}

function vBuild(){return `<div class="card"><h2>🏗️ قائمة البناء</h2><p class="note">اضغط بناء وسيتم رفع الكود إلى مجلد باسم التطبيق وبناء ملف APK تلقائياً، وتتابع المراحل هنا.</p></div>`+
S.apps.map((a,i)=>`<div class="card"><h2>${esc(a.name)}</h2><p class="note">المجلد: apps/${esc(slugOf(a.name)||'← اكتب اسماً إنجليزياً في قائمة الكود')}</p><button onclick="build(${i})">بناء ${esc(a.name)}</button>${a.apk?`<a class="btn acc" style="margin-top:8px" href="${esc(a.apk)}" target="_blank">⬇ تحميل آخر APK</a>`:''}</div>`).join('')}

function go(t){tab=t;render()}
function render(){
  $('#main').innerHTML=tab==='keys'?vKeys():tab==='code'?vCode():vBuild();
  ['keys','code','build'].forEach(k=>$('#n-'+k).classList.toggle('on',k===tab));
  if(tab==='code')S.apps.forEach((a,i)=>{if(a.code.trim()&&a.code.length<80000)preview(i)});
  window.scrollTo(0,0)}
function toggleEdit(i){const e=$('#edit'+i);e.hidden=!e.hidden}

/* ---------- المعاينة وتجميع الأخطاء ---------- */
const CATCH='<scr'+'ipt>window.addEventListener("error",function(e){parent.postMessage({apkErr:e.message+" (سطر "+e.lineno+")"},"*")});window.addEventListener("unhandledrejection",function(e){parent.postMessage({apkErr:String(e.reason)},"*")});<\/scr'+'ipt>';
function pushVersion(i){const a=S.apps[i];if(a.code.trim()&&(!a.versions[0]||a.versions[0].code!==a.code)){a.versions.unshift({t:new Date().toLocaleString('ar'),code:a.code});a.versions=a.versions.slice(0,8)}save()}
function preview(i){const a=S.apps[i];pushVersion(i);a.err='';save();
  const el=$('#err'+i);if(el)el.textContent='';
  const f=$('#pv'+i);if(!f)return;
  let c=a.code;c=/<head[^>]*>/i.test(c)?c.replace(/<head[^>]*>/i,m=>m+CATCH):CATCH+c;f.srcdoc=c}
window.addEventListener('message',e=>{if(!e.data||!e.data.apkErr)return;
  S.apps.forEach((a,i)=>{const f=$('#pv'+i);if(f&&e.source===f.contentWindow){a.err+=(a.err?'\n':'')+e.data.apkErr;save();const el=$('#err'+i);if(el)el.textContent='⚠ '+a.err}})});
function restore(i,j){pushVersion(i);S.apps[i].code=S.apps[i].versions[j].code;save();render();toast('تم الرجوع للنسخة')}

/* ---------- الذكاء الاصطناعي ---------- */
const OAI={openrouter:{url:'https://openrouter.ai/api/v1/chat/completions',key:'orKey',model:'orModel',def:'',name:'OpenRouter'},groq:{url:'https://api.groq.com/openai/v1/chat/completions',key:'gqKey',model:'gqModel',def:'openai/gpt-oss-120b',name:'Groq'}};
async function ai(prompt){const k=S.keys;
  if(OAI[k.provider]){const c=OAI[k.provider];const key=k[c.key],model=k[c.model]||c.def;
    if(!key)throw new Error('أدخل مفتاح '+c.name+' في قائمة المفاتيح');
    if(!model)throw new Error('اكتب اسم النموذج في قائمة المفاتيح (انسخه من openrouter.ai/models واختر نموذجاً مجانياً ينتهي بـ :free)');
    const r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:model,messages:[{role:'user',content:prompt}],max_tokens:8000})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('فشل الاتصال بـ '+c.name+' (خطأ '+r.status+')'));
    const t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!t)throw new Error('رد فارغ من '+c.name+'. جرّب نموذجاً آخر.');
    return t}
  if(k.provider==='claude'){
    if(!k.claude)throw new Error('أدخل مفتاح Claude في قائمة المفاتيح');
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k.claude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODELS.claude,max_tokens:16000,messages:[{role:'user',content:prompt}]})});
    const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'فشل الاتصال بـ Claude');
    return j.content.map(c=>c.text||'').join('')}
  const gk=[k.gemini,k.gemini2,k.gemini3].filter(Boolean);
  if(!gk.length)throw new Error('أدخل مفتاح Gemini في قائمة المفاتيح');
  let last;
  for(let n=0;n<gk.length;n++){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+MODELS.gemini+':generateContent?key='+encodeURIComponent(gk[n]),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){if(!j.candidates||!j.candidates[0]||!j.candidates[0].content)throw new Error('رد فارغ من Gemini، حاول مرة أخرى.');return (j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')}
    const msg=(j.error&&j.error.message)||'فشل الاتصال بـ Gemini';
    last=new Error(msg);
    if(!(r.status===429||/quota|exhaust/i.test(msg)))throw last;
    if(n<gk.length-1)toast('حصة المفتاح '+(n+1)+' خلصت، التحويل للمفتاح '+(n+2))}
  throw last}
function clean(t){const m=t.match(/```(?:\w+)?\n([\s\S]*?)```/);return (m?m[1]:t).trim()}
const SYS='أنت مبرمج محترف. التطبيق مكتوب بـ HTML وCSS وJavaScript في ملف واحد index.html ويعمل داخل تطبيق أندرويد. أعد الكود الكامل فقط داخل كتلة ```html بدون أي شرح.\n\n';
async function busy(btn,fn){const t=btn.textContent;btn.disabled=true;btn.textContent='⏳ جاري العمل...';try{await fn()}catch(e){toast(arErr(e))}finally{btn.disabled=false;btn.textContent=t}}
function setCode(i,c){pushVersion(i);S.apps[i].code=c;save();const t=$('#code'+i);if(t)t.value=c;preview(i)}
function aiEdit(i,btn){busy(btn,async()=>{const req=$('#req'+i).value.trim();if(!req)throw new Error('اكتب التعديل المطلوب');
  const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\nالتعديل المطلوب: '+req);
  setCode(i,clean(out));$('#req'+i).value='';toast('تم التعديل ✔')})}
function aiFix(i,btn){busy(btn,async()=>{preview(i);await sleep(1500);const err=S.apps[i].err;
  const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\n'+(err?'الأخطاء الظاهرة عند التشغيل:\n'+err:'لم تظهر أخطاء صريحة، افحص الكود وأصلح أي مشكلة تمنع عمله.')+'\n\nأصلح الخطأ.');
  setCode(i,clean(out));toast('تم إصلاح الكود ✔')})}

/* ---------- نافذة المراحل ---------- */
function closeSheet(){$('#sheet').classList.remove('on')}
function progress(title,labels){const sh=$('#sheet');const st=labels.map(()=>({s:'wait',m:''}));let extra='';
  const icon={wait:'○',run:'◔',ok:'✔',bad:'✖'};
  function draw(){sh.innerHTML=`<div class="sheetbox"><h3>${esc(title)}</h3>${labels.map((l,i)=>`<div class="step ${st[i].s}"><span>${icon[st[i].s]}</span><div>${esc(l)}<small>${esc(st[i].m)}</small></div></div>`).join('')}<div>${extra}</div><button class="ghost" onclick="closeSheet()">إغلاق</button></div>`;sh.classList.add('on')}
  draw();return {set(i,s,m){st[i]={s:s,m:m===undefined?st[i].m:m};draw()},extra(h){extra=h;draw()}}}

/* ---------- Supabase ---------- */
async function sb(path,opt){opt=opt||{};const r=await fetch('https://api.supabase.com'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+S.keys.sbToken,'Content-Type':'application/json'}}));
  const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=t}
  if(!r.ok){if(r.status===401||r.status===403)throw new Error('مفتاح Supabase غير صحيح. استخدم Access Token من حسابك (يبدأ بـ sbp_).');throw new Error((j&&j.message)||('خطأ Supabase '+r.status))}
  return j}
function parseSections(t){const m=t.match(/===SQL===([\s\S]*?)===APP1===([\s\S]*?)===APP2===([\s\S]*)$/);if(!m)throw new Error('رد الذكاء الاصطناعي غير مكتمل، حاول مرة أخرى.');return {sql:clean(m[1]),a1:clean(m[2]),a2:clean(m[3])}}
function linkApps(btn){busy(btn,async()=>{const k=S.keys;
  if(!k.sbToken||!k.sbRef)throw new Error('أدخل مفتاح Supabase والـ project ref في قائمة المفاتيح');
  if(!S.apps[0].code.trim()||!S.apps[1].code.trim())throw new Error('اكتب كود التطبيقين أولاً');
  const P=progress('ربط التطبيقين عبر Supabase',['قراءة بيانات المشروع','الذكاء الاصطناعي يصمم الجداول والصلاحيات','تنفيذ الجداول في قاعدة البيانات','تعديل كود التطبيقين للاتصال']);
  try{
    P.set(0,'run');
    const keys=await sb('/v1/projects/'+k.sbRef+'/api-keys');
    const anon=(keys.find(x=>x.name==='anon')||{}).api_key;if(!anon)throw new Error('ما قدرت أجيب مفتاح المشروع. تأكد من الـ project ref.');
    const url='https://'+k.sbRef+'.supabase.co';P.set(0,'ok');

/* ---------- GitHub والبناء ---------- */
async function gh(path,opt){opt=opt||{};const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{Authorization:'Bearer '+S.keys.ghToken,Accept:'application/vnd.github+json','Content-Type':'application/json'}}));
  if(r.status===204)return {};const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j={message:t}}
  if(!r.ok){const er=new Error(j.message||('خطأ GitHub '+r.status));er.status=r.status;throw er}return j}
async function ghText(path){const r=await fetch('https://api.github.com'+path,{headers:{Authorization:'Bearer '+S.keys.ghToken,Accept:'application/vnd.github+json'}});return r.text()}
async function repoFull(){let r=(S.keys.repo||'apk-app').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'');
  if(!r.includes('/')){const u=await gh('/user');r=u.login+'/'+r}return r}
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(repo,branch,path,content){let sha;
  try{sha=(await gh('/repos/'+repo+'/contents/'+path+'?ref='+branch)).sha}catch(e){if(e.status!==404)throw e}
  await gh('/repos/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify({message:'build: '+path,content:b64(content),branch:branch,sha:sha})})}
async function putB64(repo,branch,path,data){let sha;
  try{sha=(await gh('/repos/'+repo+'/contents/'+path+'?ref='+branch)).sha}catch(e){if(e.status!==404)throw e}
  await gh('/repos/'+repo+'/contents/'+path,{method:'PUT',body:JSON.stringify({message:'icon: '+path,content:data,branch:branch,sha:sha})})}
function pickIcon(i,inp){const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
      const m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
      x.drawImage(im,sx,sy,m,m,0,0,512,512);
      try{S.apps[i].icon=c.toDataURL('image/png');save();$('#ic'+i).src=S.apps[i].icon;toast('تم اختيار الأيقونة ✔ تظهر بعد البناء')}
      catch(e){S.apps[i].icon='';toast('الصورة كبيرة أو غير مدعومة، جرّب صورة ثانية')}};
    im.onerror=()=>toast('تعذّر قراءة الصورة');
    im.src=rd.result};
  rd.readAsDataURL(f);inp.value=''}
const pkg=n=>JSON.stringify({name:n,version:'1.0.0',private:true,dependencies:{'@capacitor/android':'^7.0.0','@capacitor/core':'^7.0.0'},devDependencies:{'@capacitor/cli':'^7.0.0'}},null,2);
const cfg=(n,name)=>JSON.stringify({appId:'com.myapps.'+n,appName:name||n,webDir:'www'},null,2);
const LOGS={};

async function build(i){const a=S.apps[i],key=slugOf(a.name);
  if(!key)return toast('اكتب اسم التطبيق بالإنجليزية (حروف وأرقام فقط)');
  if(S.apps.some((x,j)=>j!==i&&slugOf(x.name)===key))return toast('هذا الاسم مستخدم للتطبيق الآخر، غيّره');
  if(!a.code.trim())return toast('اكتب الكود أولاً');
  if(!S.keys.ghToken)return toast('أدخل مفتاح GitHub في قائمة المفاتيح');
  const P=progress('بناء: '+a.name,['التحقق من الحساب والمستودع','رفع الكود إلى apps/'+key,'تشغيل البناء','جاري بناء ملف APK','تجهيز ملف التحميل']);
  let step=0;
  try{
    P.set(0,'run');const repo=await repoFull();let info;
    try{info=await gh('/repos/'+repo)}catch(e){if(e.status===404){info=await gh('/user/repos',{method:'POST',body:JSON.stringify({name:repo.split('/')[1],auto_init:true,private:false})});await sleep(3000)}else throw e}
    const branch=info.default_branch||'main';P.set(0,'ok','المستودع: '+repo);
    step=1;P.set(1,'run');const dir='apps/'+key;
    try{await gh('/repos/'+repo+'/contents/.github/workflows/build-app.yml?ref='+branch)}catch(e){if(e.status===404)throw new Error('ملف build-app.yml غير موجود في المستودع');throw e}
    await put(repo,branch,dir+'/www/index.html',a.code);
    await put(repo,branch,dir+'/package.json',pkg(key));
    await put(repo,branch,dir+'/capacitor.config.json',cfg(key,a.name));
    if(a.icon)await putB64(repo,branch,dir+'/icon.png',a.icon.split(',')[1]);
    P.set(1,'ok');
    step=2;P.set(2,'run');const t0=Date.now();
    for(let n=0;n<8;n++){try{await gh('/repos/'+repo+'/actions/workflows/build-app.yml/dispatches',{method:'POST',body:JSON.stringify({ref:branch,inputs:{app:key}})});break}
      catch(e){if((e.status===404||e.status===422)&&n<7){P.set(2,'run','بانتظار تجهيز خطوات البناء...');await sleep(4000)}else throw e}}
    P.set(2,'ok');step=3;P.set(3,'run','بانتظار الخادم...');
    let run=null;const lim=Date.now()+30*60000;
    while(Date.now()<lim){await sleep(6000);
      const rs=await gh('/repos/'+repo+'/actions/workflows/build-app.yml/runs?event=workflow_dispatch&per_page=5');
      run=rs.workflow_runs.find(x=>new Date(x.created_at).getTime()>=t0-30000)||null;
      if(run){P.set(3,'run',run.status==='completed'?'انتهى':run.status==='queued'?'في الانتظار...':'جاري البناء... (قد يستغرق 3-6 دقائق)');if(run.status==='completed')break}}
    if(!run||run.status!=='completed')throw new Error('انتهى وقت الانتظار. حاول مرة أخرى.');
    if(run.conclusion!=='success'){
      const jobs=await gh('/repos/'+repo+'/actions/runs/'+run.id+'/jobs');
      const job=jobs.jobs.find(j=>j.conclusion==='failure')||jobs.jobs[0];
      const fs=(job.steps||[]).find(s=>s.conclusion==='failure');
      let log='';try{log=(await ghText('/repos/'+repo+'/actions/jobs/'+job.id+'/logs')).slice(-5000)}catch(e){}
      LOGS[i]=log;P.set(3,'bad','فشل البناء'+(fs?' في خطوة: '+fs.name:''));
      let ex='';
      try{ex=await ai('اشرح بالعربي البسيط وبأقصى وضوح، في 3 أسطر كحد أقصى، سبب فشل بناء تطبيق الأندرويد هذا وما الحل. السجل:\n'+log)}catch(e){ex='السجل:\n'+log.slice(-800)}
      P.extra('<div class="explain">'+esc(ex)+'</div><button class="acc" style="margin-top:10px" onclick="fixBuild('+i+')">🛠 صلّح تلقائياً وأعد البناء</button>');return}
    P.set(3,'ok');step=4;P.set(4,'run');
    const tag=key+'-build-'+run.run_number;let asset=null;
    for(let n=0;n<8&&!asset;n++){try{const rel=await gh('/repos/'+repo+'/releases/tags/'+tag);asset=(rel.assets||[]).find(x=>/\.apk$/.test(x.name))}catch(e){}if(!asset)await sleep(3000)}
    if(!asset)throw new Error('تم البناء لكن لم أجد ملف APK.');
    a.apk=asset.browser_download_url;save();P.set(4,'ok');
    P.extra('<a class="btn acc" style="margin-top:10px" href="'+esc(a.apk)+'" target="_blank">⬇ تحميل APK</a>');
  }catch(e){P.set(step,'bad',arErr(e))}}

async function fixBuild(i){closeSheet();toast('جاري إصلاح الكود...');
  try{const out=await ai(SYS+'الكود الحالي:\n```html\n'+S.apps[i].code+'\n```\n\nفشل بناء التطبيق بهذا الخطأ:\n'+(LOGS[i]||'')+'\n\nأصلح الكود ليعمل ويُبنى بنجاح.');

async function buildNative(i,l){const a=S.apps[i],key=slugOf(a.name),W=WF[l];
  if(!key)return toast('اكتب اسم التطبيق بالإنجليزية (حروف وأرقام فقط)');
  if(S.apps.some((x,j)=>j!==i&&slugOf(x.name)===key))return toast('هذا الاسم مستخدم للتطبيق الآخر، غيّره');
  if(!a.code.trim())return toast('اكتب الكود أولاً');
  if(!S.keys.ghToken)return toast('أدخل مفتاح GitHub في قائمة المفاتيح');
  const P=progress(W.name+': '+a.name,['التحقق من المستودع وملف البناء','رفع الكود إلى apps/'+key,'تشغيل البناء','جاري بناء ملف APK','تجهيز ملف التحميل']);
  let step=0;
  try{
    P.set(0,'run');const repo=await repoFull();const info=await gh('/repos/'+repo);const branch=info.default_branch||'main';
    let has=true;
    try{await gh('/repos/'+repo+'/contents/.github/workflows/'+W.file+'?ref='+branch)}catch(e){if(e.status===404)has=false;else throw e}
    if(!has){P.set(0,'run','إنشاء ملف البناء '+W.file+' تلقائياً...');await put(repo,branch,'.github/workflows/'+W.file,W.yaml);await sleep(5000)}
    P.set(0,'ok','المستودع: '+repo);
    step=1;P.set(1,'run');const d='apps/'+key;
    await put(repo,branch,d+'/'+W.main,a.code);
    if(a.icon)await putB64(repo,branch,d+'/icon.png',a.icon.split(',')[1]);
    P.set(1,'ok');
    step=2;P.set(2,'run');const t0=Date.now();
    for(let n=0;n<8;n++){try{await gh('/repos/'+repo+'/actions/workflows/'+W.file+'/dispatches',{method:'POST',body:JSON.stringify({ref:branch,inputs:{app:key}})});break}
      catch(e){if((e.status===404||e.status===422)&&n<7){P.set(2,'run','بانتظار تجهيز خطوات البناء...');await sleep(4000)}else throw e}}
    P.set(2,'ok');step=3;P.set(3,'run','بانتظار الخادم...');
    let run=null;const lim=Date.now()+W.maxMin*60000;
    while(Date.now()<lim){await sleep(8000);
      const rs=await gh('/repos/'+repo+'/actions/workflows/'+W.file+'/runs?event=workflow_dispatch&per_page=5');
      run=rs.workflow_runs.find(x=>new Date(x.created_at).getTime()>=t0-30000)||null;
      if(run){P.set(3,'run',run.status==='completed'?'انتهى':run.status==='queued'?'في الانتظار...':'جاري البناء... (قد يستغرق '+W.min+' دقيقة)');if(run.status==='completed')break}}
    if(!run||run.status!=='completed')throw new Error('انتهى وقت الانتظار. تابع البناء من تبويب Actions في GitHub.');
    if(run.conclusion!=='success'){
      const jobs=await gh('/repos/'+repo+'/actions/runs/'+run.id+'/jobs');
      const job=jobs.jobs.find(j=>j.conclusion==='failure')||jobs.jobs[0];
      const fst=(job.steps||[]).find(s=>s.conclusion==='failure');
      let log='';try{log=(await ghText('/repos/'+repo+'/actions/jobs/'+job.id+'/logs')).slice(-5000)}catch(e){}
      LOGS[i]=log;P.set(3,'bad','فشل البناء'+(fst?' في خطوة: '+fst.name:''));
      let ex='';
      try{ex=await ai('اشرح بالعربي البسيط وبأقصى وضوح، في 3 أسطر كحد أقصى، سبب فشل بناء تطبيق الأندرويد هذا وما الحل. السجل:\n'+log)}catch(e){ex='السجل:\n'+log.slice(-800)}
      P.extra('<div class="explain">'+esc(ex)+'</div><button class="acc" style="margin-top:10px" onclick="fixNative('+i+')">🛠 صلّح تلقائياً وأعد البناء</button>');return}
    P.set(3,'ok');step=4;P.set(4,'run');
    const tag=W.tag+'-'+key+'-build-'+run.run_number;let asset=null;
    for(let n=0;n<8&&!asset;n++){try{const rel=await gh('/repos/'+repo+'/releases/tags/'+tag);asset=(rel.assets||[]).find(x=>/\.apk$/.test(x.name))}catch(e){}if(!asset)await sleep(3000)}
    if(!asset)throw new Error('تم البناء لكن لم أجد ملف APK.');
    a.apk=asset.browser_download_url;save();P.set(4,'ok');
    P.extra('<a class="btn acc" style="margin-top:10px" href="'+esc(a.apk)+'" target="_blank">⬇ تحميل APK</a>');
  }catch(e){P.set(step,'bad',arErr(e))}}

function pkgOk(p){return /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/.test(p)&&!p.split('.').some(s=>JKW.indexOf(s)>-1)}

const _put1=put;
put=async function(repo,branch,path,content){
  let m=path.match(/^apps\/([^/]+)\/capacitor\.config\.json$/);
  if(m){const pk=pkgForKey(m[1]);if(pk){try{const o=JSON.parse(content);o.appId=pk;content=JSON.stringify(o,null,2)}catch(e){}}}
  await _put1(repo,branch,path,content);
  m=path.match(/^apps\/([^/]+)\/main\.(dart|py)$/);
  if(m)await _put1(repo,branch,'apps/'+m[1]+'/pkg.txt',(pkgForKey(m[1])||'')+'\n')};

const WF_FLUTTER3=`# v3
# v2 compatible
name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: create project
        run: |
          PKG=$(cat apps/$APP/pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app_$APP; fi
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' flutter_out/android/app/src/main/AndroidManifest.xml
          sed -i "/applicationId/s|com.myapps.app_$APP|$PKG|" flutter_out/android/app/build.gradle*
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: build
        working-directory: flutter_out
        run: flutter build apk --release
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-\${{ inputs.app }}-build-\${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk
`;

    env:
      APP: \${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: write spec
        working-directory: apps/\${{ inputs.app }}
        run: |
          PKG=$(cat pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app$APP; fi
          NAM=$(echo "$PKG" | awk -F. '{print $NF}')
          DOM=$(echo "$PKG" | sed 's/\\.[^.]*$//')
          cat > buildozer.spec <<EOF
          [app]
          title = $APP
          package.name = $NAM
          package.domain = $DOM
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = 1.0
          requirements = python3,kivy==2.3.0,certifi
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          sed -i 's/^ *//' buildozer.spec
          if [ -f icon.png ]; then sed -i '/^\\[app\\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec; fi
      - name: cache
        uses: actions/cache@v4
        with:
          path: apps/\${{ inputs.app }}/.buildozer
          key: buildozer-\${{ inputs.app }}-\${{ github.run_number }}
          restore-keys: buildozer-\${{ inputs.app }}-
      - name: build
        working-directory: apps/\${{ inputs.app }}
        run: buildozer -v android debug
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-\${{ inputs.app }}-build-\${{ github.run_number }}
          files: apps/\${{ inputs.app }}/bin/*.apk
`;

ai=function(p){
  if(p.indexOf(CRE_MARK)>-1){
    p=p.split(CRE_MARK).join('أنشئ تطبيقاً متكاملاً يعمل من الصفر');
    p+=p.indexOf(BT+'dart بدون')>-1?PRO_FL:p.indexOf(BT+'python بدون')>-1?PRO_PY:PRO_HTML;
    const st=window._sty;if(st&&STYH[st])p+='\n- نمط الألوان المطلوب: '+STYH[st]+'.'}
  return _ai4(p)};

/* ترقية تصميم تطبيق موجود بدون المساس بوظائفه */
function aiPro(i,btn){return busy(btn,async()=>{
  const a=S.apps[i],l=langOf(i);
  if(!a.code.trim())throw new Error('اكتب أو أنشئ الكود أولاً');
  const hint=l==='flutter'?PRO_FL:l==='python'?PRO_PY:PRO_HTML;
  const head=l==='html'?SYS:sysFor(i);
  const out=await ai(head+'ارتقِ بتصميم واجهة هذا التطبيق إلى مستوى Pro Max، مع الحفاظ التام على كل الوظائف والبيانات وأسماء الدوال والمفاتيح كما هي. غيّر المظهر وتجربة الاستخدام فقط.'+hint+'\n\nالكود الحالي:\n'+BT+FENCE[l]+'\n'+a.code+'\n'+BT);
  setCode(i,clean(out));toast('تمت ترقية التصميم 💎')})}

const _render6=render;
render=function(){
  _render6();
  if(tab==='code')document.querySelectorAll('#main section.card').forEach((sec,i)=>{
    const ed=sec.querySelector('.edit');if(!ed)return;
    const first=ed.querySelector('.row');if(!first)return;
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<button class="acc" style="width:100%" onclick="aiPro('+i+',this)">💎 ترقية التصميم إلى Pro Max</button>';
    first.insertAdjacentElement('afterend',r)})
};
render();/* ===== إضافة: قراءة التطبيق الآخر وفهمه قبل الإنشاء أو المطابقة ===== */
const CS_MARK='كود التطبيق الآخر:\n';
const CS_ASK='اقرأ كود التطبيق التالي بعناية وافهمه جيداً، ثم اكتب ملخصاً دقيقاً ومنظماً بنقاط يشمل:\n1) فكرة التطبيق ودوره (زبون أم إدارة أم غيره).\n2) مكان تخزين البيانات: في Supabase اذكر الرابط والمفتاح وأسماء الجداول والأعمدة وأنواعها، وفي Firebase اذكر الرابط والمسارات، أو مفاتيح localStorage.\n3) شكل كل عنصر بيانات وحقوله والقيم الثابتة مثل حالات الطلب.\n4) ما يكتبه هذا التطبيق وما يقرأه، وطريقة التحديث.\n5) الألوان والخطوط ونمط التصميم.\nاكتب الملخص نصاً فقط بدون إعادة كتابة الكود.\n\n';

/* عند إنشاء تطبيق بالوصف: يقرأ كود التطبيق الآخر ويفهمه أولاً ثم يكتب */
const _ai5=ai;
ai=async function(p){
  const k=p.indexOf(CS_MARK);
  if(k>-1&&p.indexOf('فهم مسبق للتطبيق الآخر')<0){
    try{
      toast('أقرأ التطبيق الآخر وأفهمه أولاً...');
      const sum=(await _ai5(CS_ASK+p.slice(k+CS_MARK.length))).trim();
      p+='\n\nفهم مسبق للتطبيق الآخر (استخلصته من قراءة كوده، التزم به حرفياً في أسماء الجداول والحقول والقيم والمسارات ومفاتيح التخزين):\n'+sum;
    }catch(e){}
  }
  return _ai5(p)};

/* عند لصق كود: زر يقرأ التطبيق الآخر ويطابق هذا الكود عليه */
function aiMatch(i,btn){return busy(btn,async()=>{
  const a=S.apps[i],o=S.apps[1-i];
  if(!a.code.trim())throw new Error('الصق كود هذا التطبيق أولاً');
  if(!o.code.trim())throw new Error('اكتب كود التطبيق الآخر أولاً ليقرأه');
  toast('أقرأ التطبيق الآخر وأفهمه أولاً...');
  const sum=(await _ai5(CS_ASK+BT+FENCE[langOf(1-i)]+'\n'+o.code+'\n'+BT)).trim();
  const l=langOf(i);
  const out=await ai((l==='html'?SYS:sysFor(i))+'عدّل هذا التطبيق ليتكامل مع التطبيق الآخر ويتشاركان نفس البيانات.\n\nملخص فهمي للتطبيق الآخر:\n'+sum+'\n\nالتزم حرفياً بنفس أسماء الجداول والحقول والقيم ومفاتيح التخزين وطريقة الاتصال، وأبقِ بقية وظائف هذا التطبيق وتصميمه كما هي. أعد الكود الكامل فقط.\n\nالتطبيق المطلوب تعديله:\n'+BT+FENCE[l]+'\n'+a.code+'\n'+BT);
  setCode(i,clean(out));toast('تمت المطابقة ✔')})}

const _render8=render;
render=function(){
  _render8();
  if(tab==='code'&&S.mode==='link')document.querySelectorAll('#main section.card').forEach((sec,i)=>{
    const ta=sec.querySelector('textarea.code');if(!ta)return;
    const d=document.createElement('div');d.className='row';
    d.innerHTML='<button class="acc" style="width:100%" onclick="aiMatch('+i+',this)">🧠 اقرأ التطبيق الآخر وطابق هذا الكود عليه</button>';
    ta.insertAdjacentElement('beforebegin',d)})
};
render();/* ===== إضافة: تحسين عرض صفحة الكود ===== */
(function(){
const css=`
.cx-sw{display:flex;gap:8px;margin-bottom:12px}
.cx-sw button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:16px;padding:10px 8px;font-size:14px;font-weight:600;line-height:1.5;text-align:center}
.cx-sw button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#243557;color:#fff;font-size:12px;margin-left:6px}
.cx-sw button .nm{display:inline-block;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.cx-sw button small{display:block;font-weight:400;font-size:11px;opacity:.8}
.cx-sw button.on{background:linear-gradient(135deg,#0d47a1,#2f80ff);color:#fff;border-color:transparent}
.cx-sw button.on b{background:rgba(255,255,255,.25)}
.cx-hd{display:flex;align-items:center;gap:10px}
.cx-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pri);color:#fff;font-weight:700;font-size:14px}
.cx-hd input.name{flex:1;margin:0;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 4px}
.cx-lg{flex:none;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(47,128,255,.18);color:#7fb2ff;white-space:nowrap}
.cx-set{margin-top:12px}
.cx-set summary{cursor:pointer;padding:11px 12px;background:#0e1730;border:1px solid var(--line);border-radius:12px;list-style:none;color:var(--tx);font-size:14px}
.cx-set summary::-webkit-details-marker{display:none}
.cx-in{padding:4px 2px 8px}
.cx-cr{margin-top:6px}
.cx-seg{display:flex;gap:4px;background:#0e1730;border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.cx-seg button{background:transparent;color:var(--mut);padding:10px;font-size:14px;border-radius:11px}
.cx-seg button.on{background:var(--pri);color:#fff}
.cx-tb{display:none;gap:6px;margin-top:8px;flex-wrap:wrap}
.cx-tb button{flex:none;padding:7px 12px;font-size:13px;font-weight:500;background:#243557;border-radius:10px}
#main textarea.code{height:300px;background:#0a1124;border-radius:14px;line-height:1.6;font-size:12.5px;margin-top:8px;tab-size:2}
#main textarea.code.cx-big{height:70vh}
#main section.card iframe{height:440px;margin-top:8px}
iframe.cx-fs{position:fixed!important;inset:0;width:100%!important;height:100%!important;margin:0!important;border:0!important;border-radius:0!important;z-index:50}
#cxx{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:60;display:none;width:auto;flex:none;padding:9px 16px;background:#ff5c5c;border-radius:20px;font-size:14px}
.cx-ai{display:none;margin-top:8px}
.cx-ax{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cx-ax button{width:100%;padding:13px 6px;font-size:14px}
.cx-ax .bld{grid-column:1/-1;background:linear-gradient(135deg,#ffb300,#ff8f00);color:#222;font-size:16px}
`;
const stl=document.createElement('style');stl.textContent=css;document.head.appendChild(stl);
window._ap=window._ap||0;window._vw=window._vw||{};window._dt=window._dt||{};
const secOf=i=>document.querySelectorAll('#main section.card')[i];

function applyView(i){
  const sec=secOf(i);if(!sec)return;
  const v=window._vw[i]||'code',ta=$('#code'+i),fr=$('#pv'+i);
  if(!ta||!fr)return;
  ta.style.display=v==='code'?'block':'none';
  fr.style.display=v==='pv'?'block':'none';
  const t1=sec.querySelector('.cx-t1'),t2=sec.querySelector('.cx-t2'),ai=sec.querySelector('.cx-ai');
  if(t1)t1.style.display=v==='code'?'flex':'none';
  if(t2)t2.style.display=v==='pv'?'flex':'none';
  if(ai)ai.style.display=v==='pv'?'block':'none';
  sec.querySelectorAll('.cx-seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
function statTxt(i){return LANGN[langOf(i)]+(S.apps[i].code.trim()?' • ✔':' • فارغ')}

window.cxApp=function(n){
  window._ap=n;
  document.querySelectorAll('#main section.card').forEach((s,i)=>{s.style.display=i===n?'block':'none'});
  document.querySelectorAll('.cx-sw button').forEach((b,i)=>b.classList.toggle('on',i===n));
};
window.cxView=function(i,v){window._vw[i]=v;applyView(i);if(v==='pv')preview(i)};
window.cxRun=function(i){window._vw[i]='pv';applyView(i);preview(i)};
window.cxEdit=function(i){toggleEdit(i);const e=$('#edit'+i);if(e&&!e.hidden)e.scrollIntoView({behavior:'smooth',block:'nearest'})};
window.cxBig=function(i){const t=$('#code'+i);if(t)t.classList.toggle('cx-big')};
window.cxCopy=function(i){
  const t=S.apps[i].code;
  if(!t.trim())return toast('لا يوجد كود لنسخه');
  const ok=()=>toast('تم نسخ الكود ✔');
  function fb(){const ta=$('#code'+i);ta.focus();ta.select();try{document.execCommand('copy');ok()}catch(e){toast('تعذّر النسخ')}}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
};
window.cxClear=function(i){
  if(!S.apps[i].code.trim())return;
  if(!confirm('مسح الكود؟ يتحفظ في النسخ السابقة.'))return;
  pushVersion(i);S.apps[i].code='';S.apps[i].pv='';save();render();
};
window.cxFs=function(i){
  const f=$('#pv'+i);if(!f)return;
  const on=f.classList.toggle('cx-fs');
  let b=$('#cxx');
  if(!b){
    b=document.createElement('button');b.id='cxx';b.textContent='✕ إغلاق';
    b.onclick=function(){const x=document.querySelector('iframe.cx-fs');if(x)x.classList.remove('cx-fs');b.style.display='none'};
    document.body.appendChild(b);
  }
  b.style.display=on?'block':'none';
};

function make(sec,i){
  const a=S.apps[i],l=langOf(i),q=s=>sec.querySelector(s);
  const nameIn=q('input.name'),hint=q('p.note');
  const pk=q('input[placeholder^="com.myapps"]'),pkgBox=pk&&pk.parentElement;
  const ls=q('select[onchange^="setLang"]'),langBox=ls&&ls.parentElement;
  const icImg=$('#ic'+i),iconRow=icImg&&icImg.parentElement;
  const descBtn=q('button[onclick^="toggleDesc"]'),desc=$('#desc'+i);
  const ta=$('#code'+i),fr=$('#pv'+i);
  const prevBtn=q('button[onclick^="preview("]'),editBtn=q('button[onclick^="toggleEdit("]');
  const bldBtn=q('button[onclick^="buildAny("]'),aiBtn=q('button[onclick^="aiPreview("]');
  const edit=$('#edit'+i);
  if(!nameIn||!ta||!fr)return;

  /* الترويسة */
  const hd=document.createElement('div');hd.className='cx-hd';
  hd.innerHTML='<span class="cx-n">'+(i+1)+'</span>';
  hd.appendChild(nameIn);
  hd.insertAdjacentHTML('beforeend','<span class="cx-lg">'+LANGN[l]+'</span>');
  sec.prepend(hd);
  nameIn.addEventListener('input',()=>{const n=document.querySelectorAll('.cx-sw button')[i];if(n){const e=n.querySelector('.nm');if(e)e.textContent=nameIn.value||'بدون اسم'}});

  /* الإعدادات القابلة للطي */
  const det=document.createElement('details');det.className='cx-set';det.open=!!window._dt[i];
  det.innerHTML='<summary>⚙️ الإعدادات: اللغة، الحزمة، الأيقونة</summary>';
  const inner=document.createElement('div');inner.className='cx-in';
  [hint,langBox,pkgBox,iconRow].forEach(n=>{if(n)inner.appendChild(n)});
  det.appendChild(inner);
  det.addEventListener('toggle',()=>{window._dt[i]=det.open});
  hd.after(det);

  /* إنشاء بالوصف */
  const cr=document.createElement('div');cr.className='cx-cr';
  if(descBtn)cr.appendChild(descBtn);
  if(desc)cr.appendChild(desc);
  det.after(cr);

  /* تبويب الكود والمعاينة */
  const seg=document.createElement('div');seg.className='cx-seg';
  seg.innerHTML='<button data-v="code" onclick="cxView('+i+',\'code\')">💻 الكود</button><button data-v="pv" onclick="cxView('+i+',\'pv\')">👁 المعاينة</button>';
  const t1=document.createElement('div');t1.className='cx-tb cx-t1';
  t1.innerHTML='<button onclick="cxCopy('+i+')">📋 نسخ</button><button onclick="cxBig('+i+')">⤢ تكبير</button><button onclick="cxClear('+i+')">🧹 مسح</button>';
  const t2=document.createElement('div');t2.className='cx-tb cx-t2';
  t2.innerHTML='<button onclick="cxRun('+i+')">🔄 تحديث</button><button onclick="cxFs('+i+')">⛶ ملء الشاشة</button>';
  ta.before(seg,t1,t2);
  ta.addEventListener('input',()=>{const n=document.querySelectorAll('.cx-sw button')[i];if(n){const s=n.querySelector('small');if(s)s.textContent=statTxt(i)}});

  /* بعد المعاينة: معاينة الذكاء الاصطناعي ثم الأزرار ثم التعديل */
  let ref=fr;
  if(aiBtn){
    const r=aiBtn.closest('.row'),n=r&&r.nextElementSibling;
    const w=document.createElement('div');w.className='cx-ai';
    if(r)w.appendChild(r);
    if(n&&n.classList.contains('note'))w.appendChild(n);
    ref.after(w);ref=w;
  }
  const ax=document.createElement('div');ax.className='cx-ax';
  const r1=prevBtn&&prevBtn.parentElement,r2=bldBtn&&bldBtn.parentElement;
  if(prevBtn){prevBtn.textContent='▶ تشغيل المعاينة';prevBtn.setAttribute('onclick','cxRun('+i+')');ax.appendChild(prevBtn)}
  if(editBtn){editBtn.textContent='✏️ تعديل بالذكاء الاصطناعي';editBtn.setAttribute('onclick','cxEdit('+i+')');ax.appendChild(editBtn)}
  if(bldBtn){bldBtn.classList.add('bld');ax.appendChild(bldBtn)}
  [r1,r2].forEach(r=>{if(r&&r.parentElement&&!r.children.length)r.remove()});
  ref.after(ax);
  if(edit)ax.after(edit);

  applyView(i);
}

const _render7=render;
render=function(){
  _render7();
  if(tab!=='code')return;
  const main=$('#main'),secs=[...main.querySelectorAll('section.card')];
  if(secs.length<2)return;
  const link=main.querySelector('.link');
  const sw=document.createElement('div');sw.className='cx-sw';
  sw.innerHTML=S.apps.map((a,i)=>'<button class="'+(i===window._ap?'on':'')+'" onclick="cxApp('+i+')"><b>'+(i+1)+'</b><span class="nm">'+esc(a.name||'بدون اسم')+'</span><small>'+statTxt(i)+'</small></button>').join('');
  main.insertBefore(sw,secs[0]);
  if(link)main.appendChild(link);
  secs.forEach((sec,i)=>{make(sec,i);sec.style.display=i===window._ap?'block':'none'});
};
})();
render();
</script>

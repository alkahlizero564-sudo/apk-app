  const m=$('#main');if(!m||$('#cx-xp'))return;
  const c=document.createElement('div');c.className='card';c.id='cx-xp';
  c.innerHTML='<h2>🎬 خبير التصميم</h2><p class="note" style="margin:0">شغّال دايماً وتلقائي: الذكاء الاصطناعي بيختار الأسلوب الأنسب لفكرة كل تطبيق (أحادي فاخر، نيون داكن، دافئ للطعام، فينتك، ورقي عربي، زمردي ذهبي، سماوي، باستيل زجاجي، طازج)، ويصمّم بشاشة بداية وتعريف وحركة وأزرار بحالات. لتطوير تطبيق موجود: من 🛠 استوديو التحديث اضغط «🎬 تصميم خبير».</p>';
  m.appendChild(c);
};

/* زر في الاستوديو */
const _stuOpen=window.cxStuOpen;
if(typeof _stuOpen==='function'){
  const addBtn=function(){const q=document.querySelector('#sheet .st-q');if(q&&!q.querySelector('.xp-b'))q.insertAdjacentHTML('afterbegin','<button class="acc xp-b" onclick="cxXpReq()">🎬 تصميم خبير</button>')};
  window.cxStuOpen=function(){const r=_stuOpen.apply(this,arguments);addBtn();return r};
  new MutationObserver(function(){addBtn()}).observe($('#sheet'),{childList:true});
}

})();
render();
/* ===== إضافة: مشروع جديد باختيار التطبيق الأول أو الثاني ===== */
(function(){
function hasCode(a){return !!(a&&a.code&&a.code.trim())}
function snap(){return S.apps.map(function(a){const c=JSON.parse(JSON.stringify(a));delete c.versions;delete c.pv;delete c.err;return c})}
function pid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function curProj(){return (S.projects||[]).find(function(p){return p.id===S.cur})}
function busy2(){return !!(window._sysBusy||window._preN||window._preN3||window._pre||window._rvBusy)}

window.cxPjNew=function(){
  if(busy2())return toast('انتظر انتهاء العملية الجارية');
  const sh=$('#sheet');
  sh.innerHTML='<div class="sheetbox"><h3 style="margin-top:0">➕ مشروع جديد</h3><p class="note">اختار وين تبدأ التطبيق الجديد:</p>'
   +'<button class="acc" style="width:100%;padding:18px;font-size:17px;margin-top:6px" onclick="cxPjNewGo(0)">📱 التطبيق الأول</button>'
   +'<button class="acc" style="width:100%;padding:18px;font-size:17px;margin-top:10px" onclick="cxPjNewGo(1)">📱 التطبيق الثاني</button>'
   +'<p class="note">مشروعك الحالي بيتحفظ تلقائياً في 📁 مشاريعي، واسم المشروع الجديد بيتسمّى براهو من اسم التطبيق.</p>'
   +'<button class="ghost" onclick="cxProj()">رجوع</button></div>';
  sh.classList.add('on');
};

window.cxPjNewGo=function(n){
  /* احفظ الحالي */
  const cur=curProj();
  if(cur){cur.apps=snap();cur.t=Date.now()}
  else if(S.apps.some(hasCode)){
    const apps=snap(),a=apps.find(hasCode)||{};
    S.projects.unshift({id:pid(),name:((a.set&&a.set.label)||a.name||'مشروع')+' (حُفظ تلقائياً)',t:Date.now(),kind:apps.filter(hasCode).length>1?2:1,apps:apps});
  }
  S.apps[0]=newApp('first');S.apps[1]=newApp('second');
  const np={id:pid(),name:'مشروع جديد',auto:1,t:Date.now(),kind:1,apps:snap()};
  S.projects.unshift(np);S.cur=np.id;
  save();
  closeSheet();
  window._ap=n;
  go('code');
  setTimeout(function(){
    if(typeof cxApp==='function')cxApp(n);
    const d=$('#desc'+n);if(d&&d.hidden&&typeof toggleDesc==='function')toggleDesc(n);
    const t=$('#dsc'+n);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){t.focus()},350)}
  },120);
  const b=$('#pj-btn');if(b)b.textContent='📁 مشاريعي ('+S.projects.length+')';
  toast('اكتب وصف التطبيق '+(n?'الثاني':'الأول')+' واضغط إنشاء');
};

/* تسمية المشروع تلقائياً من اسم التطبيق */
function autoName(){
  const p=curProj();if(!p||!p.auto)return;
  const a=S.apps.find(hasCode);if(!a)return;
  const nm=(a.set&&a.set.label)||a.name;
  if(nm&&nm!=='first'&&nm!=='second'&&p.name!==nm){p.name=nm;save()}
}
const _rN=render;
render=function(){_rN();autoName();
  if(tab==='code')document.querySelectorAll('#main select[id^="sty"]').forEach(function(sel){sel.selectedIndex=0;const w=sel.parentElement;if(w&&w.querySelectorAll('select').length===1)w.style.display='none';else sel.style.display='none'});
};
setInterval(autoName,4000);
})();
render();
/* ===== إضافة: إضافة تطبيق للمشاريع باختياره من قائمة البناء ===== */
(function(){
function hasCode(a){return !!(a&&a.code&&a.code.trim())}
function cl(a){const c=JSON.parse(JSON.stringify(a));delete c.versions;delete c.pv;delete c.err;return c}
function pid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function nmOf(a){return (a.set&&a.set.label)||a.name||'تطبيق'}
function ver(a){return a.vc?(a.vbase||'1.0')+'.'+a.vc:'لم يُبنَ بعد'}
function lab(){const b=$('#pj-btn');if(b)b.textContent='📁 مشاريعي'+(S.projects.length?' ('+S.projects.length+')':'')}

window.cxPjPick=function(){
  const sh=$('#sheet');
  const btn=function(i){
    const a=S.apps[i],ok=hasCode(a);
    return '<button class="'+(ok?'acc':'sec')+'" '+(ok?'':'disabled ')+'style="width:100%;padding:14px 16px;margin-top:10px;text-align:right;display:flex;align-items:center;gap:12px'+(ok?'':';opacity:.5')+'" onclick="cxPjPickGo('+i+')">'
      +'<span style="font-size:26px">📱</span><span style="flex:1"><b style="display:block;font-size:16px">التطبيق '+(i?'الثاني':'الأول')+': '+esc(ok?nmOf(a):'فاضي')+'</b><small style="opacity:.8">'+(ok?esc(LANGN[langOf(i)])+' — الإصدار '+esc(ver(a)):'ما فيهو كود')+'</small></span></button>';
  };
  const both=hasCode(S.apps[0])&&hasCode(S.apps[1]);
  sh.innerHTML='<div class="sheetbox"><h3 style="margin-top:0">📥 أضف للمشاريع</h3><p class="note">اختار التطبيق من قائمة البناء:</p>'
   +btn(0)+btn(1)
   +(both?'<button class="sec" style="width:100%;padding:14px;margin-top:10px" onclick="cxPjPickGo(2)">🔗 التطبيقين مع بعض (نظام متكامل)</button>':'')
   +'<p class="note">المشروع بيتسمّى باسم التطبيق تلقائياً. لو التطبيق محفوظ قبل كده، بيتحدّث بدل ما يتكرر.</p>'
   +'<button class="ghost" style="margin-top:4px" onclick="cxPjEmpty()">🆕 ابدأ مشروع فاضي بدلاً من ده</button>'
   +'<button class="ghost" onclick="cxProj()">رجوع</button></div>';
  sh.classList.add('on');
};

window.cxPjPickGo=function(i){
  S.projects=S.projects||[];
  let apps,name;
  if(i===2){apps=S.apps.map(cl);name=nmOf(S.apps[0])+' + '+nmOf(S.apps[1])}
  else{if(!hasCode(S.apps[i]))return toast('التطبيق ده فاضي');apps=[cl(S.apps[i]),cl(newApp('second'))];name=nmOf(S.apps[i])}
  const key=apps.filter(hasCode).map(function(a){return slugOf(a.name)}).join('+');
  let p=S.projects.find(function(x){return (x.apps||[]).filter(hasCode).map(function(a){return slugOf(a.name)}).join('+')===key});
  const existed=!!p;
  if(p){p.apps=apps;p.name=name;p.t=Date.now();p.kind=apps.filter(hasCode).length>1?2:1;delete p.auto}
  else{p={id:pid(),name:name,t:Date.now(),kind:apps.filter(hasCode).length>1?2:1,apps:apps};S.projects.unshift(p)}
  if(i===2||(!S.cur&&!hasCode(S.apps[1-i])))S.cur=p.id;
  save();lab();
  toast((existed?'✔ اتحدّث «':'✔ اتضاف «')+p.name+'» في مشاريعي');
  cxProj();
};

/* «مشروع جديد» و«أضف للمشاريع» يفتحوا الاختيار */
const _empty=window.cxPjNew;
window.cxPjEmpty=function(){if(typeof _empty==='function')_empty()};
window.cxPjNew=window.cxPjPick;
window.cxPjAdd=window.cxPjPick;
const _pp=window.cxProj;
window.cxProj=function(){_pp.apply(this,arguments);document.querySelectorAll('#sheet button[onclick="cxPjAdd()"]').forEach(function(b){b.remove()})};
})();
render();
</script>
</body>
</html>

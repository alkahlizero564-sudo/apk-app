<!--META {"h":190,"theme":"dark","title":"إدارة الصيدلية"}-->
<style>
.kp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 18px 0}.kp .card{position:relative;overflow:hidden}.kp .card b{font-size:26px;font-weight:900;display:block}.kp .card small{color:var(--mu);font-weight:700}.kp .card .av{position:absolute;top:14px;left:14px;width:40px;height:40px;border-radius:14px}
.oc{padding:15px;border-radius:22px;background:var(--sf);border:1px solid var(--ln);margin-bottom:12px;box-shadow:var(--sh1)}.oc .it{font-size:13px;color:var(--mu);margin:8px 0 12px;line-height:1.8}
.sp2{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}.sp2 i{flex:1;border-radius:8px 8px 4px 4px;background:var(--sf2)}.sp2 i.on{background:var(--grad)}
</style>
<section class="scr on" id="s-dash">
<div class="top"><div class="ttl"><small>لوحة التحكم</small><h1>إدارة الصيدلية</h1></div><button class="icb pr" onclick="refresh()"><i data-i="refresh"></i></button></div>
<div class="hero"><small>مبيعات اليوم</small><div class="big"><span id="rev">0</span><em>ج</em></div><div class="sp2" id="ch"></div></div>
<div class="kp" id="kp"></div>
<div class="sec"><h3>طلبات تحتاج إجراء</h3><button onclick="tabs('ord')">الكل</button></div><div class="wrap" id="pend"></div>
</section>
<section class="scr" id="s-ord"><div class="top"><div class="ttl"><small>تابع وجهّز</small><h1>الطلبات</h1></div></div><div class="wrap"><div class="seg" id="fs"></div></div><div class="wrap" id="ol" style="margin-top:14px"></div></section>
<section class="scr" id="s-pr"><div class="top"><div class="ttl"><small>المخزون</small><h1>الأدوية</h1></div></div><div class="wrap" id="pl"></div></section>
<button class="fab" id="fab" style="display:none" onclick="editP(null)"><i data-i="plus"></i></button>
<nav class="tabbar"><button class="on" data-t="dash" onclick="tabs('dash')"><i data-i="chart"></i>الرئيسية</button><button data-t="ord" onclick="tabs('ord')"><i data-i="box"></i>الطلبات<span class="bdg" id="nb" style="display:none"></span></button><button data-t="pr" onclick="tabs('pr')"><i data-i="tag"></i>المنتجات</button></nav>
<div class="ov" id="o-p"><div class="sheet"><div class="grab"></div><h2 id="pt">منتج جديد</h2><div class="row" style="align-items:flex-start"><label class="fld" style="width:84px"><span>رمز</span><input class="in" id="pe" style="text-align:center;font-size:24px" maxlength="2"></label><label class="fld sp"><span>الاسم</span><input class="in" id="pn"></label></div><div class="row"><label class="fld sp"><span>السعر</span><input class="in" id="pp" type="number" inputmode="numeric"></label><label class="fld sp"><span>الكمية</span><input class="in" id="ps" type="number" inputmode="numeric"></label></div><label class="fld"><span>التصنيف</span><input class="in" id="pc"></label><button class="btn bl" onclick="saveP()"><i data-i="check"></i>حفظ</button></div></div>
<script>
var ST=['جديد','قيد التجهيز','في الطريق','تم التسليم'],SC=['warn','','','ok'],F=0,EP=null;
function O(){return DB.get('pk2_ph_orders',[])}function P(){return DB.get('pk2_ph_prods',[])}
if(!DB.get('pk2_ph_orders',null)){DB.set('pk2_ph_orders',[{id:uid(),no:1003,cn:'سارة أحمد',rx:'مضاد حيوي حسب وصفة د. خالد',ph:'0912345678',ad:'الرياض، شارع 15',it:[{n:'فيتامين C 1000',e:'🍊',q:2,p:120}],t:240,st:0,d:Date.now()-6e5},{id:uid(),no:1002,cn:'محمد علي',ph:'0998765432',ad:'المنشية',it:[{n:'بنادول 500 مجم',e:'💊',q:1,p:45},{n:'كمامات طبية 50',e:'😷',q:2,p:80}],t:205,st:1,d:Date.now()-5e6},{id:uid(),no:1001,cn:'أمل حسن',ph:'0901112223',ad:'بري',it:[{n:'كريم مرطب',e:'🧴',q:1,p:95}],t:95,st:3,d:Date.now()-9e7}])}
function card(o){return '<div class="oc"><div class="row"><div class="av">'+(o.it[0]?o.it[0].e:'📦')+'</div><div class="sp"><b>#'+o.no+' • '+E(o.cn)+'</b><small class="mu" style="display:block">'+ago(o.d)+' • '+E(o.ad)+'</small></div><span class="badge '+SC[o.st]+'">'+ST[o.st]+'</span></div><div class="it">'+o.it.map(function(x){return x.q+'× '+E(x.n)}).join(' • ')+(o.rx?'<div class="badge warn" style="margin-top:8px">📝 '+E(o.rx)+'</div>':'')+'</div><div class="row"><b class="sp" style="font-size:18px">'+money(o.t)+' ج</b><a class="btn gh sm" href="tel:'+o.ph+'">'+I('phone')+'</a>'+(o.st<3?'<button class="btn sm" onclick="adv(\''+o.id+'\')">'+(o.st==0?'ابدأ التجهيز':o.st==1?'أرسل للتوصيل':'تم التسليم')+'</button>':'')+'</div></div>'}
function adv(id){var L=O(),o=L.find(function(x){return x.id==id});if(o.st==0){var pp=P();o.it.forEach(function(x){var p=pp.find(function(y){return y.n==x.n});if(p)p.s=Math.max(0,p.s-x.q)});DB.set('pk2_ph_prods',pp)}o.st++;DB.set('pk2_ph_orders',L);toast('تم تحديث الطلب إلى: '+ST[o.st]);refresh()}
function refresh(){var L=O(),k=dkey(),rev=0,td=0;L.forEach(function(o){if(dkey(new Date(o.d))==k){rev+=o.t;td++}});countUp($('rev'),rev);var nw=L.filter(function(o){return o.st==0}).length,low=P().filter(function(p){return p.s<=3}).length;
$('nb').style.display=nw?'grid':'none';$('nb').textContent=nw;var b='';for(var i=0;i<12;i++)b+='<i class="'+(i==11?'on':'')+'" style="height:'+(20+Math.abs(Math.sin(i*1.7+rev/97))*80)+'%;background:'+(i==11?'#fff':'rgba(255,255,255,.25)')+'"></i>';$('ch').innerHTML=b;
$('kp').innerHTML='<div class="card"><div class="av">'+I('box')+'</div><small>طلبات اليوم</small><b>'+td+'</b></div><div class="card"><div class="av" style="color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)">'+I('bell')+'</div><small>جديدة</small><b>'+nw+'</b></div><div class="card"><div class="av" style="color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)">'+I('check')+'</div><small>مكتملة</small><b>'+L.filter(function(o){return o.st==3}).length+'</b></div><div class="card"><div class="av" style="color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)">'+I('tag')+'</div><small>مخزون منخفض</small><b>'+low+'</b></div>';
$('pend').innerHTML=L.filter(function(o){return o.st<2}).slice(0,3).map(card).join('')||'<div class="empty"><div class="ill">✅</div><b>كل الطلبات متابعة</b></div>';stagger($('pend'));icons($('kp'));ords();prods()}
function ords(){$('fs').innerHTML=ST.map(function(s,i){return '<button class="'+(i==F?'on':'')+'" onclick="F='+i+';ords()">'+s+'</button>'}).join('');$('ol').innerHTML=O().filter(function(o){return o.st==F}).map(card).join('')||'<div class="empty"><div class="ill">📭</div><b>ما في طلبات '+ST[F]+'</b></div>';stagger($('ol'))}
function prods(){$('pl').innerHTML=P().map(function(p){return '<div class="li" onclick="editP(\''+p.id+'\')"><div class="av" style="background:'+(p.bg||'var(--soft)')+'">'+p.e+'</div><div class="bd"><b>'+E(p.n)+'</b><small>'+E(p.c)+' • '+money(p.p)+' ج</small></div><span class="badge '+(p.s<=0?'bad':p.s<=3?'warn':'ok')+'">'+(p.s<=0?'نفد':p.s+' قطعة')+'</span></div>'}).join('');stagger($('pl'))}
function editP(id){EP=id;var p=id?P().find(function(x){return x.id==id}):{e:'📦',n:'',p:'',s:'',c:''};$('pt').textContent=id?'تعديل المنتج':'منتج جديد';$('pe').value=p.e;$('pn').value=p.n;$('pp').value=p.p;$('ps').value=p.s;$('pc').value=p.c;openS('o-p')}
function saveP(){var n=$('pn').value.trim(),pr=+$('pp').value;if(!n||!pr){toast('اكتب الاسم والسعر');return}var L=P(),o={e:$('pe').value||'📦',n:n,p:pr,s:+$('ps').value||0,c:$('pc').value.trim()||'عام'};if(EP)Object.assign(L.find(function(x){return x.id==EP}),o);else{o.id=uid();o.bg='#dcfce7';L.push(o)}DB.set('pk2_ph_prods',L);closeS();prods();toast('تم حفظ المنتج')}
window.onTab=function(t){$('fab').style.display=t=='pr'?'grid':'none';refresh()};
refresh();
</script>

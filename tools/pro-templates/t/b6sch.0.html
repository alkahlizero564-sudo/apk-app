<nav class="tabbar"><button class="on" data-t="home" onclick="tabs('home')"><i data-i="book"></i>الواجبات</button><button data-t="an" onclick="tabs('an')"><i data-i="megaphone"></i>الإعلانات</button></nav>
<script>
var SB=[['الكل','📚'],['رياضيات','📐'],['علوم','🧪'],['عربي','✍️'],['إنجليزي','🗣'],['تاريخ','🏛']],S='الكل',ME=DB.get('pk2_sc_me',{id:uid(),n:'طالب'});DB.set('pk2_sc_me',ME);
if(!DB.get('pk2_sc_hw',null)){var n=Date.now();DB.set('pk2_sc_hw',[{id:uid(),s:'رياضيات',t:'حل تمارين صفحة 45',b:'التمارين من 1 إلى 10، مع كتابة خطوات الحل كاملة.',due:n+864e5,d:n-864e5,by:'أ. ياسر',sub:{}},{id:uid(),s:'علوم',t:'تقرير عن دورة الماء',b:'تقرير لا يقل عن صفحتين مع رسم توضيحي.',due:n+3*864e5,d:n-2*864e5,by:'أ. منى',sub:{}},{id:uid(),s:'عربي',t:'تعبير: رحلة لا تُنسى',b:'موضوع تعبير من 15 سطراً.',due:n-864e5,d:n-4*864e5,by:'أ. أحمد',sub:{}},{id:uid(),s:'إنجليزي',t:'Unit 4 vocabulary',b:'Memorize the new words and write a sentence for each.',due:n+5*864e5,d:n-3e5,by:'Mr. Omar',sub:{}}]);DB.set('pk2_sc_an',[{id:uid(),t:'رحلة مدرسية الخميس 🚌',b:'رحلة علمية إلى المتحف القومي، الرجاء إحضار موافقة ولي الأمر.',by:'إدارة المدرسة',d:n-36e5},{id:uid(),t:'اختبار رياضيات الأسبوع القادم',b:'الاختبار يشمل الوحدتين الثالثة والرابعة.',by:'أ. ياسر',d:n-2*864e5}])}
function HW(){return DB.get('pk2_sc_hw',[])}
function dueTxt(h){var dd=Math.ceil((h.due-Date.now())/864e5);if(h.sub[ME.id])return ['تم التسليم ✔','ok'];if(dd<0)return ['متأخر '+(-dd)+' يوم','bad'];if(dd==0)return ['آخر يوم اليوم','warn'];if(dd==1)return ['التسليم بكرة','warn'];return ['متبقي '+dd+' أيام','']}
function draw(){var L=HW(),pend=L.filter(function(h){return !h.sub[ME.id]}),p=L.length?1-pend.length/L.length:0;countUp($('pc'),pend.length);$('rg').innerHTML=ring(p,92,10,'#fff','rgba(255,255,255,.25)')+'<b style="position:absolute;inset:0;display:grid;place-items:center;font-size:17px">'+Math.round(p*100)+'%</b>';
var nx=pend.filter(function(h){return h.due>Date.now()}).sort(function(a,b){return a.due-b.due})[0];$('nx').innerHTML=nx?I('clock')+'الأقرب: '+E(nx.s)+' • '+dueTxt(nx)[0]:I('sparkle')+'ما عليك شي، استمتع!';
$('sb').innerHTML=SB.map(function(s){return '<button class="pr '+(s[0]==S?'on':'')+'" onclick="S=\''+s[0]+'\';draw()"><span>'+s[1]+'</span>'+s[0]+'</button>'}).join('');
$('al').innerHTML=L.filter(function(h){return S=='الكل'||h.s==S}).sort(function(a,b){return (!!a.sub[ME.id])-(!!b.sub[ME.id])||a.due-b.due}).map(function(h){var dt=dueTxt(h),em=(SB.find(function(x){return x[0]==h.s})||['','📘'])[1];return '<div class="as"><div class="row"><div class="av">'+em+'</div><div class="sp"><b>'+E(h.t)+'</b><small class="mu" style="display:block">'+h.s+' • '+E(h.by)+'</small></div><span class="badge '+dt[1]+'">'+dt[0]+'</span></div><p>'+E(h.b)+'</p>'+(h.sub[ME.id]?'<button class="btn gh sm" onclick="sub(\''+h.id+'\')">تراجع عن التسليم</button>':'<button class="btn sm" onclick="sub(\''+h.id+'\')">'+I('check')+'سلّمت الواجب</button>')+'</div>'}).join('')||'<div class="empty"><div class="ill">🎉</div><b>ما في واجبات هنا</b></div>';stagger($('al'));$('nd').style.display=DB.get('pk2_sc_an',[]).length?'block':'none'}
function sub(id){var L=HW(),h=L.find(function(x){return x.id==id});if(h.sub[ME.id])delete h.sub[ME.id];else{h.sub[ME.id]=Date.now();toast('أحسنت! تم تسليم الواجب 🌟')}DB.set('pk2_sc_hw',L);draw()}
function ann(){$('anl').innerHTML=DB.get('pk2_sc_an',[]).map(function(a){return '<div class="an"><div class="row"><div class="av g">'+I('megaphone')+'</div><div class="sp"><b>'+E(a.t)+'</b><small class="mu" style="display:block">'+E(a.by)+' • '+ago(a.d)+'</small></div></div><p style="margin-top:10px;line-height:1.8">'+E(a.b)+'</p></div>'}).join('')||'<div class="empty"><div class="ill">📢</div><b>ما في إعلانات</b></div>';stagger($('anl'))}
window.onTab=function(t){if(t=='an')ann();else draw()};
draw();
</script>

<style>

<script>
var M=[['تركيز',25],['استراحة',5],['طويلة',15]],mode=0,left=1500,tot=1500,run=false,tmr=null,snd=true,LOG=DB.get('pk_focus',{}),cyc=0;
if(!DB.get('pk_focus_seed')){for(var i=1;i<7;i++)LOG[dkey(new Date(Date.now()-i*864e5))]=[50,75,100,25,125,75][i-1];DB.set('pk_focus',LOG);DB.set('pk_focus_seed',1)}
var tsk=DB.get('pk_focus_task','');$('task').value=tsk;$('task').oninput=function(){DB.set('pk_focus_task',this.value)};
function fmt(s){var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function draw(){$('md').innerHTML=M.map(function(m,i){return '<button class="'+(i==mode?'on':'')+'" onclick="setM('+i+')">'+m[0]+' '+m[1]+'د</button>'}).join('');
$('rg').innerHTML='<svg width="286" height="286" viewBox="0 0 286 286" style="transform:rotate(-90deg);position:absolute;inset:0"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><circle cx="143" cy="143" r="132" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14"/><circle cx="143" cy="143" r="132" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="829.4" stroke-dashoffset="'+(829.4*(1-left/tot))+'" style="transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 10px rgba(236,72,153,.5))"/></svg>';
$('tt').textContent=fmt(left);$('ml').textContent=M[mode][0];$('st').textContent=run?(mode==0?'ركّز… أنت قدها':'خذ نفس عميق'):'جاهز تبدأ؟';$('go').innerHTML=I(run?'pause':'play');
var s='';for(var i=0;i<4;i++)s+='<i class="'+(i<cyc%4||(cyc&&cyc%4==0&&i<4&&!run&&mode!=0)?'on':'')+'"></i>';$('ses').innerHTML=s}
function setM(i){stop();mode=i;left=tot=M[i][1]*60;draw()}
function stop(){run=false;clearInterval(tmr)}
function done(){stop();if(mode==0){cyc++;var k=dkey();LOG[k]=(LOG[k]||0)+M[0][1];DB.set('pk_focus',LOG);toast('أحسنت! جلسة مكتملة 🎉');setM(cyc%4==0?2:1)}else{toast('انتهت الاستراحة، يلا نرجع');setM(0)}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}stats()}
function go(){if(run)stop();else{run=true;tmr=setInterval(function(){left--;if(left<=0)done();else draw()},1000)}vib();draw()}
function reset(){stop();left=tot;draw()}
function skip(){done()}
function stats(){var tot2=0,mx=1,b=[];for(var o=6;o>=0;o--){var d=new Date(Date.now()-o*864e5),v=LOG[dkey(d)]||0;tot2+=v;mx=Math.max(mx,v);b.push([v,SDAYS[d.getDay()]])}
$('wk').innerHTML=b.map(function(x,i){return '<div><i class="'+(i==6?'on':'')+'" style="height:'+Math.max(6,x[0]/mx*110)+'px"></i><small>'+x[1]+'</small></div>'}).join('');
$('sts').innerHTML='<div class="stat"><small>اليوم</small><b>'+(LOG[dkey()]||0)+'<small style="display:inline;font-size:12px"> د</small></b></div><div class="stat"><small>الأسبوع</small><b>'+Math.round(tot2/60*10)/10+'<small style="display:inline;font-size:12px"> س</small></b></div><div class="stat"><small>جلسات</small><b>'+Math.round(tot2/25)+'</b></div>'}
draw();stats();
</script>

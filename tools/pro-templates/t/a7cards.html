<style>
.dk{padding:18px;border-radius:26px;color:#fff;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 14px 30px rgba(0,0,0,.12)}.dk:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-60px;left:-40px}
.dk h3{font-size:19px;font-weight:850}.dk .bar{background:rgba(255,255,255,.25);margin-top:12px}.dk .bar i{background:#fff}.dk .e{position:absolute;bottom:10px;left:16px;font-size:44px;opacity:.9}
.stage{perspective:1400px;margin:10px 18px 0;height:360px}.fc{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}.fc.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:var(--sh2)}
.face.a{background:var(--sf);border:1px solid var(--ln)}.face.b{background:var(--grad);color:#fff;transform:rotateY(180deg)}.face .q{font-size:27px;font-weight:850;line-height:1.5}.face small{position:absolute;top:22px;font-size:12px;font-weight:800;opacity:.6}
.face .hint{position:absolute;bottom:22px;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mu);font-weight:700}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 18px 0}.ans .btn{padding:17px}
</style>
<section class="scr on" id="s-home">
<div class="top"><div class="ttl"><small>واصل التعلّم 🚀</small><h1>مجموعاتي</h1></div><button class="icb pr" onclick="openDeck()"><i data-i="plus"></i></button></div>
<div class="stats" id="sts" style="margin-bottom:6px"></div>
<div class="sec"><h3>المجموعات</h3></div><div class="wrap" id="dks"></div>
</section>
<section class="scr" id="s-study">
<div class="top"><button class="icb pr" onclick="tabs('home')"><i data-i="prev"></i></button><div class="ttl"><small id="sdn"></small><h1 style="font-size:20px" id="sct"></h1></div><button class="icb pr" onclick="openCard()"><i data-i="plus"></i></button></div>
<div class="wrap"><div class="bar"><i id="sb" style="width:0"></i></div></div>
<div class="stage" onclick="flip()"><div class="fc" id="fc"><div class="face a"><small>السؤال</small><div class="q" id="fq"></div><div class="hint"><i data-i="flip"></i>اضغط لقلب البطاقة</div></div><div class="face b"><small>الإجابة</small><div class="q" id="fa"></div></div></div></div>
<div class="ans"><button class="btn dg" onclick="rate(0)"><i data-i="x"></i>ما عرفتها</button><button class="btn" onclick="rate(1)"><i data-i="check"></i>عرفتها</button></div>
</section>
<nav class="tabbar"><button class="on" data-t="home" onclick="tabs('home')"><i data-i="layers"></i>المجموعات</button><button data-t="study" onclick="study(DI)"><i data-i="book"></i>مذاكرة</button></nav>
<div class="ov" id="o-c"><div class="sheet"><div class="grab"></div><h2>بطاقة جديدة</h2><label class="fld"><span>السؤال</span><input class="in" id="cq"></label><label class="fld"><span>الإجابة</span><input class="in" id="ca"></label><button class="btn bl" onclick="addCard()"><i data-i="plus"></i>إضافة</button></div></div>
<div class="ov" id="o-d"><div class="sheet"><div class="grab"></div><h2>مجموعة جديدة</h2><label class="fld"><span>الاسم</span><input class="in" id="dn" placeholder="مثلاً: مفردات إنجليزية"></label><button class="btn bl" onclick="addDeck()"><i data-i="plus"></i>إنشاء</button></div></div>
<script>
var GR=['linear-gradient(135deg,#0ea5e9,#6366f1)','linear-gradient(135deg,#f97316,#ec4899)','linear-gradient(135deg,#10b981,#0ea5e9)','linear-gradient(135deg,#8b5cf6,#d946ef)'],EM=['🌍','🧪','🗣','📐'];
var DK=DB.get('pk_cards',null),DI=0,ci=0,fl=false,ok=0,seen=0;
if(!DK){DK=[{n:'جغرافيا',c:[['عاصمة السودان؟','الخرطوم'],['أطول نهر في العالم؟','نهر النيل'],['أكبر قارة؟','آسيا'],['عاصمة اليابان؟','طوكيو']],k:{0:1,1:1}},{n:'علوم',c:[['رمز الماء الكيميائي؟','H₂O'],['أقرب كوكب للشمس؟','عطارد'],['سرعة الضوء تقريباً؟','300 ألف كم/ث']],k:{0:1}},{n:'إنجليزي',c:[['Success','نجاح'],['Knowledge','معرفة'],['Patience','صبر']],k:{}}];DB.set('pk_cards',DK)}
function save(){DB.set('pk_cards',DK)}
function home(){var tc=0,tk=0;DK.forEach(function(d){tc+=d.c.length;tk+=Object.keys(d.k).length});$('sts').innerHTML='<div class="stat"><small>مجموعات</small><b>'+DK.length+'</b></div><div class="stat"><small>بطاقات</small><b>'+tc+'</b></div><div class="stat"><small>متقنة</small><b>'+tk+'</b></div>';
$('dks').innerHTML=DK.map(function(d,i){var p=d.c.length?Object.keys(d.k).length/d.c.length:0;return '<div class="dk pr" style="background:'+GR[i%4]+'" onclick="study('+i+')"><span class="pill">'+d.c.length+' بطاقة</span><h3 style="margin-top:10px">'+E(d.n)+'</h3><small style="opacity:.9;font-weight:700">إتقان '+Math.round(p*100)+'%</small><div class="bar" style="width:62%"><i style="width:'+p*100+'%"></i></div><span class="e">'+EM[i%4]+'</span></div>'}).join('');stagger($('dks'))}
function study(i){DI=i||0;ci=0;fl=false;ok=0;seen=0;tabs('study');card()}
function card(){var d=DK[DI];$('sdn').textContent=d.n;$('fc').classList.toggle('f',fl);if(!d.c.length){$('fq').textContent='أضف أول بطاقة ➕';$('fa').textContent='';$('sct').textContent='فاضية';return}
var c=d.c[ci];$('fq').textContent=c[0];setTimeout(function(){$('fa').textContent=c[1]},fl?0:250);$('sct').textContent='بطاقة '+(ci+1)+' من '+d.c.length;$('sb').style.width=(seen/d.c.length*100)+'%'}
function flip(){if(!DK[DI].c.length)return;fl=!fl;vib();card()}
function rate(r){var d=DK[DI];if(!d.c.length)return;if(r){d.k[ci]=1;ok++}else delete d.k[ci];seen++;save();if(seen>=d.c.length){toast('خلصت الجلسة: عرفت '+ok+' من '+d.c.length+' 🎉');seen=0;ok=0}fl=false;ci=(ci+1)%d.c.length;card()}
function openCard(){$('cq').value='';$('ca').value='';openS('o-c')}
function addCard(){var q=$('cq').value.trim(),a=$('ca').value.trim();if(!q||!a){toast('اكتب السؤال والإجابة');return}DK[DI].c.push([q,a]);save();closeS();ci=DK[DI].c.length-1;fl=false;card();toast('تمت إضافة البطاقة')}
function openDeck(){$('dn').value='';openS('o-d')}
function addDeck(){var n=$('dn').value.trim();if(!n)return;DK.push({n:n,c:[],k:{}});save();closeS();home();toast('تم إنشاء المجموعة')}
window.onTab=function(t){if(t=='home')home()};
home();
</script>

<style>
.dc{display:flex;gap:13px;padding:14px;background:var(--sf);border:1px solid var(--ln);border-radius:24px;margin-bottom:12px;box-shadow:var(--sh1)}
.dc .ph{width:86px;height:86px;border-radius:22px;display:grid;place-items:center;font-size:44px;flex:none;background:var(--grad);box-shadow:0 10px 20px var(--glow)}
.dc h4{font-size:15.5px;font-weight:850}.dc .rt{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--mu);margin:3px 0 8px}.dc .rt svg.i{width:14px;height:14px;color:#f59e0b;fill:#f59e0b}
.nx{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--ok)}.nx svg.i{width:14px;height:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 16px}.slots button{padding:12px 4px;border-radius:14px;background:var(--sf2);border:1.5px solid var(--ln);font-weight:800;font-size:14px}.slots button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px var(--glow)}.slots button:disabled{opacity:.35;text-decoration:line-through}
.up{display:flex;align-items:center;gap:14px}.up .dt{width:64px;padding:8px 0;border-radius:18px;background:rgba(255,255,255,.2);text-align:center;line-height:1.3}.up .dt b{display:block;font-size:24px}
.sp3{display:flex;gap:10px;overflow-x:auto;padding:2px 18px 6px;scrollbar-width:none}.sp3 button{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:18px;background:var(--sf);border:1px solid var(--ln);font-weight:750;font-size:13.5px;color:var(--mu)}.sp3 button.on{background:var(--tx);color:var(--bg)}
</style>
<section class="scr on" id="s-home">
<div class="top"><div class="ttl"><small>وين بتلعب الليلة؟ ⚽</small><h1>احجز مكانك</h1></div><button class="icb pr" onclick="tabs('ap')"><i data-i="calendar"></i></button></div>
<div id="nxt"></div>
<div class="search"><i data-i="search"></i><input id="q" placeholder="ابحث عن ملعب أو قاعة" oninput="draw()"></div>
<div class="sec"><h3>الأنواع</h3></div><div class="sp3" id="sps"></div>
<div class="sec"><h3>أماكن متاحة</h3></div><div class="wrap" id="dl"></div>
</section>
<section class="scr" id="s-ap"><div class="top"><div class="ttl"><small>حجوزاتك القادمة والسابقة</small><h1>حجوزاتي</h1></div></div><div class="wrap" id="al"></div></section>
<nav class="tabbar"><button class="on" data-t="home" onclick="tabs('home')"><i data-i="home"></i>الأماكن</button><button data-t="ap" onclick="tabs('ap')"><i data-i="calendar"></i>حجوزاتي</button></nav>
<div class="ov" id="o-b"><div class="sheet" id="bs"></div></div>
<script>
var SPS=[['الكل','🏟'],['كرة قدم','⚽'],['تنس','🎾'],['سباحة','🏊'],['قاعات','🏛']];
var DR=[{id:'d1',n:'ملعب النجوم الخماسي',s:'كرة قدم',e:'⚽',r:4.8,f:300,x:'نجيل صناعي • إضاءة'},{id:'d2',n:'ملعب الأبطال',s:'كرة قدم',e:'🥅',r:4.6,f:250,x:'سباعي • مدرجات'},{id:'d3',n:'نادي التنس الملكي',s:'تنس',e:'🎾',r:4.9,f:200,x:'ملعبين • مدرب'},{id:'d4',n:'مسبح الواحة',s:'سباحة',e:'🏊',r:4.7,f:400,x:'مسبح خاص مدفأ'},{id:'d5',n:'قاعة الفرح الكبرى',s:'قاعات',e:'🏛',r:4.8,f:1500,x:'تسع 300 شخص'}];
var TS=['16:00','17:00','18:00','19:00','20:00','21:00','22:00','23:00','00:00'],ST=['بانتظار التأكيد','مؤكد','مكتمل','ملغي'],SC=['warn','','ok','bad'];
var SP='الكل',ME=DB.get('pk2_bk_me',{}),bd=null,bdate=null,bt=null;
function A(){return DB.get('pk2_bk_appts',[])}
function draw(){$('sps').innerHTML=SPS.map(function(s){return '<button class="pr '+(s[0]==SP?'on':'')+'" onclick="SP=\''+s[0]+'\';draw()">'+s[1]+' '+s[0]+'</button>'}).join('');var q=$('q').value.trim();
$('dl').innerHTML=DR.filter(function(d){return (SP=='الكل'||d.s==SP)&&(!q||(d.n+d.s).indexOf(q)>-1)}).map(function(d){return '<div class="dc pr" onclick="book(\''+d.id+'\')"><div class="ph">'+d.e+'</div><div class="sp"><h4>'+d.n+'</h4><div class="rt">'+d.s+' • '+d.x+'</div><div class="rt">'+I('star')+d.r+' <span>(150+ حجز)</span></div><div class="row"><span class="nx">'+I('clock')+'متاح الليلة</span><span class="sp"></span><b>'+d.f+' <small class="mu">ج/ساعة</small></b></div></div></div>'}).join('')||'<div class="empty"><div class="ill">🔍</div><b>ما لقينا أطباء</b></div>';stagger($('dl'));next()}
function next(){var my=A().filter(function(a){return a.ph==ME.p&&a.st<2}).sort(function(a,b){return a.ts-b.ts})[0];if(!my){$('nxt').innerHTML='';return}var d=new Date(my.ts);
$('nxt').innerHTML='<div class="hero" style="margin-bottom:10px"><div class="up"><div class="dt"><b>'+d.getDate()+'</b><small>'+MONTHS[d.getMonth()]+'</small></div><div class="sp"><small>حجزك القادم</small><div style="font-size:18px;font-weight:850">'+E(my.dn)+'</div><span class="pill">'+I('clock')+DAYS[d.getDay()]+' • '+my.t+'</span></div></div></div>';icons($('nxt'))}
function book(id){bd=DR.find(function(d){return d.id==id});bdate=dkey();bt=null;sheet();openS('o-b')}
function taken(){return A().filter(function(a){return a.di==bd.id&&a.dk==bdate&&a.st!=3}).map(function(a){return a.t})}
function sheet(){var tk=taken(),ds='';for(var i=0;i<10;i++){var d=new Date(Date.now()+i*864e5),k=dkey(d);ds+='<button class="pr '+(k==bdate?'on':'')+'" onclick="bdate=\''+k+'\';bt=null;sheet()"><small>'+SDAYS[d.getDay()]+'</small><b>'+d.getDate()+'</b></button>'}
$('bs').innerHTML='<div class="grab"></div><div class="row" style="margin-bottom:16px"><div class="av g" style="width:58px;height:58px;font-size:30px">'+bd.e+'</div><div class="sp"><h2 style="margin:0">'+bd.n+'</h2><small class="mu">'+bd.s+' • السعر للساعة '+bd.f+' ج</small></div></div><b>اختر اليوم</b><div class="dstrip" style="padding:10px 0">'+ds+'</div><b>المواعيد المتاحة</b><div class="slots">'+TS.map(function(t){return '<button '+(tk.indexOf(t)>-1?'disabled':'')+' class="'+(t==bt?'on':'')+'" onclick="bt=\''+t+'\';sheet()">'+t+'</button>'}).join('')+'</div><div class="row"><label class="fld sp"><span>الاسم</span><input class="in" id="pn" value="'+E(ME.n||'')+'"></label><label class="fld sp"><span>الجوال</span><input class="in" id="pp" type="tel" inputmode="tel" value="'+E(ME.p||'')+'"></label></div><button class="btn bl" onclick="confirmB()">'+I('check')+'تأكيد الحجز</button>'}
function confirmB(){var n=$('pn').value.trim(),p=$('pp').value.replace(/\D/g,'');if(!bt){toast('اختر وقت الحجز');return}if(!n||p.length<9){toast('اكتب الاسم ورقم الجوال');return}ME={n:n,p:p};DB.set('pk2_bk_me',ME);
var pr=bdate.split('-'),hm=bt.split(':'),ts=new Date(+pr[0],+pr[1]-1,+pr[2],+hm[0],+hm[1]).getTime(),L=A();L.push({id:uid(),di:bd.id,dn:bd.n,ds:bd.s,de:bd.e,f:bd.f,dk:bdate,t:bt,ts:ts,pn:n,ph:p,st:0,d:Date.now()});DB.set('pk2_bk_appts',L);closeS();toast('تم إرسال طلب الحجز ✔');draw()}
function appts(){var L=A().filter(function(a){return a.ph==ME.p}).sort(function(a,b){return b.ts-a.ts});
$('al').innerHTML=L.map(function(a){var d=new Date(a.ts);return '<div class="li"><div class="av">'+a.de+'</div><div class="bd"><b>'+E(a.dn)+'</b><small>'+DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' • '+a.t+'</small></div><div style="text-align:left"><span class="badge '+SC[a.st]+'">'+ST[a.st]+'</span>'+(a.st<2?'<button class="btn dg sm" style="margin-top:6px;padding:6px 10px" onclick="cancelA(\''+a.id+'\')">إلغاء</button>':'')+'</div></div>'}).join('')||'<div class="empty"><div class="ill">📅</div><b>ما عندك حجوزات</b>احجز ملعبك أو قاعتك في ثواني<br><button class="btn" onclick="tabs(\'home\')">'+I('home')+'احجز الآن</button></div>';stagger($('al'))}
function cancelA(id){var L=A(),a=L.find(function(x){return x.id==id});a.st=3;DB.set('pk2_bk_appts',L);appts();toast('تم إلغاء الحجز')}
window.onTab=function(t){if(t=='ap')appts();else draw()};
draw();
</script>

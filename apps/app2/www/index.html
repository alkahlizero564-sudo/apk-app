<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src * data: blob:;">
<meta name="theme-color" content="#0E6E8C">
<title>دفعتنا</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#0E6E8C;--teal:#12A5A0;--bg:#EDF6F8;--card:#fff;--ink:#10303B;--muted:#68828C;--line:#D3E4E9;--red:#C62F2F;--amber:#F5B83D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Tajawal","Noto Naskh Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px;padding-top:env(safe-area-inset-top,0px)}
button,input{font-family:inherit;font-size:16px}
[hidden]{display:none!important}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.net{display:none;background:var(--red);color:#fff;text-align:center;padding:8px;font-weight:700;font-size:14px}.net.show{display:block}
.top{background:linear-gradient(160deg,var(--deep),var(--teal));color:#fff;padding:16px 16px 18px;border-radius:0 0 24px 24px;display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.top h1{margin:0;font-size:20px;font-weight:800}.top p{margin:0;font-size:13px;color:#D6F3F1}.sp{flex:1}
.ic{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:8px 10px;font-weight:700;font-size:14px}
.ic.on{background:var(--amber);color:var(--ink)}
main{flex:1;padding:16px 16px 110px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:20px}.hint{margin:0 0 12px;color:var(--muted);font-size:14px}
label{display:block;font-weight:700;margin:10px 0 6px}
input[type=text],input[type=tel]{width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
input:focus-visible{border-color:var(--teal)}
.majors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.majors button{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;color:var(--muted)}
.majors button.on{border-color:var(--teal);background:#DDF4F2;color:var(--deep)}
.btn{width:100%;padding:15px;border:0;border-radius:14px;margin-top:14px;background:var(--teal);color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 #0C7F7B}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0C7F7B}.btn:disabled{background:#B7CBD0;box-shadow:none}
.err{color:var(--red);font-weight:700;min-height:1.4em;margin:8px 0 0}
.post.new{border-color:var(--teal);box-shadow:0 0 0 3px #DDF4F2}
.post .ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.post b{font-size:17px}
.post .when{color:var(--deep);font-weight:700;font-size:14px}
.post p{margin:6px 0;white-space:pre-wrap}.post .pm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:13px}
.tag{background:#DDF4F2;color:var(--deep);padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px}
.dot{background:var(--teal);color:#fff;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

.atts{display:grid;gap:10px;margin:10px 0}
.att{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.att img,.att video{display:block;width:100%;max-height:340px;object-fit:cover;background:#000}
.att img{cursor:zoom-in}
.att .ab{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px}
.att .nm{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dlb{border:0;background:var(--teal);color:#fff;border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px;flex:none}
.dlb:disabled{opacity:.6}
.fileRow{display:flex;align-items:center;gap:10px;padding:10px}
.fileRow .fi{font-size:28px}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:12px}
#viewer img{max-width:100%;max-height:78vh;object-fit:contain}
#viewer .vb{display:flex;gap:10px}
#viewer button{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:#fff;color:var(--ink)}
#viewer button.dlb{background:var(--teal);color:#fff;font-size:16px}

.tabs{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:560px;background:var(--card);border-top:1.5px solid var(--line);display:none;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
.tabs.show{display:grid}
.tabs button{border:0;background:transparent;padding:8px 2px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);position:relative}
.tabs button span{display:block;font-size:20px;line-height:1.2}.tabs button.on{background:#DDF4F2;color:var(--deep)}
.tabs .bd{position:absolute;top:2px;left:50%;margin-left:8px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;margin:0 auto;max-width:500px;background:var(--deep);color:#fff;border-right:6px solid var(--amber);padding:14px 18px;border-radius:14px;font-weight:700;transform:translateY(-150%);transition:transform .3s;z-index:40;text-align:center}
.toast.show{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
<div class="net" id="net">لا يوجد اتصال بالإنترنت.</div>
<header class="top">
  <div class="logo">🎓</div>
  <div><h1>دفعتنا</h1><p id="sub">سجّل للدخول</p></div>
  <div class="sp"></div>
  <button class="ic" id="bell" hidden>🔔</button>
  <button class="ic" id="out" hidden>خروج</button>
</header>
<main>
  <section id="sc-reg" class="screen">
    <div class="card">
      <h2>أهلاً بيك</h2><p class="hint">سجّل بالاسم والرقم واختر تخصصك.</p>
      <label for="name">الاسم</label><input id="name" type="text" autocomplete="name" placeholder="اكتب اسمك">
      <label for="phone">رقم الهاتف</label><input id="phone" type="tel" inputmode="tel" dir="ltr" style="text-align:right" placeholder="مثال: 0912345678">
      <label>التخصص</label>
      <div class="majors" id="majors">
        <button data-m="mechanics">ميكانيكا</button><button data-m="manufacturing">تصنيع</button>
        <button data-m="electrical">كهرباء</button><button data-m="civil">مدنية</button>
      </div>
      <p class="err" id="regErr"></p>
      <button class="btn" id="regBtn">دخول</button>
    </div>
  </section>
  <section id="sc-home" class="screen"><div id="list"></div></section>
</main>
<nav class="tabs" id="tabs"></nav>
</div>

<div id="viewer" hidden>
  <img id="vImg" alt="">
  <div class="vb"><button class="dlb" id="vDl">⬇ تحميل</button><button id="vClose">إغلاق</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== غيّر هذه القيم ===== */
const SUPABASE_URL="https://qlvmxnoewxzykgbneadv.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsdm14bm9ld3h6eWtnYm5lYWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDAwMjIsImV4cCI6MjEwNzIxNjAyMn0.WtsiO0PrUrwxKjpcyB3949kXSZeijtlJYySSbh0ieRk";
/* ========================== */
const POLL_MS=8000,TIMEOUT_MS=15000,BUCKET="attachments",GALLERY_MAX=20*1048576;
const CATS={news:["الأخبار","📰"],schedule:["الجدول","🗓️"],lectures:["المحاضرات","🎓"],events:["الفعاليات","🎉"]};
const MAJ={mechanics:"ميكانيكا",manufacturing:"تصنيع",electrical:"كهرباء",civil:"مدنية"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("ar");
const fsize=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const fileUrl=p=>SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+p.split("/").map(encodeURIComponent).join("/");
const isImg=t=>(t||"").startsWith("image/"),isVid=t=>(t||"").startsWith("video/");
function icon(n){const e=(n.split(".").pop()||"").toLowerCase();return e==="pdf"?"📕":/^docx?$/.test(e)?"📘":/^xlsx?$/.test(e)?"📗":/^pptx?$/.test(e)?"📙":/^(zip|rar)$/.test(e)?"🗜️":"📎"}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let me=store.get("stu",null),seen=store.get("seen",{}),notifOn=store.get("s_notif",true);
let all=[],known=null,cur="news",prevSeen="",timer=null,major="",lastSig="";

function net(){$("net").classList.toggle("show",navigator.onLine===false)}
addEventListener("offline",net);addEventListener("online",()=>{net();if(me)load()});
async function api(path,{method="GET",body,prefer}={}){
  if(navigator.onLine===false)throw new Error("offline");
  const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT_MS);
  try{
    const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{method,signal:c.signal,headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json",...(prefer?{Prefer:prefer}:{})},body:body?JSON.stringify(body):undefined});
    const x=await r.text();if(!r.ok)throw new Error(x||r.status);return x?JSON.parse(x):null;
  }finally{clearTimeout(t)}
}

/* ---- تنبيهات ---- */
let ac=null;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch{}}
function beep(){if(!ac)return;try{[0,.25].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=i?988:740;g.gain.value=.12;o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2)})}catch{}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),4500)}
function notify(title,body){
  if(!notifOn)return;toast(title+(body?": "+body:""));beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch{}
  try{if("Notification"in window&&Notification.permission==="granted")new Notification(title,{body})}catch{}
}
function bell(){$("bell").classList.toggle("on",notifOn);$("bell").textContent=notifOn?"🔔":"🔕"}
$("bell").onclick=()=>{
  ensureAudio();notifOn=!notifOn;store.set("s_notif",notifOn);bell();
  if(notifOn){try{if("Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch{}toast("تم تفعيل الإشعارات")}else toast("تم إيقاف الإشعارات");
};

/* ---- التسجيل ---- */
$("majors").onclick=e=>{const m=e.target.closest("button")?.dataset.m;if(!m)return;major=m;document.querySelectorAll("#majors button").forEach(b=>b.classList.toggle("on",b.dataset.m===m))};
$("regBtn").onclick=async()=>{
  ensureAudio();
  const name=$("name").value.trim(),phone=$("phone").value.replace(/\s+/g,""),err=$("regErr");err.textContent="";
  if(name.length<2){err.textContent="اكتب اسمك كاملاً.";return}
  if(!/^\+?\d{9,15}$/.test(phone)){err.textContent="رقم الهاتف غير صحيح.";return}
  if(!major){err.textContent="اختر تخصصك.";return}
  const b=$("regBtn");b.disabled=true;b.textContent="جارٍ الدخول...";
  try{
    const out=await api("students?on_conflict=phone",{method:"POST",body:{name,phone,major},prefer:"resolution=merge-duplicates,return=representation"});
    me=out[0];store.set("stu",me);
    try{if(notifOn&&"Notification"in window&&Notification.permission==="default")Notification.requestPermission()}catch{}
    start();
  }catch(e){err.textContent=navigator.onLine===false?"لا يوجد إنترنت.":"تعذّر الدخول. تأكد من الإنترنت وإعدادات Supabase."}
  finally{b.disabled=false;b.textContent="دخول"}
};
$("out").onclick=()=>{clearInterval(timer);me=null;known=null;all=[];seen={};lastSig="";store.set("stu",null);store.set("seen",{});show("reg")};

/* ---- الواجهة ---- */
$("tabs").innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-s="${k}"><span>${v[1]}</span>${v[0]}<b class="bd" hidden></b></button>`).join("");
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)openCat(b.dataset.s)};
function show(w){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id==="sc-"+w));
  const home=w==="home";$("tabs").classList.toggle("show",home);$("bell").hidden=!home;$("out").hidden=!home;
  $("sub").textContent=home?(me.name+" - "+MAJ[me.major]):"سجّل للدخول";
}
function openCat(c){
  cur=c;prevSeen=seen[c]||"";
  const a=all.filter(p=>p.category===c);
  if(a.length&&a[0].created_at>prevSeen){seen[c]=a[0].created_at;store.set("seen",seen)}
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.s===c));
  render();badges();
}
function ago(i){const m=Math.max(0,Math.round((Date.now()-new Date(i))/60000));if(m<1)return"الآن";if(m<60)return"قبل "+fmt(m)+" دقيقة";const h=Math.floor(m/60);if(h<24)return"قبل "+fmt(h)+" ساعة";return new Date(i).toLocaleDateString("ar",{day:"numeric",month:"short"})}

function attsHtml(p){
  const at=Array.isArray(p.attachments)?p.attachments:[];
  if(!at.length)return"";
  return '<div class="atts">'+at.map((a,i)=>{
    const key=esc(p.id)+":"+i,url=esc(fileUrl(a.path)),t=a.type||"";
    const bar=`<div class="ab"><span class="nm">${esc(a.name)} · ${esc(fsize(a.size))}</span><button class="dlb" data-dl="${key}">⬇ تحميل</button></div>`;
    if(isImg(t))return `<div class="att"><img loading="lazy" src="${url}" alt="${esc(a.name)}" data-view="${key}">${bar}</div>`;
    if(isVid(t))return `<div class="att"><video controls preload="metadata" playsinline src="${url}"></video>${bar}</div>`;
    return `<div class="att"><div class="fileRow"><span class="fi">${icon(a.name)}</span><span class="nm" style="flex:1">${esc(a.name)}<br><small>${esc(fsize(a.size))}</small></span><button class="dlb" data-dl="${key}">⬇ تحميل</button></div></div>`;
  }).join("")+"</div>";
}
function render(){
  const a=all.filter(p=>p.category===cur);
  $("list").innerHTML=a.length?a.map(p=>{const nw=p.created_at>prevSeen;return `<div class="card post ${nw?"new":""}">
  <div class="ph"><b>${esc(p.title)}</b>${nw?'<span class="dot">جديد</span>':""}</div>
  ${p.when_text?`<div class="when">🕒 ${esc(p.when_text)}</div>`:""}${p.body?`<p>${esc(p.body)}</p>`:""}
  ${attsHtml(p)}
  <div class="pm"><span class="tag">${p.target==="all"?"للجميع":esc(MAJ[p.target]||"")}</span><span>${esc(ago(p.created_at))}</span></div></div>`}).join(""):'<div class="empty">لا يوجد شيء هنا بعد.</div>';
}
function badges(){
  document.querySelectorAll("#tabs button").forEach(b=>{
    const k=b.dataset.s,n=k===cur?0:all.filter(p=>p.category===k&&p.created_at>(seen[k]||"")).length;
    const bd=b.querySelector(".bd");bd.hidden=!n;bd.textContent=fmt(n);
  });
}

/* ---- المرفقات: عرض وتحميل ---- */
function findAtt(key){const [pid,i]=key.split(":");const p=all.find(x=>x.id===pid);return p&&Array.isArray(p.attachments)?p.attachments[Number(i)]:null}
/* حفظ مباشر في المعرض (يعمل إذا كانت إضافتا Capacitor: Filesystem و Media مثبتتين في الـ APK) */
async function saveToGallery(a,url){
  const P=(window.Capacitor&&window.Capacitor.Plugins)||{};
  const t=a.type||"";
  if(!P.Filesystem||!P.Media||!(isImg(t)||isVid(t))||a.size>GALLERY_MAX)return false;
  const blob=await (await fetch(url)).blob();
  const data=await new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(String(f.result).split(",")[1]);f.onerror=rej;f.readAsDataURL(blob)});
  const nm=Date.now()+"-"+a.name.replace(/[^\w.\-]/g,"_");
  const w=await P.Filesystem.writeFile({path:nm,data,directory:"CACHE"});
  if(isImg(t))await P.Media.savePhoto({path:w.uri});else await P.Media.saveVideo({path:w.uri});
  return true;
}
async function download(key,btn){
  const a=findAtt(key);if(!a)return;
  const url=fileUrl(a.path),old=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="جارٍ التحميل..."}
  let ok=false;
  try{ok=await saveToGallery(a,url)}catch{ok=false}
  if(btn){btn.disabled=false;btn.textContent=old}
  if(ok){toast("تم الحفظ في المعرض ✅");return}
  const l=document.createElement("a");
  l.href=url+"?download="+encodeURIComponent(a.name);l.target="_blank";l.rel="noopener";l.download=a.name;
  document.body.appendChild(l);l.click();l.remove();
  toast("بدأ التحميل. ستجده في التنزيلات"+((isImg(a.type)||isVid(a.type))?" وفي المعرض":""));
}
function openViewer(key){
  const a=findAtt(key);if(!a)return;
  $("vImg").src=fileUrl(a.path);$("vDl").dataset.dl=key;$("viewer").hidden=false;
}
$("vClose").onclick=()=>{$("viewer").hidden=true;$("vImg").src=""};
$("vDl").onclick=e=>download(e.currentTarget.dataset.dl,e.currentTarget);
$("list").onclick=e=>{
  const d=e.target.closest("[data-dl]");if(d){download(d.dataset.dl,d);return}
  const v=e.target.closest("[data-view]");if(v)openViewer(v.dataset.view);
};

/* ---- التحديث ---- */
async function load(){
  try{
    const list=await api("posts?select=*&target=in.(all,"+me.major+")&order=created_at.desc&limit=300");
    if(known===null){
      for(const k in CATS){if(!seen[k]){const f=list.find(p=>p.category===k);if(f)seen[k]=f.created_at}}
      store.set("seen",seen);
    }else{
      const fresh=list.filter(p=>!known.has(p.id));
      if(fresh.length)notify(CATS[fresh[0].category][0],fresh[0].title+(fresh.length>1?" (+"+fmt(fresh.length-1)+")":""));
    }
    known=new Set(list.map(p=>p.id));all=list;
    const sig=list.map(p=>p.id).join(",");
    if(sig!==lastSig){lastSig=sig;render()}
    badges();
  }catch{}
}
function start(){show("home");bell();known=null;lastSig="";openCat(cur);clearInterval(timer);load();timer=setInterval(load,POLL_MS)}

net();
if(me)start();else show("reg");
</script>
</body>
</html>

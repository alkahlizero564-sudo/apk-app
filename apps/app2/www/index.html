<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src * data: blob:;">
<meta name="theme-color" content="#14213D">
<title>إدارة العيش</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2314213D'/%3E%3Cpath d='M12 38c0-10 8-18 20-18s20 8 20 18c0 3-2 5-5 5H17c-3 0-5-2-5-5z' fill='%23F2A33A'/%3E%3Cpath d='M23 27l4 7M33 25l4 8M43 28l3 6' stroke='%2314213D' stroke-width='3' stroke-linecap='round'/%3E%3Crect x='14' y='44' width='36' height='5' rx='2.5' fill='%23F2A33A'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213D;
    --navy2: #1F3358;
    --amber: #F2A33A;
    --bg: #EEF1F6;
    --card: #FFFFFF;
    --text: #14213D;
    --muted: #6B7A90;
    --line: #DCE2EC;
    --ok: #2E8B57;
    --warn: #C0392B;
    --blue: #2563EB;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Tajawal", "Noto Naskh Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6;
    padding-top: env(safe-area-inset-top, 0px);
  }
  button, input { font-family: inherit; font-size: inherit; }
  [hidden] { display: none !important; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  .net-banner { display: none; background: var(--warn); color: #fff; text-align: center; padding: 8px 12px; font-weight: 700; font-size: 14px; }
  .net-banner.show { display: block; }

  /* ---------- PIN ---------- */
  #pinScreen { flex: 1; background: linear-gradient(170deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  #pinScreen .logo { width: 84px; height: 84px; margin-bottom: 14px; }
  #pinScreen h1 { margin: 0 0 4px; font-size: 26px; font-weight: 800; }
  #pinScreen p { margin: 0 0 22px; color: #B9C6DC; }
  .dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 10px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--amber); }
  .dots i.on { background: var(--amber); }
  .dots.shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .pin-err { min-height: 1.6em; color: #FFB4A8; font-weight: 700; margin-bottom: 14px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; direction: ltr; }
  .keypad button { height: 66px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: #fff; font-size: 26px; font-weight: 700; cursor: pointer; }
  .keypad button:active { background: var(--amber); color: var(--navy); }
  .keypad .ghost { background: transparent; }

  /* ---------- الهيكل ---------- */
  .top { background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%); color: #fff; padding: 18px 18px 20px; border-radius: 0 0 24px 24px; display: flex; align-items: center; gap: 12px; }
  .top .logo { width: 44px; height: 44px; flex: none; }
  .top h1 { margin: 0; font-size: 21px; font-weight: 800; }
  .top p { margin: 0; font-size: 13px; color: #B9C6DC; }
  .live { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #B9C6DC; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: #5BD18A; }
  .live.off i { background: #F28B7D; }

  main { flex: 1; padding: 16px 16px 110px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .pills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; background: #DDE3EE; padding: 5px; border-radius: 14px; }
  .pills button { border: 0; background: transparent; padding: 10px; border-radius: 10px; font-weight: 800; color: var(--muted); cursor: pointer; }
  .pills button.on { background: var(--card); color: var(--navy); box-shadow: 0 1px 4px rgba(20,33,61,.15); }
  .cnt { display: inline-block; min-width: 24px; padding: 0 7px; margin-inline-start: 6px; border-radius: 999px; background: var(--amber); color: var(--navy); font-size: 13px; }

  .order .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .order .name { font-weight: 800; font-size: 18px; }
  .order .amt { font-weight: 800; font-size: 20px; color: var(--navy); }
  .order .amt small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .order .meta { color: var(--muted); font-size: 14px; margin: 4px 0 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .order .meta a { color: var(--blue); font-weight: 700; text-decoration: none; }
  .tag { padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
  .tag.cash { background: #DDF0E2; color: var(--ok); }
  .tag.credit { background: #FDE9C9; color: #9A5B00; }

  .btn { width: 100%; padding: 14px; border: 0; border-radius: 14px; font-weight: 800; font-size: 17px; cursor: pointer; color: #fff; background: var(--navy); }
  .btn.amber { background: var(--amber); color: var(--navy); }
  .btn.ok { background: var(--ok); }
  .btn.warn { background: var(--warn); }
  .btn.light { background: #E3E9F3; color: var(--navy); }
  .btn:active { opacity: .85; }
  .btn:disabled { background: #C9D1DF; color: #8591A6; cursor: not-allowed; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  /* ---------- التقارير ---------- */
  .range { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .range button { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--navy); }
  .range button:disabled { opacity: .35; }
  .range .label { flex: 1; text-align: center; font-weight: 800; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .stat.big { grid-column: 1 / -1; background: var(--navy); color: #fff; border-color: var(--navy); }
  .stat span { display: block; font-size: 13px; color: var(--muted); }
  .stat.big span { color: #B9C6DC; }
  .stat b { font-size: 24px; font-weight: 800; }
  .stat.big b { font-size: 30px; color: var(--amber); }
  .stat b small { font-size: 13px; font-weight: 500; }
  .day { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .day:last-child { border-bottom: 0; }
  .bar { height: 10px; background: #E3E9F3; border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber); border-radius: 6px; }
  h3 { margin: 16px 2px 8px; font-size: 16px; }

  /* ---------- الإعدادات ---------- */
  .switch-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch-card h2 { margin: 0; font-size: 18px; }
  .switch-card p { margin: 0; color: var(--muted); font-size: 14px; }
  .state { font-weight: 800; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .state.open { background: #DDF0E2; color: var(--ok); }
  .state.closed { background: #FBE3DD; color: var(--warn); }
  .back { border: 0; background: transparent; color: var(--blue); font-weight: 800; padding: 6px 2px; margin-bottom: 8px; cursor: pointer; }
  input[type=search] { width: 100%; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); margin-bottom: 10px; outline: none; }
  input[type=search]:focus-visible { border-color: var(--amber); }
  .cust { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .cust:last-child { border-bottom: 0; }
  .cust a { color: var(--blue); font-weight: 700; text-decoration: none; direction: ltr; }
  .total-box { text-align: center; padding: 14px; background: var(--navy); color: #fff; border-radius: var(--radius); margin-bottom: 12px; }
  .total-box b { font-size: 30px; color: var(--amber); display: block; }

  /* ---------- الشريط السفلي ---------- */
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 560px; background: var(--card); border-top: 1.5px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 4px; }
  .tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 12px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; position: relative; }
  .tabs button span { display: block; font-size: 20px; line-height: 1.2; }
  .tabs button.on { background: #E8EDF6; color: var(--navy); }
  .tabs .badge { position: absolute; top: 2px; left: 50%; margin-left: 8px; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 12px; }

  .toast { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 14px; right: 14px; margin: 0 auto; max-width: 500px; background: var(--navy); color: #fff; border-right: 6px solid var(--amber); padding: 14px 18px; border-radius: 14px; font-weight: 700; transform: translateY(-150%); transition: transform .3s ease; z-index: 20; text-align: center; }
  .toast.show { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } .dots.shake { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="net-banner" id="netBanner">لا يوجد اتصال بالإنترنت. تأكد من الشبكة.</div>

  <!-- شاشة الرمز السري -->
  <section id="pinScreen">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#F2A33A"/>
      <path d="M10 38c0-11 9-19 22-19s22 8 22 19c0 3-2 5-5 5H15c-3 0-5-2-5-5z" fill="#14213D"/>
      <path d="M22 27l4 8M32 24l4 9M43 28l3 6" stroke="#F2A33A" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="12" y="45" width="40" height="6" rx="3" fill="#14213D"/>
    </svg>
    <h1>إدارة العيش</h1>
    <p>اكتب الرمز السري للدخول</p>
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pin-err" id="pinErr"></div>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" disabled></button><button data-k="0">0</button><button data-k="del" aria-label="حذف">⌫</button>
    </div>
  </section>

  <!-- التطبيق -->
  <div id="shell" hidden style="flex:1;display:flex;flex-direction:column;">
    <header class="top">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="16" fill="#F2A33A"/>
        <path d="M10 38c0-11 9-19 22-19s22 8 22 19c0 3-2 5-5 5H15c-3 0-5-2-5-5z" fill="#14213D"/>
        <path d="M22 27l4 8M32 24l4 9M43 28l3 6" stroke="#F2A33A" stroke-width="3.5" stroke-linecap="round"/>
        <rect x="12" y="45" width="40" height="6" rx="3" fill="#14213D"/>
      </svg>
      <div><h1 id="title">الطلبات</h1><p>لوحة إدارة حجز العيش</p></div>
      <div class="live" id="live"><i></i><span id="liveTxt">مباشر</span></div>
    </header>

    <main>
      <!-- الطلبات -->
      <section id="sc-orders" class="screen">
        <div class="pills" id="orderPills">
          <button data-v="new" class="on">طلبات جديدة<span class="cnt" id="cNew">0</span></button>
          <button data-v="prep">قيد التجهيز<span class="cnt" id="cPrep">0</span></button>
        </div>
        <div id="ordersList"></div>
      </section>

      <!-- التقارير -->
      <section id="sc-reports" class="screen">
        <div class="pills" id="repPills">
          <button data-v="week" class="on">أسبوعي</button>
          <button data-v="month">شهري</button>
        </div>
        <div class="range">
          <button id="repNext" aria-label="الفترة التالية">›</button>
          <div class="label" id="repLabel"></div>
          <button id="repPrev" aria-label="الفترة السابقة">‹</button>
        </div>
        <div id="repBody"><div class="empty">جارٍ التحميل...</div></div>
      </section>

      <!-- الإعدادات -->
      <section id="sc-settings" class="screen">
        <div id="setMain">
          <div class="card switch-card">
            <div>
              <h2>حالة الحجز</h2>
              <p>عند القفل لا يقدر الزبون يحجز.</p>
            </div>
            <span class="state open" id="bookState">مفتوح</span>
          </div>
          <button class="btn warn" id="toggleBooking">قفل الحجز</button>
          <div style="height:12px"></div>
          <button class="btn light" id="openCustomers">التسجيلات (الزبائن المسجلين)</button>
        </div>
        <div id="setCust" hidden>
          <button class="back" id="custBack">› رجوع</button>
          <div class="total-box"><span>عدد المسجلين</span><b id="custCount">0</b></div>
          <input type="search" id="custSearch" placeholder="ابحث بالاسم أو الرقم">
          <div class="card" id="custList"></div>
        </div>
      </section>
    </main>

    <nav class="tabs" id="tabs">
      <button data-s="orders" class="on"><span>🧾</span>الطلبات<b class="badge" id="navBadge" hidden>0</b></button>
      <button data-s="reports"><span>📊</span>التقارير</button>
      <button data-s="settings"><span>⚙️</span>الإعدادات</button>
      <button data-s="lock"><span>🔒</span>قفل</button>
    </nav>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ======== غيّر هذه القيم ======== */
const SUPABASE_URL = "https://qlvmxnoewxzykgbneadv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsdm14bm9ld3h6eWtnYm5lYWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDAwMjIsImV4cCI6MjEwNzIxNjAyMn0.WtsiO0PrUrwxKjpcyB3949kXSZeijtlJYySSbh0ieRk";
const ADMIN_PIN = "1234";   // الرمز السري (4 أرقام)
/* ================================ */

const POLL_MS = 5000;
const TIMEOUT_MS = 15000;
const PAY_LABEL = { cash: "نقدي", credit: "آجل" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("ar");

/* ---------- الإنترنت ---------- */
function updateNet() {
  const off = navigator.onLine === false;
  $("netBanner").classList.toggle("show", off);
  $("live").classList.toggle("off", off);
  $("liveTxt").textContent = off ? "غير متصل" : "مباشر";
}
window.addEventListener("offline", updateNet);
window.addEventListener("online", () => { updateNet(); if (unlocked) tick(); });

async function api(path, { method = "GET", body, prefer } = {}) {
  if (navigator.onLine === false) throw new Error("offline");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      method, signal: ctrl.signal,
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        ...(prefer ? { Prefer: prefer } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const text = await res.text();
    if (!res.ok) throw new Error(text || res.status);
    return text ? JSON.parse(text) : null;
  } finally { clearTimeout(timer); }
}

async function fetchAll(path) {
  let all = [], off = 0;
  for (;;) {
    const part = await api(`${path}&limit=1000&offset=${off}`);
    all = all.concat(part || []);
    if (!part || part.length < 1000) break;
    off += 1000;
    if (off > 20000) break;
  }
  return all;
}

/* ---------- تنبيهات ---------- */
let audioCtx = null;
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch {}
}
function beep() {
  if (!audioCtx) return;
  try {
    [0, 0.28].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = i ? 1046 : 784; g.gain.value = 0.12;
      o.start(audioCtx.currentTime + d); o.stop(audioCtx.currentTime + d + 0.22);
    });
  } catch {}
}
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 4500);
}
function alertAdmin(msg) {
  toast(msg); beep();
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
}

/* ---------- الرمز السري ---------- */
let entered = "", fails = 0, lockedUntil = 0, unlocked = false;
function renderDots() { document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i < entered.length)); }
$("keypad").onclick = (e) => {
  const k = e.target.closest("button")?.dataset.k; if (k === undefined) return;
  ensureAudio();
  if (Date.now() < lockedUntil) { $("pinErr").textContent = "محاولات كثيرة. انتظر " + Math.ceil((lockedUntil - Date.now()) / 1000) + " ثانية."; return; }
  if (k === "del") entered = entered.slice(0, -1);
  else if (entered.length < 4) entered += k;
  $("pinErr").textContent = "";
  renderDots();
  if (entered.length === 4) {
    if (entered === ADMIN_PIN) { fails = 0; entered = ""; renderDots(); unlock(); }
    else {
      fails++; entered = "";
      $("pinErr").textContent = "الرمز غير صحيح";
      const d = $("dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      try { if (navigator.vibrate) navigator.vibrate(200); } catch {}
      if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; $("pinErr").textContent = "تم القفل 30 ثانية بعد محاولات خاطئة."; }
      setTimeout(renderDots, 150);
    }
  }
};

function unlock() {
  unlocked = true;
  $("pinScreen").hidden = true; $("shell").hidden = false;
  firstLoad = true; seen.clear();
  show("orders");
  startPolling();
}
function lock() {
  unlocked = false; clearInterval(pollTimer);
  $("shell").hidden = true; $("pinScreen").hidden = false;
  entered = ""; renderDots(); $("pinErr").textContent = "";
  openCust(false);
}

/* ---------- التنقل ---------- */
const TITLES = { orders: "الطلبات", reports: "التقارير", settings: "الإعدادات" };
function show(name) {
  if (name === "lock") { lock(); return; }
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("active", s.id === "sc-" + name));
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.s === name));
  $("title").textContent = TITLES[name];
  if (name === "reports") loadReport();
  if (name === "settings") { openCust(false); refreshSettings(); }
}
$("tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.s); };

/* ---------- الطلبات ---------- */
let orders = [], ordersView = "new", firstLoad = true, pollTimer = null;
const seen = new Set();

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 1) return "الآن";
  if (m < 60) return "قبل " + fmt(m) + " دقيقة";
  const h = Math.floor(m / 60);
  if (h < 24) return "قبل " + fmt(h) + " ساعة";
  return new Date(iso).toLocaleDateString("ar", { day: "numeric", month: "short" });
}

function orderCard(o) {
  const isNew = o.status === "new";
  return `<div class="card order">
    <div class="row"><span class="name">${esc(o.customer_name)}</span><span class="amt">${esc(fmt(o.amount_sdg))} <small>ج.س</small></span></div>
    <div class="meta">
      <a href="tel:${esc(o.phone)}" dir="ltr">📞 ${esc(o.phone)}</a>
      <span class="tag ${esc(o.payment_type)}">${esc(PAY_LABEL[o.payment_type] || "")}</span>
      <span>${esc(ago(o.created_at))}</span>
    </div>
    <button class="btn ${isNew ? "amber" : "ok"}" data-act="${isNew ? "receive" : "ready"}" data-id="${esc(o.id)}">${isNew ? "استلام الطلب" : "الطلب جاهز"}</button>
  </div>`;
}

function renderOrders() {
  const news = orders.filter((o) => o.status === "new");
  const prep = orders.filter((o) => o.status === "received");
  $("cNew").textContent = fmt(news.length);
  $("cPrep").textContent = fmt(prep.length);
  const nb = $("navBadge"); nb.hidden = news.length === 0; nb.textContent = fmt(news.length);
  const list = ordersView === "new" ? news : prep;
  $("ordersList").innerHTML = list.length
    ? list.map(orderCard).join("")
    : `<div class="empty">${ordersView === "new" ? "لا توجد طلبات جديدة الآن." : "لا توجد طلبات قيد التجهيز."}</div>`;
}

$("orderPills").onclick = (e) => {
  const v = e.target.closest("button")?.dataset.v; if (!v) return;
  ordersView = v;
  document.querySelectorAll("#orderPills button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  renderOrders();
};

$("ordersList").onclick = async (e) => {
  const btn = e.target.closest("button[data-act]"); if (!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  btn.disabled = true; btn.textContent = "جارٍ التنفيذ...";
  const now = new Date().toISOString();
  try {
    if (act === "receive") {
      await api(`orders?id=eq.${encodeURIComponent(id)}&status=eq.new`, { method: "PATCH", body: { status: "received", received_at: now }, prefer: "return=minimal" });
      toast("تم استلام الطلب. الزبون وصله إشعار.");
    } else {
      await api(`orders?id=eq.${encodeURIComponent(id)}&status=eq.received`, { method: "PATCH", body: { status: "ready", ready_at: now }, prefer: "return=minimal" });
      toast("الطلب جاهز. الزبون وصله إشعار.");
    }
  } catch (err) {
    toast(navigator.onLine === false ? "لا يوجد إنترنت. حاول مرة ثانية." : "تعذّر تحديث الطلب. حاول مرة ثانية.");
  }
  loadOrders();
};

async function loadOrders() {
  try {
    const list = await api("orders?status=in.(new,received)&order=created_at.asc&limit=300");
    const news = list.filter((o) => o.status === "new");
    if (!firstLoad) {
      const fresh = news.filter((o) => !seen.has(o.id));
      if (fresh.length) alertAdmin("طلب جديد من " + fresh[0].customer_name + (fresh.length > 1 ? " (+" + fmt(fresh.length - 1) + ")" : ""));
    }
    news.forEach((o) => seen.add(o.id));
    firstLoad = false;
    orders = list;
    renderOrders();
  } catch (e) {}
}

/* ---------- الإعدادات ---------- */
let bookingOpen = true;
function renderBooking() {
  const s = $("bookState");
  s.textContent = bookingOpen ? "مفتوح" : "مقفل";
  s.className = "state " + (bookingOpen ? "open" : "closed");
  const b = $("toggleBooking");
  b.textContent = bookingOpen ? "قفل الحجز" : "فتح الحجز";
  b.className = "btn " + (bookingOpen ? "warn" : "ok");
}
async function refreshSettings() {
  try {
    const s = await api("settings?id=eq.1&select=booking_open");
    if (s && s[0]) bookingOpen = s[0].booking_open !== false;
    renderBooking();
  } catch (e) {}
}
$("toggleBooking").onclick = async () => {
  const b = $("toggleBooking"); b.disabled = true;
  const next = !bookingOpen;
  try {
    await api("settings?id=eq.1", { method: "PATCH", body: { booking_open: next }, prefer: "return=minimal" });
    bookingOpen = next; renderBooking();
    toast(next ? "تم فتح الحجز" : "تم قفل الحجز");
  } catch (e) { toast("تعذّر تغيير حالة الحجز. حاول مرة ثانية."); }
  b.disabled = false;
};

let customers = [];
function openCust(on) { $("setMain").hidden = on; $("setCust").hidden = !on; }
function renderCust() {
  const q = $("custSearch").value.trim().toLowerCase();
  const list = customers.filter((c) => !q || (c.name || "").toLowerCase().includes(q) || (c.phone || "").includes(q));
  $("custList").innerHTML = list.length
    ? list.map((c) => `<div class="cust"><b>${esc(c.name)}</b><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>`).join("")
    : '<div class="empty">لا توجد نتائج.</div>';
}
$("openCustomers").onclick = async () => {
  openCust(true);
  $("custList").innerHTML = '<div class="empty">جارٍ التحميل...</div>';
  try {
    customers = await fetchAll("customers?select=id,name,phone,created_at&order=created_at.desc");
    $("custCount").textContent = fmt(customers.length);
    renderCust();
  } catch (e) { $("custList").innerHTML = '<div class="empty">تعذّر تحميل القائمة. تأكد من الإنترنت.</div>'; }
};
$("custBack").onclick = () => openCust(false);
$("custSearch").oninput = renderCust;

/* ---------- التقارير ---------- */
let repType = "week", repOffset = 0;

function periodRange() {
  const now = new Date();
  if (repType === "week") {
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const back = (t.getDay() + 1) % 7;              // الأسبوع يبدأ يوم السبت
    const start = new Date(t); start.setDate(t.getDate() - back + repOffset * 7);
    const end = new Date(start); end.setDate(start.getDate() + 7);
    return { start, end };
  }
  return {
    start: new Date(now.getFullYear(), now.getMonth() + repOffset, 1),
    end: new Date(now.getFullYear(), now.getMonth() + repOffset + 1, 1)
  };
}
const dkey = (d) => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();

async function loadReport() {
  const { start, end } = periodRange();
  const last = new Date(end); last.setDate(last.getDate() - 1);
  $("repLabel").textContent = repType === "week"
    ? start.toLocaleDateString("ar", { day: "numeric", month: "short" }) + " - " + last.toLocaleDateString("ar", { day: "numeric", month: "short" })
    : start.toLocaleDateString("ar", { month: "long", year: "numeric" });
  $("repNext").disabled = repOffset >= 0;
  $("repBody").innerHTML = '<div class="empty">جارٍ التحميل...</div>';
  try {
    const rows = await fetchAll(`orders?select=amount_sdg,payment_type,status,created_at&created_at=gte.${start.toISOString()}&created_at=lt.${end.toISOString()}&order=created_at.asc`);
    let total = 0, cash = 0, credit = 0, ready = 0;
    const byDay = {};
    rows.forEach((o) => {
      const a = Number(o.amount_sdg) || 0;
      total += a;
      if (o.payment_type === "credit") credit += a; else cash += a;
      if (o.status === "ready") ready++;
      const k = dkey(new Date(o.created_at));
      byDay[k] = (byDay[k] || 0) + a;
    });
    const days = [];
    const stop = new Date(Math.min(end.getTime(), Date.now() + 86400000));
    for (let d = new Date(start); d < stop; d.setDate(d.getDate() + 1)) days.push({ d: new Date(d), v: byDay[dkey(d)] || 0 });
    const max = Math.max(1, ...days.map((x) => x.v));
    $("repBody").innerHTML = `
      <div class="stats">
        <div class="stat big"><span>إجمالي المبالغ</span><b>${esc(fmt(total))} <small>ج.س</small></b></div>
        <div class="stat"><span>عدد الطلبات</span><b>${esc(fmt(rows.length))}</b></div>
        <div class="stat"><span>طلبات جاهزة</span><b>${esc(fmt(ready))}</b></div>
        <div class="stat"><span>نقدي</span><b>${esc(fmt(cash))} <small>ج.س</small></b></div>
        <div class="stat"><span>آجل</span><b>${esc(fmt(credit))} <small>ج.س</small></b></div>
      </div>
      <h3>التفاصيل اليومية</h3>
      <div class="card">${days.length ? days.map((x) => `<div class="day">
        <span>${esc(x.d.toLocaleDateString("ar", { weekday: "short", day: "numeric" }))}</span>
        <div class="bar"><i style="width:${Math.round((x.v / max) * 100)}%"></i></div>
        <b>${esc(fmt(x.v))}</b></div>`).join("") : '<div class="empty">لا توجد بيانات.</div>'}</div>`;
  } catch (e) {
    $("repBody").innerHTML = '<div class="empty">تعذّر تحميل التقرير. تأكد من الإنترنت.</div>';
  }
}
$("repPills").onclick = (e) => {
  const v = e.target.closest("button")?.dataset.v; if (!v) return;
  repType = v; repOffset = 0;
  document.querySelectorAll("#repPills button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  loadReport();
};
$("repPrev").onclick = () => { repOffset--; loadReport(); };
$("repNext").onclick = () => { if (repOffset < 0) { repOffset++; loadReport(); } };

/* ---------- التحديث التلقائي ---------- */
function tick() { loadOrders(); refreshSettings(); }
function startPolling() { clearInterval(pollTimer); tick(); pollTimer = setInterval(tick, POLL_MS); }

updateNet();
renderDots();
</script>

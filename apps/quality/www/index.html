<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<uses-permission android:name="android.permission.INTERNET"/>
<title>تسجيل الحضور</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#0b1220;color:#e8eefc;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:20px}
h1{font-size:22px;text-align:center;margin:10px 0 20px}
h2{font-size:20px;margin:0 0 6px}
.card{background:#141c2e;border:1px solid #243049;border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a3957;background:#0b1220;color:#fff;font-size:20px;text-align:center;letter-spacing:6px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.main{width:100%;background:#ffb300;color:#1a1a1a;margin-top:12px;padding:14px}
.reg{background:#2a7bff;color:#fff}
.cancel{background:#2b3a58;color:#fff}
.done{color:#4ade80}
.muted{color:#8da2c9;font-size:14px}
#msg{text-align:center;min-height:24px;margin-top:6px}
.link{background:none;color:#8da2c9;width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🕒 تسجيل الحضور</h1>

  <div id="login" class="card">
    <h2>تسجيل الدخول</h2>
    <p class="muted">اكتب رقمك السري اللي أعطاك ليه المدير</p>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••">
    <button class="main" onclick="login()">دخول</button>
  </div>

  <div id="main" style="display:none">
    <div class="card">
      <h2 id="hello"></h2>
      <div class="muted" id="day"></div>
    </div>
    <div id="shifts"></div>
    <button class="link" onclick="logout()">تسجيل خروج</button>
  </div>

  <div id="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://qlvmxnoewxzykgbneadv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsdm14bm9ld3h6eWtnYm5lYWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDAwMjIsImV4cCI6MjEwNzIxNjAyMn0.WtsiO0PrUrwxKjpcyB3949kXSZeijtlJYySSbh0ieRk";
const SHIFTS = ["صباح (12 ساعة)", "ظهر (6ص - 2م)", "ليل (6م - 6ص)", "ليل (2م - 10م)"];

const $ = id => document.getElementById(id);
const mem = {};
function sget(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }
function sset(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
function sdel(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
function say(t){ $("msg").textContent = t; }
function today(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}

async function api(method, path, body){
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const t = await r.text();
    let data = null;
    try { data = t ? JSON.parse(t) : null; } catch(e){}
    return { ok: r.ok, status: r.status, data };
  } catch(e){
    return { ok: false, status: -1, data: null };
  }
}

let worker = null, reg = {};

function show(){
  $("login").style.display = worker ? "none" : "block";
  $("main").style.display = worker ? "block" : "none";
}

async function login(){
  const pin = $("pin").value.trim();
  if (!pin) { say("اكتب رقمك السري"); return; }
  const r = await api("GET", "workers?pin=eq." + encodeURIComponent(pin) + "&select=id,name");
  if (r.status === -1) { say("تأكد من الإنترنت"); return; }
  if (!r.ok || !r.data || !r.data.length) { say("الرقم غير صحيح"); return; }
  worker = r.data[0];
  sset("worker", JSON.stringify(worker));
  $("pin").value = ""; say(""); show(); await load();
}

async function load(){
  $("hello").textContent = "أهلاً " + worker.name + " 👋";
  $("day").textContent = "وردية اليوم (" + today() + ")";
  const r = await api("GET", "attendance?worker_id=eq." + worker.id + "&day=eq." + today() + "&select=id,shift");
  if (r.ok && r.data) { reg = {}; r.data.forEach(x => reg[x.shift] = x.id); }
  draw();
}

function draw(){
  const box = $("shifts"); box.innerHTML = "";
  SHIFTS.forEach(s => {
    const id = reg[s];
    const row = document.createElement("div"); row.className = "card row";
    const lb = document.createElement("span"); lb.textContent = s;
    if (id) { const ok = document.createElement("b"); ok.className = "done"; ok.textContent = " ✅"; lb.appendChild(ok); }
    const b = document.createElement("button");
    b.className = id ? "cancel" : "reg";
    b.textContent = id ? "إلغاء" : "تسجيل حضور";
    b.onclick = () => id ? cancel(id) : register(s);
    row.append(lb, b); box.appendChild(row);
  });
}

async function register(s){
  const r = await api("POST", "attendance", { worker_id: worker.id, shift: s, day: today() });
  say(r.status === 201 ? "تم التسجيل ✅" : r.status === 409 ? "مسجّل مسبقاً" : "فشل، تأكد من الإنترنت");
  await load();
}

async function cancel(id){
  const r = await api("DELETE", "attendance?id=eq." + id);
  say(r.ok ? "تم الإلغاء" : "فشل الإلغاء");
  await load();
}

function logout(){ sdel("worker"); worker = null; reg = {}; say(""); show(); }

(function init(){
  try { worker = JSON.parse(sget("worker")); } catch(e){ worker = null; }
  show();
  if (worker) load();
})();
</script>
</body>
</html>

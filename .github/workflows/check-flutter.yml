name: check-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: analyze
        run: |
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          rm -rf flutter_out/test
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          cd flutter_out
          if grep -q "package:url_launcher" lib/main.dart; then flutter pub add url_launcher; fi
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings > ../analyze.txt 2>&1 || true
          cd ..
          F=flutter_out/lib/main.dart
          DSL=$(grep -n "^// ===== نظام التصميم الجاهز" $F | head -n 1 | cut -d: -f1)
          UPL=$(grep -n "^// ===== تحديث التطبيق" $F | head -n 1 | cut -d: -f1)
          : > errs.txt
          grep -E "^[[:space:]]*error" analyze.txt | while IFS= read -r line; do
            L=$(echo "$line" | grep -o "main.dart:[0-9]*" | head -n 1 | cut -d: -f2)
            T=APP
            if [ -n "$L" ]; then
              if [ -n "$UPL" ] && [ "$L" -ge "$UPL" ]; then T=UPD
              elif [ -n "$DSL" ] && [ "$L" -ge "$DSL" ]; then T=DS
              elif sed -n "$L"p $F | grep -q " as apk"; then T=UPD
              fi
            fi
            echo "[$T] $line" >> errs.txt
          done
          if [ -s errs.txt ]; then
            echo APKERR_START
            cat errs.txt
            echo APKERR_END
            exit 1
          fi

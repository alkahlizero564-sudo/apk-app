name: Build Kotlin App
on:
  workflow_dispatch:
    inputs:
      app:
        description: kotlin app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Find app folder
        id: find
        run: |
          NAME=$(echo "${{ github.event.inputs.app }}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
          DIR=$(find apps -mindepth 1 -maxdepth 1 -type d | while read d; do
            n=$(basename "$d" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
            [ "$n" = "$NAME" ] && echo "$d" && break
          done)
          if [ -z "$DIR" ]; then
            echo "Folder not found. Existing folders:"
            ls apps
            exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "name=$(basename "$DIR")" >> $GITHUB_OUTPUT
      - name: Check icon
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          ls -R app/src/main/res 2>/dev/null || echo "no res folder"
          if [ ! -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png ]; then
            echo "icon missing, removing it from manifest"
            sed -i 's| android:icon="@mipmap/ic_launcher"||' app/src/main/AndroidManifest.xml
          fi
      - name: Use shared keystore
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          cp "$GITHUB_WORKSPACE/keys/shared.keystore" app/shared.keystore
          cat >> app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  shared {
                      storeFile file("shared.keystore")
                      storePassword "android123"
                      keyAlias "shared"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
              }
          }
          EOF
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      - name: Find and rename APK
        id: apk
        run: |
          APK=$(find "${{ steps.find.outputs.dir }}" -path "*outputs/apk/debug/*.apk" | head -n 1)
          echo "APK: $APK"
          mkdir -p release
          OUT="release/${{ steps.find.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kotlin-${{ steps.find.outputs.name }}-build-${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}

# v3
# v2 compatible
name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: create project
        run: |
          PKG=$(cat apps/$APP/pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app_$APP; fi
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' flutter_out/android/app/src/main/AndroidManifest.xml
          sed -i "/applicationId/s|com.myapps.app_$APP|$PKG|" flutter_out/android/app/build.gradle*
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: build
        working-directory: flutter_out
        run: flutter build apk --release
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ inputs.app }}-build-${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk

# v10
# v9 compatible
# v8 compatible
# v7 compatible
# v6 compatible
# v5 compatible
# v4 compatible
# v3 compatible
# v2 compatible
name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: app signing key
        env:
          KEYS_TOKEN: ${{ secrets.KEYS_TOKEN }}
        run: |
          if [ -z "$KEYS_TOKEN" ]; then echo "::error::KEYS_TOKEN secret is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          KR="$RUNNER_TEMP/keysrepo"
          rm -rf "$KR"
          git clone --depth 1 "https://x-access-token:$KEYS_TOKEN@github.com/$OWNER/apk-app-backup.git" "$KR" || { echo "::error::cannot open private repo $OWNER/apk-app-backup"; exit 1; }
          mkdir -p "$KR/keys" keys
          KS="$KR/keys/$APP.keystore"
          PR="$KR/keys/$APP.properties"
          if [ ! -f "$KS" ] || [ ! -f "$PR" ]; then
            PASS=$(openssl rand -hex 12)
            rm -f "$KS" "$PR"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=$APP, O=MyApps, C=SD"
            echo "pass=$PASS" > "$PR"
            cd "$KR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "keys/$APP.keystore" "keys/$APP.properties"
            git commit -m "add signing key for $APP"
            BR=$(git rev-parse --abbrev-ref HEAD)
            PUSHED=0
            for n in 1 2 3 4 5; do
              git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && { PUSHED=1; break; }
              echo "push attempt $n failed"
              sleep 5
            done
            cd "$GITHUB_WORKSPACE"
            if [ "$PUSHED" != "1" ]; then echo "::error::failed to save the signing key to apk-app-backup"; exit 1; fi
            echo "NEW private signing key created for $APP"
          else
            echo "using private signing key for $APP"
          fi
          echo "::add-mask::$(grep '^pass=' "$PR" | cut -d= -f2)"
          rm -f "keys/$APP.keystore" "keys/$APP.properties"
          cp "$KS" "keys/$APP.keystore"
          cp "$PR" "keys/$APP.properties"
      - name: create project
        run: |
          PKG=$(cat apps/$APP/pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app_$APP; fi
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          if [ -f apps/$APP/push.dart ]; then cp apps/$APP/push.dart flutter_out/lib/push.dart; fi
          MF=flutter_out/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' $MF
          sed -i "/applicationId/s|com.myapps.app_$APP|$PKG|" flutter_out/android/app/build.gradle*
          SET=apps/$APP/settings.json
          LABEL=$(jq -r '.label // empty' $SET 2>/dev/null || true)
          ORI=$(jq -r '.ori // "auto"' $SET 2>/dev/null || echo auto)
          if [ -n "$LABEL" ]; then sed -i 's|android:label="[^"]*"|android:label="'"$LABEL"'"|' $MF; fi
          if [ "$ORI" = "portrait" ] || [ "$ORI" = "landscape" ]; then sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="'"$ORI"'"|' $MF; fi
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          cp keys/$APP.keystore flutter_out/android/app/app.keystore
          if [ -f flutter_out/android/app/build.gradle.kts ]; then
            cat >> flutter_out/android/app/build.gradle.kts <<EOF

          android {
              signingConfigs {
                  create("appkey") {
                      storeFile = file("app.keystore")
                      storePassword = "$PASS"
                      keyAlias = "appkey"
                      keyPassword = "$PASS"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("appkey")
                  }
              }
          }
          EOF
          else
            cat >> flutter_out/android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  appkey {
                      storeFile file("app.keystore")
                      storePassword "$PASS"
                      keyAlias "appkey"
                      keyPassword "$PASS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.appkey
                  }
              }
          }
          EOF
          fi
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: packages
        run: |
          ALLOW="http shared_preferences path_provider path sqflite intl url_launcher provider google_fonts fl_chart image_picker file_picker share_plus uuid connectivity_plus package_info_plus device_info_plus geolocator permission_handler cached_network_image flutter_svg lottie audioplayers video_player webview_flutter mobile_scanner qr_flutter local_auth flutter_local_notifications timezone collection crypto table_calendar shimmer flutter_animate animations pdf printing csv firebase_core firebase_messaging"
          PKGS=$(cat flutter_out/lib/*.dart | grep -oE "^[[:space:]]*(import|export)[[:space:]]+['\"]package:[a-z0-9_]+/" | grep -oE "package:[a-z0-9_]+" | cut -d: -f2 | sort -u)
          ADD=""; BAD=""; LOC=0
          for p in $PKGS; do
            case "$p" in flutter|flutter_test|app_$APP) continue ;; flutter_localizations) LOC=1; continue ;; esac
            if echo " $ALLOW " | grep -q " $p "; then ADD="$ADD $p"; else BAD="$BAD $p"; fi
          done
          if [ -n "$BAD" ]; then echo "::error::unsupported packages:$BAD"; exit 1; fi
          echo "packages:$ADD"
          cd flutter_out
          if [ -n "$ADD" ]; then flutter pub add $(for x in $ADD; do case "$x" in google_fonts) echo "google_fonts:<9.0.0" ;; *) echo "$x" ;; esac; done); fi
          if [ "$LOC" = "1" ]; then flutter pub add flutter_localizations --sdk=flutter; fi
          [ -z "$ADD" ] && exit 0
          MF=android/app/src/main/AndroidManifest.xml
          G=$(ls android/app/build.gradle* | head -n 1)
          has(){ echo " $ADD " | grep -q " $1 "; }
          perm(){ grep -q "android.permission.$1\"" $MF || sed -i "s|<application|<uses-permission android:name=\"android.permission.$1\"/><application|" $MF; }
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' "$G"
          if has geolocator; then perm ACCESS_FINE_LOCATION; perm ACCESS_COARSE_LOCATION; fi
          if has image_picker || has mobile_scanner; then perm CAMERA; fi
          if has flutter_local_notifications; then perm POST_NOTIFICATIONS; perm RECEIVE_BOOT_COMPLETED; perm VIBRATE; fi
          if has local_auth; then
            perm USE_BIOMETRIC
            for f in $(find android/app/src/main -name "MainActivity.*"); do sed -i 's/\bFlutterActivity\b/FlutterFragmentActivity/g' "$f"; done
          fi
          if has url_launcher; then
            sed -i 's|</manifest>|<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent><intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent><intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent><intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="smsto"/></intent></queries></manifest>|' $MF
          fi
          if has flutter_local_notifications; then
            if [[ "$G" == *.kts ]]; then
              printf '\nandroid {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }\n}\ndependencies {\n    add("coreLibraryDesugaring", "com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$G"
            else
              printf '\nandroid {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }\n}\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> "$G"
            fi
          fi
          echo "--- manifest ---"; grep -o 'android.permission.[A-Z_]*' $MF | sort -u
      - name: requested permissions
        run: |
          [ -f apps/$APP/perms.txt ] || { echo "no perms.txt"; exit 0; }
          MF=flutter_out/android/app/src/main/AndroidManifest.xml
          for P in $(grep -oE '^[A-Z_]+$' apps/$APP/perms.txt); do
            grep -q "android.permission.$P\"" $MF || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\"/><application|" $MF
          done
          grep -q "^CAMERA$" apps/$APP/perms.txt && { grep -q "android.hardware.camera\"" $MF || sed -i 's|<application|<uses-feature android:name="android.hardware.camera" android:required="false"/><application|' $MF; }
          grep -o 'android.permission.[A-Z_]*' $MF | sort -u
      - name: push notifications (FCM)
        run: |
          if ! grep -qs on apps/$APP/push.txt; then echo "push notifications: off"; exit 0; fi
          SA="$RUNNER_TEMP/keysrepo/keys/fcm-sa.json"
          if [ ! -f "$SA" ]; then echo "::error::push.txt is on but keys/fcm-sa.json is missing in apk-app-backup"; exit 1; fi
          G=$(ls flutter_out/android/app/build.gradle* | head -n 1)
          PKG=$(grep -m1 -oE 'applicationId *=? *"[^"]+"' "$G" | grep -oE '"[^"]+"' | tr -d '"')
          echo "package: $PKG"
          python3 .github/fcm_config.py "$SA" "$PKG" flutter_out/android/app/google-services.json
          (cd flutter_out && flutter pub add firebase_core firebase_messaging)
          SG=$(ls flutter_out/android/settings.gradle* | head -n 1)
          if [[ "$SG" == *.kts ]]; then
            grep -q google-services "$SG" || sed -i 's|^\(\s*\)id("com.android.application") version\(.*\)$|&\n\1id("com.google.gms.google-services") version "4.4.2" apply false|' "$SG"
            grep -q google-services "$G" || sed -i '0,/id("com.android.application")/s//id("com.android.application")\n    id("com.google.gms.google-services")/' "$G"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' "$G"
          else
            grep -q google-services "$SG" || sed -i 's|^\(\s*\)id "com.android.application" version\(.*\)$|&\n\1id "com.google.gms.google-services" version "4.4.2" apply false|' "$SG"
            grep -q google-services "$G" || sed -i '0,/id "com.android.application"/s//id "com.android.application"\n    id "com.google.gms.google-services"/' "$G"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/; s/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' "$G"
          fi
          echo "--- gradle ---"; grep -n "google-services\|minSdk" "$SG" "$G" || true
          MF=flutter_out/android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $MF || sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application|' $MF
      - name: build
        working-directory: flutter_out
        run: |
          VN=$(jq -r '.versionName // "1.0.0"' ../apps/$APP/settings.json 2>/dev/null || echo 1.0.0)
          VC=$(jq -r '.versionCode // 1' ../apps/$APP/settings.json 2>/dev/null || echo 1)
          flutter build apk --release --build-name=$VN --build-number=$VC
      - name: verify signing
        if: always()
        continue-on-error: true
        run: |
          APK=flutter_out/build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then echo "no apk to verify"; exit 0; fi
          AS=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          if [ -z "$AS" ]; then echo "apksigner not found"; exit 0; fi
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          A=$("$AS" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          K=$(keytool -list -v -keystore keys/$APP.keystore -storepass "$PASS" -alias appkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "apk:      $A"
          echo "keystore: $K"
          if [ -n "$A" ] && [ "$A" = "$K" ]; then echo "SIGNING OK: this app uses its own key"; else echo "SIGNING MISMATCH"; fi
      - name: release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ inputs.app }}-build-${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk

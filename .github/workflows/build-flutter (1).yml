# v6
# v5 compatible
# v4 compatible
# v3 compatible
# v2 compatible
name: build-flutter
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: app signing key
        run: |
          mkdir -p keys
          KS=keys/$APP.keystore
          PR=keys/$APP.properties
          if [ ! -f "$KS" ] || [ ! -f "$PR" ]; then
            PASS=$(openssl rand -hex 12)
            rm -f "$KS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=$APP, O=MyApps, C=SD"
            echo "pass=$PASS" > "$PR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "$KS" "$PR"
            git commit -m "add signing key for $APP"
            PUSHED=0
            for n in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then PUSHED=1; break; fi
              sleep 4
            done
            if [ "$PUSHED" != "1" ]; then echo "failed to save the signing key to the repo"; exit 1; fi
            echo "NEW signing key created for $APP"
          else
            echo "using existing signing key for $APP"
          fi
      - name: create project
        run: |
          PKG=$(cat apps/$APP/pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app_$APP; fi
          flutter create --org com.myapps --project-name app_$APP --platforms=android flutter_out
          cp apps/$APP/main.dart flutter_out/lib/main.dart
          if grep -q "package:url_launcher" apps/$APP/main.dart; then
            (cd flutter_out && flutter pub add url_launcher)
          fi
          MF=flutter_out/android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' $MF
          sed -i "/applicationId/s|com.myapps.app_$APP|$PKG|" flutter_out/android/app/build.gradle*
          SET=apps/$APP/settings.json
          LABEL=$(jq -r '.label // empty' $SET 2>/dev/null || true)
          ORI=$(jq -r '.ori // "auto"' $SET 2>/dev/null || echo auto)
          if [ -n "$LABEL" ]; then sed -i 's|android:label="[^"]*"|android:label="'"$LABEL"'"|' $MF; fi
          if [ "$ORI" = "portrait" ] || [ "$ORI" = "landscape" ]; then sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:screenOrientation="'"$ORI"'"|' $MF; fi
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          cp keys/$APP.keystore flutter_out/android/app/app.keystore
          if [ -f flutter_out/android/app/build.gradle.kts ]; then
            cat >> flutter_out/android/app/build.gradle.kts <<EOF

          android {
              signingConfigs {
                  create("appkey") {
                      storeFile = file("app.keystore")
                      storePassword = "$PASS"
                      keyAlias = "appkey"
                      keyPassword = "$PASS"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("appkey")
                  }
              }
          }
          EOF
          else
            cat >> flutter_out/android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  appkey {
                      storeFile file("app.keystore")
                      storePassword "$PASS"
                      keyAlias "appkey"
                      keyPassword "$PASS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.appkey
                  }
              }
          }
          EOF
          fi
          if [ -f apps/$APP/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp apps/$APP/icon.png flutter_out/android/app/src/main/res/$d/ic_launcher.png
            done
          fi
      - name: build
        working-directory: flutter_out
        run: |
          VN=$(jq -r '.versionName // "1.0.0"' ../apps/$APP/settings.json 2>/dev/null || echo 1.0.0)
          VC=$(jq -r '.versionCode // 1' ../apps/$APP/settings.json 2>/dev/null || echo 1)
          flutter build apk --release --build-name=$VN --build-number=$VC
      - name: verify signing
        if: always()
        continue-on-error: true
        run: |
          APK=flutter_out/build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then echo "no apk to verify"; exit 0; fi
          AS=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          if [ -z "$AS" ]; then echo "apksigner not found"; exit 0; fi
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          A=$("$AS" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          K=$(keytool -list -v -keystore keys/$APP.keystore -storepass "$PASS" -alias appkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "apk:      $A"
          echo "keystore: $K"
          if [ -n "$A" ] && [ "$A" = "$K" ]; then echo "SIGNING OK: this app uses its own key"; else echo "SIGNING MISMATCH"; fi
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flutter-${{ inputs.app }}-build-${{ github.run_number }}
          files: flutter_out/build/app/outputs/flutter-apk/app-release.apk

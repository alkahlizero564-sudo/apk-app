name: Build App
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Find app folder
        id: find
        run: |
          NAME=$(echo "${{ github.event.inputs.app }}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
          DIR=$(find apps -mindepth 1 -maxdepth 1 -type d | while read d; do
            n=$(basename "$d" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
            [ "$n" = "$NAME" ] && echo "$d" && break
          done)
          if [ -z "$DIR" ]; then
            echo "Folder not found. Existing folders:"
            ls apps
            exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "name=$(basename "$DIR")" >> $GITHUB_OUTPUT
      - name: Set unique appId
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          ID=$(echo "${{ steps.find.outputs.name }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          case "$ID" in [0-9]*) ID="a$ID";; esac
          [ -z "$ID" ] && ID="app"
          APPID="com.myapps.$ID"
          echo "appId = $APPID"
          if [ -f capacitor.config.json ]; then
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.appId='$APPID';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          elif [ -f capacitor.config.ts ]; then
            sed -i "s|appId:.*|appId: '$APPID',|" capacitor.config.ts
          else
            echo "No capacitor config found"
            exit 1
          fi
      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cp "$GITHUB_WORKSPACE/keys/shared.keystore" android/app/shared.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  shared {
                      storeFile file("shared.keystore")
                      storePassword "android123"
                      keyAlias "shared"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find.outputs.name }}-build-${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk

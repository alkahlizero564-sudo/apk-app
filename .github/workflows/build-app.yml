name: Build App
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-cap7
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4
      - name: Find app folder
        id: find
        run: |
          NAME=$(echo "${{ github.event.inputs.app }}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
          DIR=$(find apps -mindepth 1 -maxdepth 1 -type d | while read d; do
            n=$(basename "$d" | tr -d ' ' | tr '[:upper:]' '[:lower:]')
            [ "$n" = "$NAME" ] && echo "$d" && break
          done)
          if [ -z "$DIR" ]; then
            echo "Folder not found. Existing folders:"
            ls apps
            exit 1
          fi
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "name=$(basename "$DIR")" >> $GITHUB_OUTPUT
      - name: Detect type
        id: type
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ]; then
            echo "type=capacitor" >> $GITHUB_OUTPUT
            echo "apk=android/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          elif [ -f gradlew ]; then
            echo "type=kotlin" >> $GITHUB_OUTPUT
            echo "apk=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "Unknown project type"
            exit 1
          fi
      - name: Set unique appId
        if: steps.type.outputs.type == 'capacitor'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          ID=$(echo "${{ steps.find.outputs.name }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          case "$ID" in [0-9]*) ID="a$ID";; esac
          [ -z "$ID" ] && ID="app"
          APPID="com.myapps.$ID"
          echo "default appId = $APPID"
          if [ -f capacitor.config.json ]; then
            node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));const ok=/^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+\$/.test(c.appId||'');if(!ok)c.appId='$APPID';console.log('final appId = '+c.appId);fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          elif [ -f capacitor.config.ts ]; then
            sed -i "s|appId:.*|appId: '$APPID',|" capacitor.config.ts
          else
            echo "No capacitor config found"
            exit 1
          fi
      - name: App signing key
        if: steps.type.outputs.type == 'capacitor'
        env:
          APPN: ${{ steps.find.outputs.name }}
          KEYS_TOKEN: ${{ secrets.KEYS_TOKEN }}
        run: |
          if [ -z "$KEYS_TOKEN" ]; then echo "::error::KEYS_TOKEN secret is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          KR="$RUNNER_TEMP/keysrepo"
          rm -rf "$KR"
          git clone --depth 1 "https://x-access-token:$KEYS_TOKEN@github.com/$OWNER/apk-app-backup.git" "$KR" || { echo "::error::cannot open private repo $OWNER/apk-app-backup"; exit 1; }
          mkdir -p "$KR/keys" keys
          KS="$KR/keys/$APPN.keystore"
          PR="$KR/keys/$APPN.properties"
          if [ ! -f "$KS" ] || [ ! -f "$PR" ]; then
            PASS=$(openssl rand -hex 12)
            rm -f "$KS" "$PR"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=$APPN, O=MyApps, C=SD"
            echo "pass=$PASS" > "$PR"
            cd "$KR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "keys/$APPN.keystore" "keys/$APPN.properties"
            git commit -m "add signing key for $APPN"
            BR=$(git rev-parse --abbrev-ref HEAD)
            PUSHED=0
            for n in 1 2 3 4 5; do
              git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && { PUSHED=1; break; }
              echo "push attempt $n failed"
              sleep 5
            done
            cd "$GITHUB_WORKSPACE"
            if [ "$PUSHED" != "1" ]; then echo "::error::failed to save the signing key to apk-app-backup"; exit 1; fi
            echo "NEW private signing key created for $APPN"
          else
            echo "using private signing key for $APPN"
          fi
          echo "::add-mask::$(grep '^pass=' "$PR" | cut -d= -f2)"
          rm -f "keys/$APPN.keystore" "keys/$APPN.properties"
          cp "$KS" "keys/$APPN.keystore"
          cp "$PR" "keys/$APPN.properties"
      - name: Push notifications (FCM)
        if: steps.type.outputs.type == 'capacitor'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          rm -f .push_ok google-services.json
          if ! grep -qs on push.txt; then echo "push notifications: off"; exit 0; fi
          SA="$RUNNER_TEMP/keysrepo/keys/fcm-sa.json"
          if [ ! -f "$SA" ]; then echo "::warning::push.txt is on but keys/fcm-sa.json is missing in apk-app-backup"; exit 0; fi
          PKG=$(node -e "console.log(JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')).appId)")
          if python3 "$GITHUB_WORKSPACE/.github/fcm_config.py" "$SA" "$PKG" google-services.json; then touch .push_ok; else echo "::warning::could not get google-services.json, building without push"; fi
      - name: Build
        id: build
        if: steps.type.outputs.type == 'capacitor'
        working-directory: ${{ steps.find.outputs.dir }}
        env:
          APPN: ${{ steps.find.outputs.name }}
        run: |
          BT=$(cat buildtype.txt 2>/dev/null | tr -d '[:space:]')
          [ "$BT" = "release" ] || BT=debug
          echo "build type = $BT"
          npm install
          if [ -f .push_ok ]; then
            CV=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
            npm install "@capacitor/push-notifications@^$CV"
          fi
          npx cap add android
          if [ -f .push_ok ]; then cp google-services.json android/app/google-services.json; echo "google-services.json added"; fi
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          if [ -f .push_ok ]; then grep -q "POST_NOTIFICATIONS" "$M" || sed -i "s|</manifest>|    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n</manifest>|" "$M"; fi
          for P in INTERNET ACCESS_NETWORK_STATE; do
            grep -q "android.permission.$P" "$M" || sed -i "s|</manifest>|    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>|" "$M"
          done
          echo "--- permissions ---"
          grep "uses-permission" "$M"
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          if [ -f settings.json ]; then
            echo "--- applying settings ---"
            G=android/app/build.gradle
            VC=$(jq -r '.versionCode // empty' settings.json)
            VN=$(jq -r '.versionName // empty' settings.json)
            ORI=$(jq -r '.ori // "auto"' settings.json)
            if [ -n "$VC" ]; then sed -i "s/versionCode [0-9][0-9]*/versionCode $VC/" "$G"; fi
            if [ -n "$VN" ]; then sed -i "s/versionName \"[^\"]*\"/versionName \"$VN\"/" "$G"; fi
            sed -i 's/ android:screenOrientation="[^"]*"//' "$M"
            if [ "$ORI" = "portrait" ] || [ "$ORI" = "landscape" ]; then
              sed -i "s|android:name=\".MainActivity\"|android:name=\".MainActivity\" android:screenOrientation=\"$ORI\"|" "$M"
            fi
            grep -E "versionCode|versionName" "$G" || true
            grep "screenOrientation" "$M" || true
          fi
          if [ -f icon.png ]; then
            echo "--- applying icon ---"
            npm install --no-save sharp
            cat > make-icon.js <<'EOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const res = 'android/app/src/main/res';
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          (async () => {
            for (const d of Object.keys(sizes)) {
              const s = sizes[d];
              const dir = path.join(res, 'mipmap-' + d);
              fs.mkdirSync(dir, { recursive: true });
              const sq = await sharp('icon.png').resize(s, s, { fit: 'cover' }).png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher.png'), sq);
              const mask = Buffer.from('<svg width="' + s + '" height="' + s + '"><circle cx="' + (s / 2) + '" cy="' + (s / 2) + '" r="' + (s / 2) + '"/></svg>');
              const rd = await sharp(sq).composite([{ input: mask, blend: 'dest-in' }]).png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher_round.png'), rd);
            }
            fs.rmSync(path.join(res, 'mipmap-anydpi-v26'), { recursive: true, force: true });
            console.log('icon done');
          })();
          EOF
            node make-icon.js
          fi
          PASS=$(grep '^pass=' "$GITHUB_WORKSPACE/keys/$APPN.properties" | cut -d= -f2)
          cp "$GITHUB_WORKSPACE/keys/$APPN.keystore" android/app/app.keystore
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  appkey {
                      storeFile file("app.keystore")
                      storePassword "$PASS"
                      keyAlias "appkey"
                      keyPassword "$PASS"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.appkey
                  }
                  release {
                      signingConfig signingConfigs.appkey
                  }
              }
          }
          EOF
          if [ "$BT" = "release" ]; then
            cat >> android/app/build.gradle <<'EOF'

          android {
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
          EOF
          fi
          printf '\norg.gradle.parallel=true\norg.gradle.caching=true\n' >> android/gradle.properties
          cd android
          chmod +x gradlew
          if [ "$BT" = "release" ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi
          cd ..
          echo "apk=android/app/build/outputs/apk/$BT/app-$BT.apk" >> "$GITHUB_OUTPUT"
      - name: Verify signing
        if: always() && steps.type.outputs.type == 'capacitor'
        continue-on-error: true
        env:
          APPN: ${{ steps.find.outputs.name }}
          APKP: ${{ steps.find.outputs.dir }}/${{ steps.build.outputs.apk }}
        run: |
          if [ ! -f "$APKP" ]; then echo "no apk to verify"; exit 0; fi
          AS=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          if [ -z "$AS" ]; then echo "apksigner not found"; exit 0; fi
          PASS=$(grep '^pass=' keys/$APPN.properties | cut -d= -f2)
          A=$("$AS" verify --print-certs "$APKP" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          K=$(keytool -list -v -keystore keys/$APPN.keystore -storepass "$PASS" -alias appkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "apk:      $A"
          echo "keystore: $K"
          if [ -n "$A" ] && [ "$A" = "$K" ]; then echo "SIGNING OK: this app uses its own key"; else echo "SIGNING MISMATCH"; fi
      - name: Build Kotlin
        if: steps.type.outputs.type == 'kotlin'
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.find.outputs.name }}-build-${{ github.run_number }}
          files: ${{ steps.find.outputs.dir }}/${{ steps.build.outputs.apk || steps.type.outputs.apk }}

name: Build App
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: apps/${{ github.event.inputs.app }}
        run: |
          npm install
          npx cap add android
          npx cap sync android
          cp "$GITHUB_WORKSPACE/keys/shared.keystore" android/app/shared.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  shared {
                      storeFile file("shared.keystore")
                      storePassword "android123"
                      keyAlias "shared"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.app }}-build-${{ github.run_number }}
          files: apps/${{ github.event.inputs.app }}/android/app/build/outputs/apk/debug/app-debug.apk

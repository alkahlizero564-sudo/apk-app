name: Build APK App
on:
  workflow_dispatch:
  push:
    paths:
      - 'www/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-main.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - run: npm install
      - run: npx cap add android
      - name: Icon
        continue-on-error: true
        run: |
          rsvg-convert -w 1024 -h 1024 assets/icon-bg.svg -o assets/icon-background.png
          rsvg-convert -w 1024 -h 1024 assets/icon-fg.svg -o assets/icon-foreground.png
          convert assets/icon-background.png assets/icon-foreground.png -composite assets/icon-only.png
          npx -y @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Colors like APK Fact (status bar, navigation bar, splash)
        continue-on-error: true
        run: |
          V=android/app/src/main/res/values
          mkdir -p $V
          cat > $V/apkfact_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="apkfact_bg">#07080E</color>
              <color name="apkfact_nav">#10121B</color>
          </resources>
          EOF
          sed -i 's/^ *//' $V/apkfact_colors.xml
          ST=$V/styles.xml
          if [ -f $ST ]; then
            sed -i 's|<item name="colorPrimaryDark">[^<]*</item>|<item name="colorPrimaryDark">@color/apkfact_bg</item>|' $ST
            sed -i 's|<item name="colorPrimary">[^<]*</item>|<item name="colorPrimary">@color/apkfact_bg</item>|' $ST
            grep -q 'android:navigationBarColor' $ST || sed -i 's|\(<style name="AppTheme.NoActionBar"[^>]*>\)|\1\n        <item name="android:navigationBarColor">@color/apkfact_nav</item>\n        <item name="android:statusBarColor">@color/apkfact_bg</item>\n        <item name="android:windowBackground">@color/apkfact_bg</item>|' $ST
            grep -q 'windowSplashScreenBackground' $ST || sed -i 's|\(<style name="AppTheme.NoActionBarLaunch"[^>]*>\)|\1\n        <item name="windowSplashScreenBackground">@color/apkfact_bg</item>\n        <item name="android:windowBackground">@color/apkfact_bg</item>|' $ST
            sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">@color/apkfact_bg</item>|' $ST
            cat $ST
          fi
      - name: Apply shared signing key
        run: |
          cp "$GITHUB_WORKSPACE/keys/shared.keystore" android/app/shared.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  shared {
                      storeFile file("shared.keystore")
                      storePassword "android123"
                      keyAlias "shared"
                      keyPassword "android123"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.shared
                  }
              }
          }
          EOF
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-app-${{ github.run_number }}
          name: APK App ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

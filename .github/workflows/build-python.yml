# v5
# v4 compatible
# v3 compatible
# v2 compatible
name: build-python
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: cache buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v5
      - name: cache app build
        uses: actions/cache@v4
        with:
          path: apps/${{ inputs.app }}/.buildozer
          key: buildozer-app-v5-${{ inputs.app }}
      - name: signing key
        run: |
          if [ -f keys/shared.keystore ]; then
            mkdir -p ~/.android
            rm -f ~/.android/debug.keystore
            keytool -importkeystore -noprompt -srckeystore keys/shared.keystore -srcstorepass android123 -srcalias shared -srckeypass android123 -destkeystore ~/.android/debug.keystore -deststorepass android -destalias androiddebugkey -destkeypass android -deststoretype PKCS12 || echo "signing key import skipped"
          else
            echo "keys/shared.keystore not found, using a random debug key"
          fi
      - name: write spec
        working-directory: apps/${{ inputs.app }}
        run: |
          PKG=$(cat pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app$APP; fi
          NAM=$(echo "$PKG" | awk -F. '{print $NF}')
          DOM=$(echo "$PKG" | sed 's/\.[^.]*$//')
          LABEL=$(jq -r '.label // empty' settings.json 2>/dev/null || true)
          if [ -z "$LABEL" ]; then LABEL=$APP; fi
          ORI=$(jq -r '.ori // "auto"' settings.json 2>/dev/null || echo auto)
          case "$ORI" in
            portrait) OR=portrait ;;
            landscape) OR=landscape ;;
            *) OR=all ;;
          esac
          VN=$(jq -r '.versionName // "1.0"' settings.json 2>/dev/null || echo 1.0)
          VC=$(jq -r '.versionCode // 1' settings.json 2>/dev/null || echo 1)
          cat > buildozer.spec <<EOF
          [app]
          title = $LABEL
          package.name = $NAM
          package.domain = $DOM
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = $VN
          requirements = python3,kivy==2.3.0,certifi
          orientation = $OR
          fullscreen = 0
          android.numeric_version = $VC
          android.permissions = INTERNET
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          sed -i 's/^ *//' buildozer.spec
          if [ -f icon.png ]; then sed -i '/^\[app\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec; fi
      - name: build
        working-directory: apps/${{ inputs.app }}
        run: buildozer -v android debug
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-${{ inputs.app }}-build-${{ github.run_number }}
          files: apps/${{ inputs.app }}/bin/*.apk

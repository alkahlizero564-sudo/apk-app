# v11
# v10 compatible
# v9 compatible
# v8 compatible
# v7 compatible
# v6 compatible
# v5 compatible
# v4 compatible
# v3 compatible
# v2 compatible
name: build-python
on:
  workflow_dispatch:
    inputs:
      app:
        description: app folder
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake autoconf-archive libtool libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: restore buildozer global cache
        id: gcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v5
      - name: cache app build
        uses: actions/cache@v4
        with:
          path: apps/${{ inputs.app }}/.buildozer
          key: buildozer-app-v6-${{ inputs.app }}
      - name: app signing key
        env:
          KEYS_TOKEN: ${{ secrets.KEYS_TOKEN }}
        run: |
          if [ -z "$KEYS_TOKEN" ]; then echo "::error::KEYS_TOKEN secret is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          KR="$RUNNER_TEMP/keysrepo"
          rm -rf "$KR"
          git clone --depth 1 "https://x-access-token:$KEYS_TOKEN@github.com/$OWNER/apk-app-backup.git" "$KR" || { echo "::error::cannot open private repo $OWNER/apk-app-backup"; exit 1; }
          mkdir -p "$KR/keys" keys
          KS="$KR/keys/$APP.keystore"
          PR="$KR/keys/$APP.properties"
          if [ ! -f "$KS" ] || [ ! -f "$PR" ]; then
            PASS=$(openssl rand -hex 12)
            rm -f "$KS" "$PR"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" -alias appkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=$APP, O=MyApps, C=SD"
            echo "pass=$PASS" > "$PR"
            cd "$KR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f "keys/$APP.keystore" "keys/$APP.properties"
            git commit -m "add signing key for $APP"
            BR=$(git rev-parse --abbrev-ref HEAD)
            PUSHED=0
            for n in 1 2 3 4 5; do
              git pull --rebase origin "$BR" && git push origin "HEAD:$BR" && { PUSHED=1; break; }
              echo "push attempt $n failed"
              sleep 5
            done
            cd "$GITHUB_WORKSPACE"
            if [ "$PUSHED" != "1" ]; then echo "::error::failed to save the signing key to apk-app-backup"; exit 1; fi
            echo "NEW private signing key created for $APP"
          else
            echo "using private signing key for $APP"
          fi
          echo "::add-mask::$(grep '^pass=' "$PR" | cut -d= -f2)"
          rm -f "keys/$APP.keystore" "keys/$APP.properties"
          cp "$KS" "keys/$APP.keystore"
          cp "$PR" "keys/$APP.properties"
      - name: signing key
        run: |
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -noprompt -srckeystore keys/$APP.keystore -srcstorepass "$PASS" -srcalias appkey -srckeypass "$PASS" -destkeystore ~/.android/debug.keystore -deststorepass android -destalias androiddebugkey -destkeypass android -deststoretype PKCS12 || { echo "signing key import FAILED"; exit 1; }
          echo "signing key imported for $APP"
      - name: libraries and arabic support
        working-directory: apps/${{ inputs.app }}
        run: |
          python3 - <<'EOF'
          import ast, sys, json
          src = open('main.py', encoding='utf-8').read()
          mods = set()
          for n in ast.walk(ast.parse(src)):
              if isinstance(n, ast.Import):
                  mods.update(a.name.split('.')[0] for a in n.names)
              elif isinstance(n, ast.ImportFrom) and n.module and not n.level:
                  mods.add(n.module.split('.')[0])
          MAP = {
              'requests': ['requests', 'urllib3', 'charset-normalizer', 'idna'],
              'kivymd': ['kivymd==1.2.0', 'pillow'],
              'PIL': ['pillow'],
              'plyer': ['plyer'],
              'sqlite3': ['sqlite3'],
              'numpy': ['numpy'],
              'dateutil': ['python-dateutil'],
              'qrcode': ['qrcode', 'pillow'],
              'pytz': ['pytz'],
              'jnius': ['pyjnius'],
              'android': ['android'],
          }
          req = ['python3', 'kivy==2.3.0', 'certifi', 'six', 'arabic-reshaper==3.0.0', 'python-bidi==0.4.2']
          for m in sorted(mods):
              for r in MAP.get(m, []):
                  if r not in req:
                      req.append(r)
          perms = ['INTERNET']
          low = src.lower()
          if 'plyer' in mods and ('gps' in low or 'location' in low):
              perms += ['ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION']
          if 'camera' in low and ('plyer' in mods or 'kivy.uix.camera' in src):
              perms += ['CAMERA']
          if 'vibrator' in low:
              perms += ['VIBRATE']
          if 'notification' in low and 'plyer' in mods:
              perms += ['POST_NOTIFICATIONS']
          if 'audio' in low and 'plyer' in mods:
              perms += ['RECORD_AUDIO']
          try:
              for x in open('perms.txt', encoding='utf-8').read().split():
                  if x.isupper() and x.replace('_', '').isalpha() and x not in perms:
                      perms.append(x)
          except Exception:
              pass
          open('/tmp/req.txt', 'w').write(','.join(req))
          open('/tmp/perms.txt', 'w').write(','.join(dict.fromkeys(perms)))
          print('requirements:', ','.join(req))
          print('permissions:', ','.join(dict.fromkeys(perms)))
          lines = src.split('\n')
          if not any(l.strip() in ('import apkar',) or l.strip().startswith('from apkar import') for l in lines):
              i = 0
              while i < len(lines) and (lines[i].startswith('#') or lines[i].startswith('from __future__') or not lines[i].strip()):
                  i += 1
              lines.insert(i, 'import apkar')
              open('main.py', 'w', encoding='utf-8').write('\n'.join(lines))
          EOF
          cat > apkar.py <<'EOF'
          # Arabic support for Kivy (added automatically by the builder)
          import os
          from kivy.core.text import LabelBase, DEFAULT_FONT
          _d = os.path.dirname(os.path.abspath(__file__))
          _r = os.path.join(_d, 'apk_font_regular.ttf')
          _b = os.path.join(_d, 'apk_font_bold.ttf')
          FONT = _r if os.path.exists(_r) else None
          if FONT:
              LabelBase.register(DEFAULT_FONT, _r, fn_bold=_b if os.path.exists(_b) else _r)
              LabelBase.register('Arabic', _r, fn_bold=_b if os.path.exists(_b) else _r)
          try:
              import arabic_reshaper
              from bidi.algorithm import get_display
              def ar(text):
                  text = '' if text is None else str(text)
                  return '\n'.join(get_display(arabic_reshaper.reshape(t)) for t in text.split('\n'))
          except Exception:
              def ar(text):
                  return '' if text is None else str(text)
          EOF
          GF=https://github.com/google/fonts/raw/main/ofl/tajawal
          if curl -fsSL --retry 3 -o apk_font_regular.ttf "$GF/Tajawal-Regular.ttf" && curl -fsSL --retry 3 -o apk_font_bold.ttf "$GF/Tajawal-Bold.ttf"; then
            echo "font: Tajawal"
          else
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf apk_font_regular.ttf
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf apk_font_bold.ttf
            echo "font: DejaVu (fallback)"
          fi
          head -n 5 main.py
      - name: write spec
        working-directory: apps/${{ inputs.app }}
        run: |
          PKG=$(cat pkg.txt 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PKG" ]; then PKG=com.myapps.app$APP; fi
          NAM=$(echo "$PKG" | awk -F. '{print $NF}')
          DOM=$(echo "$PKG" | sed 's/\.[^.]*$//')
          LABEL=$(jq -r '.label // empty' settings.json 2>/dev/null || true)
          if [ -z "$LABEL" ]; then LABEL=$APP; fi
          ORI=$(jq -r '.ori // "auto"' settings.json 2>/dev/null || echo auto)
          case "$ORI" in
            portrait) OR=portrait ;;
            landscape) OR=landscape ;;
            *) OR=all ;;
          esac
          VN=$(jq -r '.versionName // "1.0"' settings.json 2>/dev/null || echo 1.0)
          VC=$(jq -r '.versionCode // 1' settings.json 2>/dev/null || echo 1)
          REQ=$(cat /tmp/req.txt)
          PERMS=$(cat /tmp/perms.txt)
          cat > buildozer.spec <<EOF
          [app]
          title = $LABEL
          package.name = $NAM
          package.domain = $DOM
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,ttf
          version = $VN
          requirements = $REQ
          orientation = $OR
          fullscreen = 0
          android.numeric_version = $VC
          android.permissions = $PERMS
          android.api = 33
          android.minapi = 24
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          p4a.branch = v2024.01.21
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          sed -i 's/^ *//' buildozer.spec
          if [ -f icon.png ]; then sed -i '/^\[app\]/a icon.filename = %(source.dir)s/icon.png' buildozer.spec; fi
      - name: build
        working-directory: apps/${{ inputs.app }}
        run: buildozer -v android debug
      - name: verify signing
        if: always()
        continue-on-error: true
        run: |
          APK=$(ls apps/$APP/bin/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then echo "no apk to verify"; exit 0; fi
          AS=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/apksigner 2>/dev/null | tail -n 1)
          if [ -z "$AS" ]; then echo "apksigner not found"; exit 0; fi
          PASS=$(grep '^pass=' keys/$APP.properties | cut -d= -f2)
          A=$("$AS" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          K=$(keytool -list -v -keystore keys/$APP.keystore -storepass "$PASS" -alias appkey 2>/dev/null | grep -i "SHA256:" | head -n 1 | awk '{print $NF}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "apk:      $A"
          echo "keystore: $K"
          if [ -n "$A" ] && [ "$A" = "$K" ]; then echo "SIGNING OK: this app uses its own key"; else echo "SIGNING MISMATCH"; fi
      - name: save buildozer global cache
        if: always() && steps.gcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v5
      - name: release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-${{ inputs.app }}-build-${{ github.run_number }}
          files: apps/${{ inputs.app }}/bin/*.apk

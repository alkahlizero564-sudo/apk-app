name: Create Keystore
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate keystore
        run: |
          mkdir -p keys
          keytool -genkeypair -v -keystore keys/shared.keystore \
            -alias shared -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Shared, O=MyApps, C=SD"
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add keys/shared.keystore
          git commit -m "add shared keystore"
          git push
